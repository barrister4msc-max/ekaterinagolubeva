name: TEMP P0-A2 FNS Open Data network probe

on:
  push:
    branches:
      - feat/p0a-fns-open-data-intake
  pull_request:
    branches:
      - feat/p0a-source-family-orchestration

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe pinned FNS releases and schemas
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://file.nalog.ru/opendata/7707329152-sshr2019/data-20260625-structure-20200408.zip'
            'https://file.nalog.ru/opendata/7707329152-sshr2019/structure-20200408.xsd'
            'https://file.nalog.ru/opendata/7707329152-debtam/data-20260625-structure-20181201.zip'
            'https://file.nalog.ru/opendata/7707329152-debtam/structure-20181201.xsd'
            'https://file.nalog.ru/opendata/7707329152-snr/data-20260725-structure-20230425.zip'
            'https://file.nalog.ru/opendata/7707329152-snr/structure-20230425.xsd'
            'https://data.nalog.ru/opendata/7707329152-taxoffence/data-20251201-structure-20191201.zip'
            'https://data.nalog.ru/opendata/7707329152-taxoffence/structure-20181201.xsd'
            'https://file.nalog.ru/opendata/7707329152-revexp/data-20260625-structure-20180110.zip'
            'https://file.nalog.ru/opendata/7707329152-revexp/structure-20180110.xsd'
          )
          for url in "${urls[@]}"; do
            echo "PROBE $url"
            curl --location --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --range 0-0 --dump-header /tmp/headers --output /tmp/byte "$url"
            status=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/headers)
            type=$(awk -F': ' 'tolower($1)=="content-type" {gsub("\r", "", $2); v=$2} END {print v}' /tmp/headers)
            length=$(awk -F': ' 'tolower($1)=="content-range" {gsub("\r", "", $2); split($2,a,"/"); v=a[2]} END {print v}' /tmp/headers)
            echo "RESULT status=${status:-unknown} content_type=${type:-unknown} total_length=${length:-unknown}"
            test "$status" = "206" -o "$status" = "200"
          done
