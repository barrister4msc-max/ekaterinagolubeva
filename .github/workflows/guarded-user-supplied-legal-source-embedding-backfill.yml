name: Guarded User-Supplied Legal Source Embedding Backfill

on:
  workflow_dispatch:
    inputs:
      source_groups_json:
        description: Exact JSON array of already-audited source_group_id values
        required: true
        type: string
        default: '["16887b7d-3714-52bd-8138-491a10a22043","5a12d4f2-9b84-545e-be36-c1b63138a73f","8377b26c-aaff-5300-a769-838148e43cf3","d6b6bfb9-6a2a-52eb-9f59-5a9260db0a0c","ef0d1258-a1b2-5c30-9adf-ca1ed52c8031"]'
      expected_source_groups:
        description: Exact number of source groups selected
        required: true
        type: number
        default: 5
      expected_chunks:
        description: Exact number of pending chunks selected
        required: true
        type: number
        default: 171
      apply_to_production:
        description: Actually write embeddings in Production
        required: true
        type: boolean
        default: false
      confirmation:
        description: Type I_CONFIRM_GUARDED_USER_SOURCE_EMBEDDINGS exactly
        required: true
        type: string

permissions:
  contents: read

jobs:
  fail-closed-dispatch-validation:
    runs-on: ubuntu-latest
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      SOURCE_GROUPS_JSON: ${{ inputs.source_groups_json }}
      EXPECTED_SOURCE_GROUPS: ${{ inputs.expected_source_groups }}
      EXPECTED_CHUNKS: ${{ inputs.expected_chunks }}
    steps:
      - name: Require main, exact confirmation and bounded source batch
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${CONFIRMATION}" == "I_CONFIRM_GUARDED_USER_SOURCE_EMBEDDINGS" ]]
          python - <<'PY'
          import json
          import os
          import uuid

          group_ids = json.loads(os.environ["SOURCE_GROUPS_JSON"])
          if not isinstance(group_ids, list) or not 1 <= len(group_ids) <= 50:
              raise SystemExit("source_groups_json must contain 1..50 values")
          if len(group_ids) != int(os.environ["EXPECTED_SOURCE_GROUPS"]):
              raise SystemExit("source group count mismatch")
          if int(os.environ["EXPECTED_CHUNKS"]) < len(group_ids):
              raise SystemExit("expected chunks is not credible")
          normalized = [str(uuid.UUID(value)) for value in group_ids]
          if len(set(normalized)) != len(normalized):
              raise SystemExit("source group IDs must be unique")
          PY

  dry-run:
    needs: fail-closed-dispatch-validation
    runs-on: ubuntu-latest
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.KATI_INTERNAL_KB_DATABASE_URL }}
      SOURCE_GROUPS_JSON: ${{ inputs.source_groups_json }}
      EXPECTED_SOURCE_GROUPS: ${{ inputs.expected_source_groups }}
      EXPECTED_CHUNKS: ${{ inputs.expected_chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.3'
      - name: Inspect exact guarded source batch without a write
        run: >-
          python scripts/backfill_user_supplied_legal_embeddings.py
          --source-groups-json "${SOURCE_GROUPS_JSON}"
          --expected-source-groups "${EXPECTED_SOURCE_GROUPS}"
          --expected-chunks "${EXPECTED_CHUNKS}"

  apply:
    if: ${{ inputs.apply_to_production }}
    needs: dry-run
    runs-on: ubuntu-latest
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.KATI_INTERNAL_KB_DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SOURCE_GROUPS_JSON: ${{ inputs.source_groups_json }}
      EXPECTED_SOURCE_GROUPS: ${{ inputs.expected_source_groups }}
      EXPECTED_CHUNKS: ${{ inputs.expected_chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.3'
      - name: Apply one exact embedding transaction
        run: >-
          python scripts/backfill_user_supplied_legal_embeddings.py
          --source-groups-json "${SOURCE_GROUPS_JSON}"
          --expected-source-groups "${EXPECTED_SOURCE_GROUPS}"
          --expected-chunks "${EXPECTED_CHUNKS}"
          --apply
      - name: Read-only post-index audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import psycopg

          group_ids = json.loads(os.environ["SOURCE_GROUPS_JSON"])
          expected_groups = int(os.environ["EXPECTED_SOURCE_GROUPS"])
          expected_chunks = int(os.environ["EXPECTED_CHUNKS"])
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute(
                  """
                  select
                    count(distinct metadata->>'source_group_id'),
                    count(*),
                    count(*) filter (where metadata->>'is_source_head' = 'true'),
                    count(*) filter (where embedding is not null),
                    count(*) filter (where embedding is null),
                    bool_and(metadata->>'official_origin_verified' = 'false'),
                    bool_and(metadata->>'content_verified' = 'false'),
                    bool_and(metadata->>'substantive_use_allowed' = 'false'),
                    bool_and(metadata->>'use_in_generation' = 'false')
                  from public.legal_knowledge_chunks
                  where metadata->>'source_group_id' = any(%s)
                  """,
                  (group_ids,),
              )
              groups, chunks, heads, completed, pending, origin_ok, content_ok, substantive_ok, generation_ok = cur.fetchone()
          assert groups == expected_groups, (groups, expected_groups)
          assert chunks == expected_chunks, (chunks, expected_chunks)
          assert heads == expected_groups, (heads, expected_groups)
          assert completed == expected_chunks and pending == 0, (completed, pending)
          assert all((origin_ok, content_ok, substantive_ok, generation_ok))
          print(json.dumps({
              "source_groups": groups,
              "source_heads": heads,
              "chunks": chunks,
              "completed_embeddings": completed,
              "pending_embeddings": pending,
              "fail_closed": True,
          }))
          PY
