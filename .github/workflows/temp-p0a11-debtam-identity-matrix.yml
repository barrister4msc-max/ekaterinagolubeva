name: TEMP P0-A11 DEBTAM identity matrix

on:
  push:
    branches:
      - feat/p0a11-debtam-canonical-identity-matrix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Install
        id: install
        continue-on-error: true
        run: bun install --frozen-lockfile
      - name: DEBTAM identity and matrix tests
        id: debt_matrix
        continue-on-error: true
        run: bun test ./supabase/functions/analyze-document-legal-position/company-tax-debt-evidence-matrix.test.ts
      - name: Factual regressions
        id: regressions
        continue-on-error: true
        run: |
          bun test ./supabase/functions/analyze-document-legal-position/company-factual-identity.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-factual-evidence-matrix.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-tax-debt-evidence.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-factual-runtime.test.ts
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: Diff check
        id: diffcheck
        continue-on-error: true
        run: git diff --check origin/feat/p0a10-debtam-runtime-evidence...HEAD
      - name: Record outcomes
        if: always()
        env:
          BRANCH: feat/p0a11-debtam-canonical-identity-matrix
          INSTALL: ${{ steps.install.outcome }}
          DEBT_MATRIX: ${{ steps.debt_matrix.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
        run: |
          cat > .tmp-p0a11-verification-status.txt <<EOF
          install=$INSTALL
          debt_matrix=$DEBT_MATRIX
          regressions=$REGRESSIONS
          typecheck=$TYPECHECK
          diffcheck=$DIFFCHECK
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-p0a11-verification-status.txt
          git commit -m "chore: record P0-A11 verification outcomes"
          git push origin HEAD:"$BRANCH"
      - name: Enforce GREEN
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          DEBT_MATRIX: ${{ steps.debt_matrix.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
        run: |
          test "$INSTALL" = success
          test "$DEBT_MATRIX" = success
          test "$REGRESSIONS" = success
          test "$TYPECHECK" = success
          test "$DIFFCHECK" = success
