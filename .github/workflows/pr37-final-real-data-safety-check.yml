name: PR37 Final Real-Data Safety Check

on:
  push:
    branches: [feat/law7-controlled-real-data-poc]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: law7_guard
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d law7_guard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bun install --frozen-lockfile
      - run: bun test supabase/tests/law7-controlled-real-data-poc.test.ts
      - run: bun test supabase/functions/analyze-document-legal-position/law7-supabase-transport.test.ts supabase/functions/analyze-document-legal-position/law7-repository-wiring.test.ts supabase/functions/analyze-document-legal-position/law7-provider.test.ts
      - name: Execute mirror + temporal guard migrations
        run: |
          psql -h 127.0.0.1 -U postgres -d law7_guard -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role;"
          psql -h 127.0.0.1 -U postgres -d law7_guard -v ON_ERROR_STOP=1 -f supabase/migrations/20260818133000_law7_mirror_poc.sql
          psql -h 127.0.0.1 -U postgres -d law7_guard -v ON_ERROR_STOP=1 -f supabase/migrations/20260818152000_law7_mirror_temporal_fail_closed.sql
          psql -h 127.0.0.1 -U postgres -d law7_guard -v ON_ERROR_STOP=1 <<'SQL'
          insert into law7_mirror.codes(code,name) values ('NK_RF','НК РФ');
          insert into law7_mirror.article_versions(code_id,article_number,version_date,article_text,is_current) values ('NK_RF','54.1','2000-07-31','fixture',true);
          insert into law7_mirror.sync_state(dataset_key,status,source_repository,article_versions_count,metadata) values ('law7_codes_poc','completed','test',1,'{"historical_coverage":"unverified"}'::jsonb);
          do $$ begin
            if not public.law7_mirror_is_available() then raise exception 'availability'; end if;
            if (select count(*) from public.law7_mirror_get_article_version('NK_RF','54.1',null)) <> 1 then raise exception 'current'; end if;
            if (select count(*) from public.law7_mirror_get_article_version('NK_RF','54.1','2021-01-01')) <> 0 then raise exception 'historical'; end if;
            if (select count(*) from public.law7_mirror_trace_amendment_history('NK_RF','54.1',20)) <> 0 then raise exception 'history'; end if;
          end $$;
          SQL
      - run: python -m py_compile scripts/law7_controlled_export.py scripts/law7_mirror_import.py
      - run: bun test supabase/functions/analyze-document-legal-position/*.test.ts
      - run: git fetch origin main && git diff --check origin/main...HEAD
      - run: bun run typecheck
      - run: bun run build
      - run: |
          deno check --no-lock --node-modules-dir=auto supabase/functions/analyze-document-legal-position/law7-supabase-transport.ts
          deno check --no-lock --node-modules-dir=auto supabase/functions/analyze-document-legal-position/repositories.ts
