name: PR32 Temporal Contract Apply

on:
  push:
    branches:
      - feat/official-legal-sources-layer

permissions:
  contents: write

jobs:
  apply-check-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-legal-sources-layer
          fetch-depth: 0

      - name: Apply temporal contract and remove Lovable research transport
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/analyze-document-legal-position/fact-extraction.ts')
          s = p.read_text()
          s = s.replace('const LOVABLE_API_KEY = Deno.env.get("LOVABLE_API_KEY") ?? "";\n', '')
          s = s.replace('const LOVABLE_FLASH_MODEL = "google/gemini-2.5-flash";\n', '')

          marker = 'export type ResearchQuery = {\n'
          temporal_type = '''export type TemporalAnchorRole =\n  | "contract_date"\n  | "transaction_date"\n  | "tax_period"\n  | "inspection_period"\n  | "requirement_date"\n  | "authority_decision_date"\n  | "court_event_date"\n  | "other_relevant_legal_date";\n\nexport type TemporalAnchor = {\n  role: TemporalAnchorRole;\n  label: string;\n  date: string | null;\n  date_from: string | null;\n  date_to: string | null;\n  basis: string;\n};\n\n'''
          if temporal_type not in s:
            if marker not in s: raise SystemExit('ResearchQuery marker not found')
            s = s.replace(marker, temporal_type + marker, 1)

          marker = '  dates: string[];\n'
          add = marker + '  temporal_anchors: TemporalAnchor[];\n'
          if add not in s:
            s = s.replace(marker, add, 1)
          marker = '  dates: [],\n'
          add = marker + '  temporal_anchors: [],\n'
          if add not in s:
            s = s.replace(marker, add, 1)

          start = s.find('// ---------- LLM call ----------\nasync function callFlashViaLovable')
          end = s.find('import { callGeminiWithFallback', start)
          if start != -1 and end != -1:
            s = s[:start] + '// ---------- LLM call ----------\n' + s[end:]

          s = s.replace('  "dates": [string],\n', '  "dates": [string],\n  "temporal_anchors": [{"role": string, "label": string, "date": string|null, "date_from": string|null, "date_to": string|null, "basis": string}],\n', 1)
          s = s.replace('- dates: ВСЕ значимые даты (договор, требование, решение, сроки).\n', '- dates: ВСЕ значимые даты (договор, требование, решение, сроки).\n- temporal_anchors: только явно установленные из документов/ответов даты или периоды, которые могут определять применимую редакцию права. role только из: contract_date, transaction_date, tax_period, inspection_period, requirement_date, authority_decision_date, court_event_date, other_relevant_legal_date. Не угадывай роль и не создавай anchor, если связь даты с событием не установлена. Для периода используй date_from/date_to; для точечной даты — date. basis — кратко, из какого установленного обстоятельства следует роль даты.\n', 1)

          s = s.replace('  let raw = await callFlashViaLovable(prompt);\n  if (!raw) raw = await callFlashViaGemini(prompt);', '  const raw = await callFlashViaGemini(prompt);', 1)
          s = s.replace('[fact-extraction] no LLM response (LOVABLE_API_KEY/GEMINI_API_KEY missing or error)', '[fact-extraction] no LLM response (GEMINI_API_KEY missing or error)', 1)

          marker = '''  const normStr = (v: unknown): string | null => {\n    const s = typeof v === "string" ? v.trim() : "";\n    return s ? s : null;\n  };\n'''
          temporal_norm = marker + '''  const temporalRoles = new Set<TemporalAnchorRole>([\n    "contract_date",\n    "transaction_date",\n    "tax_period",\n    "inspection_period",\n    "requirement_date",\n    "authority_decision_date",\n    "court_event_date",\n    "other_relevant_legal_date",\n  ]);\n  const normTemporalAnchors = (value: unknown): TemporalAnchor[] => {\n    if (!Array.isArray(value)) return [];\n    const out: TemporalAnchor[] = [];\n    for (const raw of value) {\n      if (!raw || typeof raw !== "object") continue;\n      const record = raw as Record<string, unknown>;\n      const role = normStr(record.role) as TemporalAnchorRole | null;\n      const label = normStr(record.label);\n      const date = normStr(record.date);\n      const dateFrom = normStr(record.date_from);\n      const dateTo = normStr(record.date_to);\n      const basis = normStr(record.basis);\n      if (!role || !temporalRoles.has(role) || !label || !basis) continue;\n      if (!date && !dateFrom && !dateTo) continue;\n      out.push({ role, label, date, date_from: dateFrom, date_to: dateTo, basis });\n    }\n    return out.slice(0, 16);\n  };\n'''
          if 'const normTemporalAnchors' not in s:
            if marker not in s: raise SystemExit('normStr marker not found')
            s = s.replace(marker, temporal_norm, 1)

          marker = '    dates: norm(llmQuery.dates),\n'
          add = marker + '    temporal_anchors: normTemporalAnchors(llmQuery.temporal_anchors),\n'
          if add not in s:
            s = s.replace(marker, add, 1)

          # Replace Lovable embedding with official direct Gemini embedContent.
          embed_start = s.find('export async function embedQuery(text: string): Promise<number[] | null> {')
          if embed_start == -1: raise SystemExit('embedQuery start not found')
          embed_new = '''export async function embedQuery(text: string): Promise<number[] | null> {\n  if (!GEMINI_API_KEY || !text.trim()) return null;\n  try {\n    const res = await fetch(\n      "https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent",\n      {\n        method: "POST",\n        headers: {\n          "Content-Type": "application/json",\n          "x-goog-api-key": GEMINI_API_KEY,\n        },\n        body: JSON.stringify({\n          model: "models/gemini-embedding-001",\n          content: { parts: [{ text: text.slice(0, 8000) }] },\n          embedContentConfig: {\n            taskType: "RETRIEVAL_QUERY",\n            outputDimensionality: 1536,\n          },\n        }),\n      },\n    );\n    if (!res.ok) {\n      console.error("[fact-extraction] Gemini embedding error", res.status);\n      return null;\n    }\n    const data = await res.json();\n    const embedding = data?.embedding?.values;\n    return Array.isArray(embedding) && embedding.length === 1536 ? embedding : null;\n  } catch (error) {\n    console.error("[fact-extraction] Gemini embedding exception", error);\n    return null;\n  }\n}\n'''
          s = s[:embed_start] + embed_new
          p.write_text(s)

          # Extend research-routing with issue-specific explicit anchors.
          p = Path('supabase/functions/analyze-document-legal-position/research-routing.ts')
          s = p.read_text()
          s = s.replace('import type { ResearchQuery } from "./fact-extraction.ts";', 'import type { ResearchQuery, TemporalAnchor } from "./fact-extraction.ts";', 1)
          marker = '  temporal_terms: string[];\n'
          add = marker + '  temporal_anchors: TemporalAnchor[];\n'
          if add not in s: s = s.replace(marker, add, 1)

          helper_marker = 'function bucketsForIssue(issue: string): Bucket[] {\n'
          helper = '''function temporalAnchorsForIssue(query: ResearchQuery, issue: string): TemporalAnchor[] {\n  const anchors = query.temporal_anchors ?? [];\n  if (anchors.length === 0) return [];\n  const lower = issue.toLowerCase();\n  const preferred = new Set<string>();\n  if (/налог|54\\.1|ндс|вычет|доначис|реконструкц/iu.test(lower)) {\n    ["tax_period", "transaction_date", "inspection_period", "requirement_date", "authority_decision_date"].forEach((role) => preferred.add(role));\n  }\n  if (/провер|требован|решени.{0,10}налог|процессуальн/iu.test(lower)) {\n    ["inspection_period", "requirement_date", "authority_decision_date"].forEach((role) => preferred.add(role));\n  }\n  if (/договор|сделк|поставк|исполн|операци/iu.test(lower)) {\n    ["contract_date", "transaction_date"].forEach((role) => preferred.add(role));\n  }\n  if (/суд|кассац|апелляц|процесс|судеб/iu.test(lower)) preferred.add("court_event_date");\n  if (preferred.size === 0) return anchors.slice(0, 8);\n  return anchors.filter((anchor) => preferred.has(anchor.role)).slice(0, 8);\n}\n\n'''
          if 'function temporalAnchorsForIssue' not in s:
            if helper_marker not in s: raise SystemExit('routing helper marker not found')
            s = s.replace(helper_marker, helper + helper_marker, 1)

          old = '''      temporal_terms: uniq([\n        issue,\n        ...(query.dates ?? []),\n        ...(query.metadata_terms ?? []).filter((value) => /период|дата|редакц|действовал|год/iu.test(value)),\n      ]).slice(0, 12),\n      buckets: bucketsForIssue(issue),'''
          new = '''      temporal_terms: uniq([\n        issue,\n        ...temporalAnchorsForIssue(query, issue).flatMap((anchor) => [\n          anchor.label,\n          anchor.date,\n          anchor.date_from,\n          anchor.date_to,\n        ]),\n        ...(query.metadata_terms ?? []).filter((value) => /период|дата|редакц|действовал|год/iu.test(value)),\n      ]).slice(0, 12),\n      temporal_anchors: temporalAnchorsForIssue(query, issue),\n      buckets: bucketsForIssue(issue),'''
          if new not in s:
            if old not in s: raise SystemExit('temporal terms block not found')
            s = s.replace(old, new, 1)
          p.write_text(s)

          # Update tests' empty query and expectations.
          p = Path('supabase/functions/analyze-document-legal-position/research-routing.test.ts')
          s = p.read_text()
          if '  temporal_anchors: [],\n' not in s:
            s = s.replace('  dates: [],\n', '  dates: [],\n  temporal_anchors: [],\n', 1)
          old = '''      dates: ["2022-03-01"],\n    });\n\n    const issue = buildResearchPlan(q).questions[0];\n    expect(issue.adverse_terms.some((x) => x.includes("против позиции"))).toBe(true);\n    expect(issue.temporal_terms).toContain("2022-03-01");'''
          new = '''      dates: ["2022-03-01"],\n      temporal_anchors: [{\n        role: "transaction_date",\n        label: "Дата спорной операции",\n        date: "2022-03-01",\n        date_from: null,\n        date_to: null,\n        basis: "Дата прямо указана в материалах сделки",\n      }],\n    });\n\n    const issue = buildResearchPlan(q).questions[0];\n    expect(issue.adverse_terms.some((x) => x.includes("против позиции"))).toBe(true);\n    expect(issue.temporal_terms).toContain("2022-03-01");\n    expect(issue.temporal_anchors).toHaveLength(1);\n    expect(issue.temporal_anchors[0].role).toBe("transaction_date");'''
          if old in s: s = s.replace(old, new, 1)
          p.write_text(s)

          # Coverage fixture must satisfy new ResearchQuestion field.
          p = Path('supabase/functions/analyze-document-legal-position/research-coverage.test.ts')
          s = p.read_text()
          s = s.replace('        argument_terms: [], adverse_terms: [], temporal_terms: [],\n', '        argument_terms: [], adverse_terms: [], temporal_terms: [], temporal_anchors: [],\n')
          p.write_text(s)
          PY

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Contract tests
        run: bun test supabase/functions/analyze-document-legal-position/research-routing.test.ts supabase/functions/analyze-document-legal-position/research-coverage.test.ts supabase/functions/analyze-document-legal-position/dedupe-canonical.test.ts supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts

      - name: Assert Lovable research transport removed
        run: |
          if grep -n "ai.gateway.lovable.dev\|LOVABLE_API_KEY" supabase/functions/analyze-document-legal-position/fact-extraction.ts; then
            echo "Lovable research transport still present"
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Commit source files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-document-legal-position/fact-extraction.ts supabase/functions/analyze-document-legal-position/research-routing.ts supabase/functions/analyze-document-legal-position/research-routing.test.ts supabase/functions/analyze-document-legal-position/research-coverage.test.ts
          git commit -m "feat(research): add explicit temporal anchors and direct Gemini transport"
          git push origin HEAD:feat/official-legal-sources-layer
