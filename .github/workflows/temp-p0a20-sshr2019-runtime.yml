name: TEMP P0-A20 SSHR2019 runtime
on:
  push:
    branches: [feat/p0a20-sshr2019-runtime-factual-evidence]
  pull_request:
    branches: [feat/p0a19-sshr2019-parser-storage-rpc]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.22 }
      - name: Patch Analyzer and runtime regression
        id: patch
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('supabase/functions/analyze-document-legal-position/index.ts')
          s=p.read_text()
          if 'company_average_headcount_evidence: companyFactualRuntime.company_average_headcount_evidence,' not in s:
              pat=re.compile(r'(?m)^(\s*)company_financial_statement_evidence: companyFactualRuntime\.company_financial_statement_evidence,\n')
              def repl(m):
                  i=m.group(1)
                  return m.group(0)+f'{i}company_average_headcount_evidence: companyFactualRuntime.company_average_headcount_evidence,\n'
              s,n=pat.subn(repl,s)
              assert n==4,n
          anchor='    parsed.company_financial_statement_evidence = companyFactualRuntime.company_financial_statement_evidence;\n'
          if 'parsed.company_average_headcount_evidence = companyFactualRuntime.company_average_headcount_evidence;' not in s:
              assert s.count(anchor)==1,s.count(anchor)
              s=s.replace(anchor,anchor+'    // P0-A20: SSHR2019 average-headcount evidence remains audit-only.\n    parsed.company_average_headcount_evidence = companyFactualRuntime.company_average_headcount_evidence;\n',1)
          p.write_text(s)

          t=Path('supabase/functions/analyze-document-legal-position/fns-company-factual-runtime.test.ts')
          x=t.read_text()
          if 'const HEADCOUNT_SHA' not in x:
              x=x.replace('const DEBT_SHA = "0bf119d728c4c6876e6aebe2331bfbfe8a9c0db87682b89d18e3b3d70a8845f5";\n', 'const DEBT_SHA = "0bf119d728c4c6876e6aebe2331bfbfe8a9c0db87682b89d18e3b3d70a8845f5";\nconst HEADCOUNT_SHA = "265eca8b05a234ff629f57779ebbc647d07e42c7e43612b40e9ae84340de1464";\n')
              insert='''\nfunction headcountRow(overrides: Record<string, unknown> = {}) {\n  return {\n    inn: "7701234567", organization_name: "ООО Ромашка", average_headcount: 0,\n    document_id: "headcount-doc-1", document_date: "2026-07-25", reporting_date: "2025-12-31",\n    dataset_id: "7707329152-sshr2019",\n    source_url: "https://file.nalog.ru/opendata/7707329152-sshr2019/data-20260725-structure-20200408.zip",\n    source_sha256: HEADCOUNT_SHA, ...overrides,\n  };\n}\n'''
              x=x.replace('\ndescribe("Company factual runtime boundary", () => {',insert+'\ndescribe("Company factual runtime boundary", () => {',1)
          x=x.replace('expect(snapshot.company_tax_debt_evidence).toEqual([]);\n    expect(snapshot.diagnostics).toEqual({', 'expect(snapshot.company_tax_debt_evidence).toEqual([]);\n    expect(snapshot.company_average_headcount_evidence).toEqual([]);\n    expect(snapshot.diagnostics).toEqual({',1)
          old='''    expect(calls.map((call) => call.fn).sort()).toEqual([\n      "fns_open_data_get_financial_statement_text",\n      "fns_open_data_get_tax_debts_text",\n      "fns_open_data_get_tax_regime",\n    ]);'''
          new='''    expect(calls.map((call) => call.fn).sort()).toEqual([\n      "fns_open_data_get_average_headcount",\n      "fns_open_data_get_financial_statement_text",\n      "fns_open_data_get_tax_debts_text",\n      "fns_open_data_get_tax_regime",\n    ]);'''
          if old in x: x=x.replace(old,new,1)
          marker='''          if (fn === "fns_open_data_get_tax_debts_text") {\n            return {\n              data: [\n                debtRow(),\n                debtRow({ tax_name: "НДС", tax_debt_amount: "0.00", penalty_amount: "10.00", fine_amount: "5.00", total_debt_amount: "15.00", debt_row_ordinal: 2 }),\n              ],\n              error: null,\n            };\n          }'''
          if 'if (fn === "fns_open_data_get_average_headcount")' not in x:
              x=x.replace(marker,marker+'\n          if (fn === "fns_open_data_get_average_headcount") return { data: [headcountRow()], error: null };',1)
          x=x.replace('expect(snapshot.diagnostics.loaded_count).toBe(3);','expect(snapshot.company_average_headcount_evidence).toHaveLength(1);\n    expect(snapshot.company_average_headcount_evidence[0]?.attributes.average_headcount).toBe(0);\n    expect(snapshot.diagnostics.loaded_count).toBe(4);',1)
          if 'dataset_diagnostics.sshr2019' not in x:
              x=x.replace('expect(snapshot.dataset_diagnostics.debtam).toMatchObject({ loaded_count: 1, evidence_rows: 2, fact_kind: "tax_debt" });','expect(snapshot.dataset_diagnostics.debtam).toMatchObject({ loaded_count: 1, evidence_rows: 2, fact_kind: "tax_debt" });\n    expect(snapshot.dataset_diagnostics.sshr2019).toMatchObject({ loaded_count: 1, evidence_rows: 1, fact_kind: "headcount" });',1)
          t.write_text(x)
          PY
          git diff --check
          if [ "${{ github.event_name }}" = "push" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add supabase/functions/analyze-document-legal-position/index.ts supabase/functions/analyze-document-legal-position/fns-company-factual-runtime.test.ts
            if ! git diff --cached --quiet; then
              git commit -m "feat: persist SSHR2019 factual runtime evidence"
              git push origin HEAD:feat/p0a20-sshr2019-runtime-factual-evidence
            fi
          fi
      - name: Install
        id: install
        continue-on-error: true
        run: bun install --frozen-lockfile
      - name: Adapter tests
        id: adapter
        continue-on-error: true
        run: bun test ./supabase/functions/analyze-document-legal-position/fns-company-headcount-evidence.test.ts
      - name: Runtime tests
        id: runtime
        continue-on-error: true
        run: bun test ./supabase/functions/analyze-document-legal-position/fns-company-factual-runtime.test.ts
      - name: Orchestration boundary
        id: orchestration
        continue-on-error: true
        run: bun test ./supabase/functions/analyze-document-legal-position/company-headcount-orchestration.test.ts
      - name: Existing factual regressions
        id: regressions
        continue-on-error: true
        run: |
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-financial-statement-evidence.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-revexp-runtime.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-financial-statement-evidence-matrix.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-tax-debt-evidence-matrix.test.ts
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: Diffcheck
        id: diffcheck
        continue-on-error: true
        run: git diff --check origin/feat/p0a19-sshr2019-parser-storage-rpc...HEAD
      - name: Record
        if: always() && github.event_name == 'push'
        env:
          PATCH: ${{ steps.patch.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          ADAPTER: ${{ steps.adapter.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          ORCH: ${{ steps.orchestration.outcome }}
          REG: ${{ steps.regressions.outcome }}
          TYPE: ${{ steps.typecheck.outcome }}
          DIFF: ${{ steps.diffcheck.outcome }}
        run: |
          printf 'patch=%s\ninstall=%s\nadapter=%s\nruntime=%s\norchestration=%s\nregressions=%s\ntypecheck=%s\ndiffcheck=%s\n' "$PATCH" "$INSTALL" "$ADAPTER" "$RUNTIME" "$ORCH" "$REG" "$TYPE" "$DIFF" > .tmp-p0a20-verification-status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp-p0a20-verification-status.txt
          git commit -m "chore: record P0-A20 verification outcomes"
          git push origin HEAD:feat/p0a20-sshr2019-runtime-factual-evidence
      - name: Enforce GREEN
        if: always()
        env:
          PATCH: ${{ steps.patch.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          ADAPTER: ${{ steps.adapter.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          ORCH: ${{ steps.orchestration.outcome }}
          REG: ${{ steps.regressions.outcome }}
          TYPE: ${{ steps.typecheck.outcome }}
          DIFF: ${{ steps.diffcheck.outcome }}
        run: |
          test "$PATCH" = success && test "$INSTALL" = success && test "$ADAPTER" = success && test "$RUNTIME" = success && test "$ORCH" = success && test "$REG" = success && test "$TYPE" = success && test "$DIFF" = success
