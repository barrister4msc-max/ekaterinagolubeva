name: PR32 Research Coverage Source Apply

on:
  push:
    branches:
      - feat/official-legal-sources-layer

permissions:
  contents: write

jobs:
  apply-check-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-legal-sources-layer
          fetch-depth: 0

      - name: Wire issue coverage into existing pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) TrustedSource carries research issue trace.
          p = Path('supabase/functions/analyze-document-legal-position/enrich.ts')
          s = p.read_text()
          marker = '  actually_used_in_generation: boolean;\n};'
          repl = '''  actually_used_in_generation: boolean;\n  // Search provenance: which legal research questions produced this source.\n  research_issue_ids?: string[];\n  research_issue_texts?: string[];\n  research_modes?: string[];\n};'''
          if repl not in s:
            if marker not in s:
              raise SystemExit('TrustedSource marker not found')
            s = s.replace(marker, repl, 1)

          old = '''export function evaluateSufficiency(opts: {\n  trusted: TrustedSource[];\n  conclusions: Conclusion[];\n}): {'''
          new = '''export function evaluateSufficiency(opts: {\n  trusted: TrustedSource[];\n  conclusions: Conclusion[];\n  researchCoverageGaps?: string[];\n}): {'''
          if new not in s:
            if old not in s:
              raise SystemExit('evaluateSufficiency signature not found')
            s = s.replace(old, new, 1)

          marker = '  if (!hasHighCourt) gaps.push("Нет практики ВС РФ / кассации по вопросу");\n'
          addition = marker + '''  for (const gap of opts.researchCoverageGaps ?? []) {\n    if (gap && !gaps.includes(gap)) gaps.push(gap);\n  }\n'''
          if addition not in s:
            if marker not in s:
              raise SystemExit('sufficiency gap marker not found')
            s = s.replace(marker, addition, 1)
          p.write_text(s)

          # 2) Metadata Bridge carries issue trace through RawSource -> TrustedSource.
          p = Path('supabase/functions/analyze-document-legal-position/source-metadata-bridge.ts')
          s = p.read_text()
          marker = '  "transport",\n] as const;'
          repl = '  "transport",\n  "research_issue_ids",\n  "research_issue_texts",\n  "research_modes",\n] as const;'
          if repl not in s:
            if marker not in s:
              raise SystemExit('trusted metadata key marker not found')
            s = s.replace(marker, repl, 1)
          p.write_text(s)

          # 3) Return the exact ResearchPlan produced by Repository Layer.
          p = Path('supabase/functions/analyze-document-legal-position/repositories.ts')
          s = p.read_text()
          s = s.replace(
            'import { buildResearchPlan, queryForBucket, queryForQuestion, type ResearchQuestion } from "./research-routing.ts";',
            'import { buildResearchPlan, queryForBucket, queryForQuestion, type ResearchPlan, type ResearchQuestion } from "./research-routing.ts";',
          )
          old = '): Promise<{ sources: RawSource[]; counts: Record<string, number> }> {'
          new = '): Promise<{ sources: RawSource[]; counts: Record<string, number>; researchPlan: ResearchPlan }> {'
          if new not in s:
            if old not in s:
              raise SystemExit('runAllRepositories return type not found')
            s = s.replace(old, new, 1)
          old = '  return { sources, counts };\n}\n\n/**\n * Gap-targeted retry:'
          new = '  return { sources, counts, researchPlan };\n}\n\n/**\n * Gap-targeted retry:'
          if new not in s:
            if old not in s:
              raise SystemExit('runAllRepositories return not found')
            s = s.replace(old, new, 1)

          # 4) GAP search understands issue-scoped coverage gaps and annotates results.
          old_sig = '''export async function gapSearch(\n  sb: SbClient,\n  gaps: string[],\n  practiceArea: string | null,\n): Promise<RawSource[]> {'''
          new_sig = '''export async function gapSearch(\n  sb: SbClient,\n  gaps: string[],\n  practiceArea: string | null,\n  researchPlan?: ResearchPlan,\n): Promise<RawSource[]> {'''
          if new_sig not in s:
            if old_sig not in s:
              raise SystemExit('gapSearch signature not found')
            s = s.replace(old_sig, new_sig, 1)

          old_loop = '''  for (const gap of gaps.slice(0, 5)) {\n    const terms = gap\n      .replace(/[^\\p{L}\\p{N}\\s]+/gu, " ")\n      .split(/\\s+/)\n      .filter((t) => t.length >= 4)\n      .slice(0, 4);'''
          new_loop = '''  for (const gap of gaps.slice(0, 5)) {\n    const issueId = gap.match(/^\\[(issue-\\d+)\\]/)?.[1] ?? null;\n    const issue = issueId ? researchPlan?.questions.find((question) => question.id === issueId) ?? null : null;\n    const expectedBucket: Bucket | null = /позиция ФНС/iu.test(gap)\n      ? "fns_letters"\n      : /позиция Минфина/iu.test(gap)\n        ? "minfin_letters"\n        : null;\n    const searchText = issue?.issue ?? gap;\n    const terms = searchText\n      .replace(/[^\\p{L}\\p{N}\\s]+/gu, " ")\n      .split(/\\s+/)\n      .filter((t) => t.length >= 4)\n      .slice(0, 4);'''
          if new_loop not in s:
            if old_loop not in s:
              raise SystemExit('gapSearch loop marker not found')
            s = s.replace(old_loop, new_loop, 1)

          old_bucket = '''      else if (st.includes("minfin")) bucket = "minfin_letters";\n      out.push({'''
          new_bucket = '''      else if (st.includes("minfin")) bucket = "minfin_letters";\n      if (expectedBucket && bucket !== expectedBucket) continue;\n      out.push({'''
          if new_bucket not in s:
            if old_bucket not in s:
              raise SystemExit('gap bucket marker not found')
            s = s.replace(old_bucket, new_bucket, 1)

          old_meta = '        metadata: (r.metadata as Record<string, unknown>) ?? {},\n'
          new_meta = '''        metadata: {\n          ...((r.metadata as Record<string, unknown>) ?? {}),\n          ...(issue ? {\n            research_issue_ids: [issue.id],\n            research_issue_texts: [issue.issue],\n            research_modes: issue.modes,\n          } : {}),\n        },\n'''
          if new_meta not in s:
            if old_meta not in s:
              raise SystemExit('gap metadata marker not found')
            s = s.replace(old_meta, new_meta, 1)
          p.write_text(s)

          # 5) Existing orchestrator consumes coverage and passes gaps to existing Sufficiency/GAP.
          p = Path('supabase/functions/analyze-document-legal-position/index.ts')
          s = p.read_text()
          import_marker = 'import { runChallenge } from "./challenge.ts";\n'
          import_add = 'import { evaluateOfficialExplanationsCoverage } from "./research-coverage.ts";\n' + import_marker
          if 'evaluateOfficialExplanationsCoverage' not in s:
            if import_marker not in s:
              raise SystemExit('index import marker not found')
            s = s.replace(import_marker, import_add, 1)

          old = '    const { sources: repositorySources, counts } = await runAllRepositories(\n'
          new = '    const { sources: repositorySources, counts, researchPlan } = await runAllRepositories(\n'
          if new not in s:
            if old not in s:
              raise SystemExit('runAllRepositories destructure not found')
            s = s.replace(old, new, 1)

          old = '''    let validatedConclusions = validateConclusions(provBuild.conclusions, trusted);\n    let sufficiency = evaluateSufficiency({\n      trusted,\n      conclusions: validatedConclusions,\n    });'''
          new = '''    let validatedConclusions = validateConclusions(provBuild.conclusions, trusted);\n    let officialExplanationsCoverage = evaluateOfficialExplanationsCoverage({\n      plan: researchPlan,\n      trusted,\n    });\n    let sufficiency = evaluateSufficiency({\n      trusted,\n      conclusions: validatedConclusions,\n      researchCoverageGaps: officialExplanationsCoverage.gaps,\n    });'''
          if old not in s:
            raise SystemExit('initial sufficiency block not found')
          s = s.replace(old, new, 1)

          s = s.replace(
            '      const extraRaw = await gapSearch(sb, sufficiency.gaps, practiceArea);',
            '      const extraRaw = await gapSearch(sb, sufficiency.gaps, practiceArea, researchPlan);',
            1,
          )

          old = '''        validatedConclusions = validateConclusions(provBuild.conclusions, trusted);\n        sufficiency = evaluateSufficiency({\n          trusted,\n          conclusions: validatedConclusions,\n        });'''
          new = '''        validatedConclusions = validateConclusions(provBuild.conclusions, trusted);\n        officialExplanationsCoverage = evaluateOfficialExplanationsCoverage({\n          plan: researchPlan,\n          trusted,\n        });\n        sufficiency = evaluateSufficiency({\n          trusted,\n          conclusions: validatedConclusions,\n          researchCoverageGaps: officialExplanationsCoverage.gaps,\n        });'''
          if old not in s:
            raise SystemExit('retry sufficiency block not found')
          s = s.replace(old, new, 1)

          marker = '    parsed.source_sufficiency = sufficiency;\n'
          addition = marker + '    parsed.research_coverage = { official_explanations: officialExplanationsCoverage };\n'
          if addition not in s:
            if marker not in s:
              raise SystemExit('parsed sufficiency marker not found')
            s = s.replace(marker, addition, 1)
          p.write_text(s)
          PY

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Research coverage tests
        run: bun test supabase/functions/analyze-document-legal-position/research-routing.test.ts supabase/functions/analyze-document-legal-position/research-coverage.test.ts supabase/functions/analyze-document-legal-position/dedupe-canonical.test.ts supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Commit source files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-document-legal-position/enrich.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.ts supabase/functions/analyze-document-legal-position/repositories.ts supabase/functions/analyze-document-legal-position/index.ts
          git commit -m "feat(research): enforce issue-scoped explanation coverage"
          git push origin HEAD:feat/official-legal-sources-layer
