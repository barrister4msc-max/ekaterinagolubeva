name: Document builder compact UI

on:
  push:
    branches:
      - fix/document-builder-visual-scale

permissions:
  contents: write

jobs:
  apply-check-commit:
    if: ${{ github.event.head_commit.message == 'chore ui apply document builder compact layout v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/document-builder-visual-scale
          fetch-depth: 0

      - name: Apply compact builder UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/workspace.document-builder.tsx')
          s = p.read_text()

          replacements = [
            ('    <div className="space-y-7">\n      <header className="space-y-4">\n        <div>\n          <h1 className="font-display text-2xl text-foreground">Конструктор документов</h1>\n          <p className="mt-1 text-sm text-muted-foreground">1 Шаблон → 2 Карточка → 3 Опросник</p>\n        </div>\n        <Stepper step={step} />\n      </header>',
             '    <div className="mx-auto w-full max-w-[1180px] space-y-6">\n      <header className="space-y-3">\n        <div className="flex flex-wrap items-start justify-between gap-3">\n          <div>\n            <h1 className="font-display text-2xl text-foreground">Конструктор документов</h1>\n            <p className="mt-1 text-sm text-muted-foreground">1 Шаблон → 2 Карточка → 3 Опросник</p>\n          </div>\n          <button\n            type="button"\n            onClick={() => navigate({ to: "/workspace/dashboard" })}\n            className="inline-flex items-center gap-2 rounded-full border border-foreground/15 bg-background/55 px-3.5 py-2 text-xs font-medium text-foreground/75 backdrop-blur-sm transition hover:border-foreground/25 hover:bg-background/80 hover:text-foreground"\n          >\n            <ArrowLeft size={14} /> В дашборд\n          </button>\n        </div>\n        <Stepper step={step} />\n      </header>'),
            ('        <section className="db-card p-6 space-y-6">', '        <section className="db-card p-5 space-y-5">'),
            ('              <Search size={14} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground" />', '              <Search size={14} className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground" />'),
            ('                className="db-search w-full pl-9"', '                className="db-search w-full pr-9"'),
            ('        <section className="db-card p-7 space-y-6">', '        <section className="db-card p-6 space-y-5">'),
            ('.db-search, .db-select { height: 38px;', '.db-search, .db-select { height: 36px;'),
            ('.db-tcard { background: rgba(8,18,26,0.55); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 14px 14px 12px;', '.db-tcard { background: rgba(8,18,26,0.55); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 12px 12px 10px;'),
            ('.db-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;', '.db-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;'),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected block not found: {old[:100]}')
            s = s.replace(old, new)

          p.write_text(s)
          PY

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Remove temporary workflow and commit UI change
        run: |
          rm -f .github/workflows/document-builder-compact-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): compact document builder and add dashboard return"
          git push origin HEAD:fix/document-builder-visual-scale
