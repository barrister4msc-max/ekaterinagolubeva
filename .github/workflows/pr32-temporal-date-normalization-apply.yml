name: PR32 Temporal Date Normalization Apply

on:
  push:
    branches:
      - feat/official-legal-sources-layer

permissions:
  contents: write

jobs:
  apply-check-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-legal-sources-layer
          fetch-depth: 0
      - name: Use shared temporal date normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          # Fact Extraction: normalize anchor dates immediately after LLM output.
          p = Path('supabase/functions/analyze-document-legal-position/fact-extraction.ts')
          s = p.read_text()
          import_marker = 'import { callGeminiWithFallback, FLASH_GEMINI_MODELS } from "./gemini-fallback.ts";\n'
          import_add = import_marker + 'import { normalizeTemporalDate } from "./temporal-date.ts";\n'
          if 'import { normalizeTemporalDate }' not in s:
              if import_marker not in s: raise SystemExit('fact extraction import marker not found')
              s = s.replace(import_marker, import_add, 1)
          s = s.replace('      const date = normStr(record.date);\n      const dateFrom = normStr(record.date_from);\n      const dateTo = normStr(record.date_to);', '      const date = normalizeTemporalDate(record.date);\n      const dateFrom = normalizeTemporalDate(record.date_from);\n      const dateTo = normalizeTemporalDate(record.date_to);', 1)
          p.write_text(s)

          # Temporal evaluator: use the same parser for registry metadata and anchors.
          p = Path('supabase/functions/analyze-document-legal-position/temporal-applicability.ts')
          s = p.read_text()
          marker = 'import type { TrustedSource } from "./enrich.ts";\n'
          add = marker + 'import { normalizeTemporalDate } from "./temporal-date.ts";\n'
          if 'import { normalizeTemporalDate }' not in s:
              if marker not in s: raise SystemExit('temporal applicability import marker not found')
              s = s.replace(marker, add, 1)
          old = '''function dateOnly(value: unknown): string | null {\n  const raw = text(value);\n  if (!raw) return null;\n  const iso = raw.match(/^(\\d{4}-\\d{2}-\\d{2})/);\n  return iso?.[1] ?? null;\n}\n'''
          if old not in s: raise SystemExit('dateOnly block not found')
          s = s.replace(old, '', 1)
          s = s.replace('  const exact = dateOnly(anchor.date);', '  const exact = normalizeTemporalDate(anchor.date);', 1)
          s = s.replace('  const from = dateOnly(anchor.date_from);\n  const to = dateOnly(anchor.date_to);', '  const from = normalizeTemporalDate(anchor.date_from);\n  const to = normalizeTemporalDate(anchor.date_to);', 1)
          s = s.replace('        const effectiveFrom = dateOnly((source as Record<string, unknown>).effective_from);\n        const effectiveTo = dateOnly((source as Record<string, unknown>).effective_to);', '        const effectiveFrom = normalizeTemporalDate((source as Record<string, unknown>).effective_from);\n        const effectiveTo = normalizeTemporalDate((source as Record<string, unknown>).effective_to);', 1)
          p.write_text(s)

          # Law7 planner: same normalization before as_of_date.
          p = Path('supabase/functions/analyze-document-legal-position/law7-provider.ts')
          s = p.read_text()
          marker = 'import type { ResearchQuestion } from "./research-routing.ts";\n'
          add = marker + 'import { normalizeTemporalDate } from "./temporal-date.ts";\n'
          if 'import { normalizeTemporalDate }' not in s:
              if marker not in s: raise SystemExit('Law7 import marker not found')
              s = s.replace(marker, add, 1)
          old = '''function firstIsoAnchor(anchors: TemporalAnchor[]): string | null {\n  for (const anchor of anchors) {\n    for (const value of [anchor.date, anchor.date_from, anchor.date_to]) {\n      if (typeof value === "string" && /^\\d{4}-\\d{2}-\\d{2}$/.test(value)) return value;\n    }\n  }\n  return null;\n}\n'''
          new = '''function firstIsoAnchor(anchors: TemporalAnchor[]): string | null {\n  for (const anchor of anchors) {\n    for (const value of [anchor.date, anchor.date_from, anchor.date_to]) {\n      const normalized = normalizeTemporalDate(value);\n      if (normalized) return normalized;\n    }\n  }\n  return null;\n}\n'''
          if new not in s:
              if old not in s: raise SystemExit('Law7 firstIsoAnchor block not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Research contract tests
        run: bun test supabase/functions/analyze-document-legal-position/temporal-date.test.ts supabase/functions/analyze-document-legal-position/law7-provider.test.ts supabase/functions/analyze-document-legal-position/research-provider-contract.test.ts supabase/functions/analyze-document-legal-position/temporal-applicability.test.ts supabase/functions/analyze-document-legal-position/research-routing.test.ts supabase/functions/analyze-document-legal-position/research-coverage.test.ts supabase/functions/analyze-document-legal-position/dedupe-canonical.test.ts supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts
      - name: Assert no Lovable research transport
        run: |
          if grep -n "ai.gateway.lovable.dev\|LOVABLE_API_KEY" supabase/functions/analyze-document-legal-position/fact-extraction.ts; then exit 1; fi
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Commit source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-document-legal-position/fact-extraction.ts supabase/functions/analyze-document-legal-position/temporal-applicability.ts supabase/functions/analyze-document-legal-position/law7-provider.ts
          git commit -m "fix(research): normalize temporal dates consistently"
          git push origin HEAD:feat/official-legal-sources-layer
