name: PR32 Law7 Adapter Check

on:
  push:
    branches:
      - feat/official-legal-sources-layer

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-legal-sources-layer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Research contract tests
        run: bun test supabase/functions/analyze-document-legal-position/law7-provider.test.ts supabase/functions/analyze-document-legal-position/research-provider-contract.test.ts supabase/functions/analyze-document-legal-position/temporal-applicability.test.ts supabase/functions/analyze-document-legal-position/research-routing.test.ts supabase/functions/analyze-document-legal-position/research-coverage.test.ts supabase/functions/analyze-document-legal-position/dedupe-canonical.test.ts supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts
      - name: Assert no Lovable research transport
        run: |
          if grep -n "ai.gateway.lovable.dev\|LOVABLE_API_KEY" supabase/functions/analyze-document-legal-position/fact-extraction.ts; then exit 1; fi
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
