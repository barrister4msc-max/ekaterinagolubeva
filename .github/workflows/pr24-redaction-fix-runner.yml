name: PR24 redaction fix runner

on:
  push:
    branches: [fix/pr24-residual-redaction-safety]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[pr24-table-fio-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr24-residual-redaction-safety
          fetch-depth: 0

      - name: Add explicit spreadsheet-style FIO pattern
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('src/lib/legal-redaction.ts')
          s=p.read_text(encoding='utf-8')
          marker='''    reason: "role+ФИО full",\n  },\n'''
          addition='''    reason: "role+ФИО full",\n  },\n  {\n    type: "PERSON",\n    re: /\\b[А-ЯЁ][а-яё]{2,40}\\s+[А-ЯЁ][а-яё]{2,40}\\s+[А-ЯЁ][а-яё]+(?:ович|евич|ич|овна|евна|ична|инична)\\b/g,\n    reason: "Фамилия Имя Отчество tabular",\n  },\n'''
          if marker not in s:
              raise SystemExit('PERSON insertion anchor not found')
          s=s.replace(marker,addition,1)
          p.write_text(s,encoding='utf-8')
          PY

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Redaction tests
        run: bun test supabase/tests/pr24-residual-redaction.test.ts supabase/tests/pr22-redaction-ai-fill-safety.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

      - name: Commit only after all checks pass
        shell: bash
        run: |
          git rm .github/workflows/pr24-redaction-fix-runner.yml
          git config user.name "barrister4msc-max"
          git config user.email "barrister.4.msc@gmail.com"
          git add src/lib/legal-redaction.ts supabase/tests/pr24-residual-redaction.test.ts
          git commit -m "fix(redaction): cover table-style full names [pr24-table-fio-done]"
          git push origin HEAD:fix/pr24-residual-redaction-safety
