name: PR168 Wire Official Producer

on:
  push:
    branches:
      - feat/nk-index-freshness-gate
    paths:
      - .github/workflows/pr168-wire-producer.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nk-index-freshness-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic producer wiring
        run: python scripts/patch_pr168_official_producer.py
      - name: Commit branch change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-document-legal-position/repositories.ts
          git diff --cached --exit-code && exit 0
          git commit -m "Wire official collector producer across routed buckets"
          git push origin HEAD:feat/nk-index-freshness-gate
