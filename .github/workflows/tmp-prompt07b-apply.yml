name: TMP Prompt 07B Apply

on:
  push:
    branches:
      - fix/prompt07b-reviewer-critical-fail-closed

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply minimal Prompt 07B patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/review-generated-legal-document/index.ts')
          s = p.read_text()

          old_import = 'import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";\n'
          new_import = old_import + 'import { normalizeReviewOutcome } from "./review-outcome.ts";\n'
          if old_import not in s:
              raise SystemExit('expected createClient import not found')
          if 'normalizeReviewOutcome' not in s:
              s = s.replace(old_import, new_import, 1)

          old_parse = '    const review = JSON.parse(raw);\n'
          new_parse = '    const review = normalizeReviewOutcome(JSON.parse(raw));\n'
          if old_parse not in s:
              raise SystemExit('expected review parse line not found')
          s = s.replace(old_parse, new_parse, 1)
          p.write_text(s)
          PY

          cat > supabase/functions/review-generated-legal-document/review-outcome.ts <<'EOF'
          export type ReviewOutcome = Record<string, unknown> & {
            review_status?: unknown;
            ready_for_client?: unknown;
            can_be_sent_as_final?: unknown;
            problems?: unknown;
          };

          /**
           * Deterministic fail-closed reconciliation for the existing Reviewer contract.
           * A critical finding cannot coexist with a successful/final review projection.
           * The draft and all findings remain intact; only readiness/status fields are normalized.
           */
          export function normalizeReviewOutcome(input: unknown): ReviewOutcome {
            const review: ReviewOutcome =
              input && typeof input === "object" && !Array.isArray(input)
                ? { ...(input as Record<string, unknown>) }
                : {};

            const problems = Array.isArray(review.problems) ? review.problems : [];
            const hasCriticalFinding = problems.some((problem) => {
              if (!problem || typeof problem !== "object" || Array.isArray(problem)) return false;
              return (problem as Record<string, unknown>).severity === "critical";
            });

            if (!hasCriticalFinding) return review;

            return {
              ...review,
              review_status: "blocked",
              ready_for_client: false,
              can_be_sent_as_final: false,
            };
          }
          EOF

          cat > supabase/functions/review-generated-legal-document/review-outcome.test.ts <<'EOF'
          import { describe, expect, test } from "bun:test";
          import { normalizeReviewOutcome } from "./review-outcome.ts";

          describe("Prompt 07B Reviewer critical finding fail-closed", () => {
            test("passed without critical finding remains passed", () => {
              const result = normalizeReviewOutcome({
                review_status: "passed",
                ready_for_client: true,
                can_be_sent_as_final: true,
                problems: [{ severity: "high" }],
              });
              expect(result.review_status).toBe("passed");
              expect(result.ready_for_client).toBe(true);
              expect(result.can_be_sent_as_final).toBe(true);
            });

            test("passed with critical finding is blocked and not final", () => {
              const result = normalizeReviewOutcome({
                review_status: "passed",
                ready_for_client: true,
                can_be_sent_as_final: true,
                problems: [{ severity: "critical", problem: "fatal defect" }],
                required_fixes: ["fix it"],
              });
              expect(result.review_status).toBe("blocked");
              expect(result.ready_for_client).toBe(false);
              expect(result.can_be_sent_as_final).toBe(false);
              expect(result.problems).toEqual([{ severity: "critical", problem: "fatal defect" }]);
              expect(result.required_fixes).toEqual(["fix it"]);
            });

            test("needs_revision with critical finding is blocked", () => {
              const result = normalizeReviewOutcome({
                review_status: "needs_revision",
                ready_for_client: false,
                can_be_sent_as_final: false,
                problems: [{ severity: "critical" }],
              });
              expect(result.review_status).toBe("blocked");
            });

            test("already blocked with critical finding stays blocked", () => {
              const result = normalizeReviewOutcome({
                review_status: "blocked",
                ready_for_client: false,
                can_be_sent_as_final: false,
                problems: [{ severity: "critical" }],
              });
              expect(result.review_status).toBe("blocked");
              expect(result.ready_for_client).toBe(false);
              expect(result.can_be_sent_as_final).toBe(false);
            });

            test("high-only finding does not invent a new blocker", () => {
              const result = normalizeReviewOutcome({
                review_status: "needs_revision",
                ready_for_client: false,
                can_be_sent_as_final: false,
                problems: [{ severity: "high" }],
              });
              expect(result.review_status).toBe("needs_revision");
            });

            test("draft payload and document-like fields are preserved", () => {
              const result = normalizeReviewOutcome({
                review_status: "passed",
                ready_for_client: true,
                can_be_sent_as_final: true,
                summary: "keep draft",
                problems: [{ severity: "critical" }],
                recommendations: ["lawyer review"],
              });
              expect(result.summary).toBe("keep draft");
              expect(result.recommendations).toEqual(["lawyer review"]);
              expect(result.problems).toEqual([{ severity: "critical" }]);
            });
          });
          EOF

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Prompt 07B regression
        run: bun test supabase/functions/review-generated-legal-document/review-outcome.test.ts
      - name: Run adjacent Prompt 07A regression
        run: bun test supabase/functions/analyze-document-legal-position/challenge-readiness-fail-closed.test.ts
      - name: Run existing Reviewer tests when present
        shell: bash
        run: |
          mapfile -t tests < <(find supabase/functions/review-generated-legal-document -maxdepth 1 -name '*.test.ts' ! -name 'review-outcome.test.ts' -print)
          if [ ${#tests[@]} -gt 0 ]; then
            bun test "${tests[@]}"
          else
            echo 'No additional Reviewer tests present'
          fi
      - name: Diff check
        run: git diff --check
      - name: Commit verified product patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-prompt07b-apply.yml
          git add supabase/functions/review-generated-legal-document/index.ts \
                  supabase/functions/review-generated-legal-document/review-outcome.ts \
                  supabase/functions/review-generated-legal-document/review-outcome.test.ts
          git commit -m 'Fail closed on critical Reviewer findings'
          git push origin HEAD:fix/prompt07b-reviewer-critical-fail-closed
