name: Prompt07D Apply and Test

on:
  push:
    branches:
      - fix/prompt07d-missing-review-readiness
    paths:
      - .github/workflows/prompt07d-apply-test.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt07d-missing-review-readiness
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply minimal Prompt 07D patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          readiness_path = Path('src/lib/document-readiness.ts')
          readiness = readiness_path.read_text()
          old = "  review: any | null; // review_run.ai_result\n  // Source Review warnings whose affected_conclusions is non-empty are treated\n"
          new = "  review: any | null; // review_run.ai_result\n  reviewCompleted: boolean;\n  // Source Review warnings whose affected_conclusions is non-empty are treated\n"
          assert old in readiness, 'readiness input anchor missing'
          readiness = readiness.replace(old, new, 1)
          old = "  // NEEDS_REVISION\n  if (reviewStatus === \"needs_revision\") {\n    reasons.push(`review_status=${reviewStatus}`);\n  }\n"
          new = "  // NEEDS_REVISION\n  const validReviewStatuses = new Set([\"passed\", \"needs_revision\", \"blocked\"]);\n  if (!input.reviewCompleted) {\n    reasons.push(\"review_not_completed\");\n  } else if (!validReviewStatuses.has(reviewStatus)) {\n    reasons.push(\"review_result_invalid\");\n  }\n  if (reviewStatus === \"needs_revision\") {\n    reasons.push(`review_status=${reviewStatus}`);\n  }\n"
          assert old in readiness, 'readiness NEEDS_REVISION anchor missing'
          readiness_path.write_text(readiness.replace(old, new, 1))

          Path('src/lib/document-approval.ts').write_text('export type ReviewRunForApproval = { status?: unknown; ai_result?: unknown } | null;\n\nexport type ReviewApprovalGate =\n  | { allowed: true; reason: null }\n  | { allowed: false; reason: "review_not_completed" | "review_result_invalid" | "review_not_passed" };\n\nexport function evaluateReviewApproval(reviewRun: ReviewRunForApproval): ReviewApprovalGate {\n  if (!reviewRun || String(reviewRun.status ?? "").toLowerCase() !== "completed") {\n    return { allowed: false, reason: "review_not_completed" };\n  }\n  const result = reviewRun.ai_result && typeof reviewRun.ai_result === "object" && !Array.isArray(reviewRun.ai_result)\n    ? reviewRun.ai_result as Record<string, unknown>\n    : null;\n  const reviewStatus = String(result?.review_status ?? "").toLowerCase();\n  if (!["passed", "needs_revision", "blocked"].includes(reviewStatus)) {\n    return { allowed: false, reason: "review_result_invalid" };\n  }\n  if (reviewStatus !== "passed") return { allowed: false, reason: "review_not_passed" };\n  return { allowed: true, reason: null };\n}\n\nexport function assertReviewAllowsApproval(reviewRun: ReviewRunForApproval): void {\n  const gate = evaluateReviewApproval(reviewRun);\n  if (!gate.allowed) throw new Error(`Document approval blocked: ${gate.reason}`);\n}\n')

          route_path = Path('src/routes/workspace.generated-documents.$documentId.tsx')
          route = route_path.read_text()
          old = 'import { computeDocumentReadiness } from "@/lib/document-readiness";\n'
          assert old in route, 'route import anchor missing'
          route = route.replace(old, old + 'import { assertReviewAllowsApproval } from "@/lib/document-approval";\n', 1)
          old = "  const approve = useMutation({\n    mutationFn: async () => {\n      if (!doc) return;\n      const { data: u } = await supabase.auth.getUser();\n      const { error } = await supabase\n"
          new = "  const approve = useMutation({\n    mutationFn: async () => {\n      if (!doc) return;\n      const { data: latestReviewRun, error: latestReviewError } = await supabase\n        .from(\"document_intake_ai_runs\")\n        .select(\"status,ai_result\")\n        .eq(\"generated_document_id\" as any, doc.id)\n        .order(\"created_at\", { ascending: false })\n        .limit(1)\n        .maybeSingle();\n      if (latestReviewError) throw latestReviewError;\n      assertReviewAllowsApproval(latestReviewRun);\n\n      const { data: u } = await supabase.auth.getUser();\n      const { error } = await supabase\n"
          assert old in route, 'approve mutation anchor missing'
          route = route.replace(old, new, 1)
          old = "      computeDocumentReadiness({\n        consistency,\n        review,\n        sourceWarnings: (matterSnapshot?.source_warnings as any[]) ?? null,\n      }),\n    [consistency, review, matterSnapshot?.source_warnings],\n"
          new = "      computeDocumentReadiness({\n        consistency,\n        review,\n        reviewCompleted:\n          !!reviewRun && String(reviewRun.status ?? \"\").toLowerCase() === \"completed\",\n        sourceWarnings: (matterSnapshot?.source_warnings as any[]) ?? null,\n      }),\n    [consistency, review, reviewRun, matterSnapshot?.source_warnings],\n"
          assert old in route, 'readiness call anchor missing'
          route_path.write_text(route.replace(old, new, 1))

          Path('supabase/tests/prompt07d-document-readiness.test.ts').write_text('import { describe, expect, test } from "bun:test";\nimport { computeDocumentReadiness } from "../../src/lib/document-readiness";\nconst consistency = { ready: true, criticalFailed: [], warningsFailed: [], blockReason: null };\ndescribe("Prompt 07D readiness", () => {\n  test("missing review is fail-closed", () => { const r=computeDocumentReadiness({consistency,review:null,reviewCompleted:false}); expect(r.status).toBe("NEEDS_REVISION"); expect(r.reasons).toContain("review_not_completed"); });\n  test("invalid completed review is fail-closed", () => { const r=computeDocumentReadiness({consistency,review:{},reviewCompleted:true}); expect(r.status).toBe("NEEDS_REVISION"); expect(r.reasons).toContain("review_result_invalid"); });\n  test("completed passed review can be ready", () => expect(computeDocumentReadiness({consistency,review:{review_status:"passed",problems:[]},reviewCompleted:true})).toEqual({status:"READY",reasons:[]}));\n  test("noncritical findings remain warnings", () => expect(computeDocumentReadiness({consistency,review:{review_status:"passed",problems:[{severity:"high"}]},reviewCompleted:true}).status).toBe("READY_WITH_WARNINGS"));\n  test("needs_revision and blocked are preserved", () => { expect(computeDocumentReadiness({consistency,review:{review_status:"needs_revision"},reviewCompleted:true}).status).toBe("NEEDS_REVISION"); expect(computeDocumentReadiness({consistency,review:{review_status:"blocked"},reviewCompleted:true}).status).toBe("BLOCKED"); });\n});\n')
          Path('supabase/tests/prompt07d-document-approval.test.ts').write_text('import { describe, expect, test } from "bun:test";\nimport { assertReviewAllowsApproval, evaluateReviewApproval } from "../../src/lib/document-approval";\ndescribe("Prompt 07D approval", () => {\n  test("missing pending failed are rejected", () => { expect(evaluateReviewApproval(null).allowed).toBe(false); expect(evaluateReviewApproval({status:"pending",ai_result:{review_status:"passed"}}).allowed).toBe(false); expect(evaluateReviewApproval({status:"failed",ai_result:{review_status:"passed"}}).allowed).toBe(false); });\n  test("invalid result is rejected", () => expect(evaluateReviewApproval({status:"completed",ai_result:{}})).toEqual({allowed:false,reason:"review_result_invalid"}));\n  test("needs_revision and blocked are rejected", () => { expect(evaluateReviewApproval({status:"completed",ai_result:{review_status:"needs_revision"}}).allowed).toBe(false); expect(evaluateReviewApproval({status:"completed",ai_result:{review_status:"blocked"}}).allowed).toBe(false); });\n  test("completed passed is accepted", () => { const run={status:"completed",ai_result:{review_status:"passed"}}; expect(evaluateReviewApproval(run)).toEqual({allowed:true,reason:null}); expect(() => assertReviewAllowsApproval(run)).not.toThrow(); });\n  test("assertion fails closed", () => expect(() => assertReviewAllowsApproval(null)).toThrow("review_not_completed"));\n});\n')
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prompt 07D regressions
        run: bun test supabase/tests/prompt07d-document-readiness.test.ts supabase/tests/prompt07d-document-approval.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Verify scoped product diff and commit
        shell: bash
        run: |
          git checkout 9d26b3b70c286e46a5a3a79b93a7b8b07084ec7a -- .github/workflows/law7-controlled-real-data-poc.yml .github/workflows/pr-quality-gate.yml
          rm -f .github/workflows/prompt07d-apply-test.yml
          git add -A
          changed="$(git diff --cached --name-only 9d26b3b70c286e46a5a3a79b93a7b8b07084ec7a | sort)"
          expected="$(printf '%s\n' 'src/lib/document-approval.ts' 'src/lib/document-readiness.ts' 'src/routes/workspace.generated-documents.$documentId.tsx' 'supabase/tests/prompt07d-document-approval.test.ts' 'supabase/tests/prompt07d-document-readiness.test.ts' | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fail closed on missing Reviewer approval gate"
          git push origin HEAD:fix/prompt07d-missing-review-readiness
