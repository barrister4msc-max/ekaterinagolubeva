name: PR26 refresh current main

on:
  push:
    branches: [feat/pr27-verified-company-profile]

permissions:
  contents: write

jobs:
  refresh-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[pr26-current-main]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr27-verified-company-profile
          fetch-depth: 0
      - name: Merge current main
        run: |
          git fetch origin main
          git config user.name "barrister4msc-max"
          git config user.email "barrister.4.msc@gmail.com"
          git merge origin/main --no-edit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Registry tests
        run: bun test supabase/tests/pr27-company-registry.test.ts
      - name: Upload regressions
        run: bun test supabase/tests/pr25-upload-lifecycle.test.ts supabase/tests/pr23-document-package-files.test.ts
      - name: Redaction regressions
        run: bun test supabase/tests/pr24-residual-redaction.test.ts supabase/tests/pr22-redaction-ai-fill-safety.test.ts
      - name: Focused builder regressions
        run: bun test supabase/tests/pr28-focused-builder.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check registry Edge Function
        run: deno check --no-lock supabase/functions/company-registry-lookup/index.ts
      - name: Commit validated merge
        run: |
          git rm .github/workflows/pr26-refresh-current-main.yml
          git add -A
          git commit -m "chore(pr26): merge focused-builder main after validation [pr26-current-main]"
          git push origin HEAD:feat/pr27-verified-company-profile
