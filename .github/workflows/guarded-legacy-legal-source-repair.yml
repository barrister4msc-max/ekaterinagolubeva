name: Guarded Legacy Legal Source Repair

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: "Short-lived HTTPS URL for the two-source private repair manifest"
        required: true
        type: string
      manifest_sha256:
        description: "Expected SHA-256 of the exact private repair manifest"
        required: true
        type: string
      confirm_repair:
        description: "Type I_CONFIRM_GUARDED_LEGACY_SOURCE_REPAIR exactly for Production apply"
        required: true
        type: string
      apply_to_production:
        description: "Apply the two-source legacy replacement in Production"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate_dispatch:
    name: Fail-closed dispatch validation
    runs-on: ubuntu-latest
    steps:
      - name: Require main and exact manifest SHA
        shell: bash
        env:
          EXPECTED_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${EXPECTED_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]

      - name: Require explicit Production intent only for apply
        if: ${{ inputs.apply_to_production }}
        shell: bash
        env:
          CONFIRM_REPAIR: ${{ inputs.confirm_repair }}
        run: |
          set -euo pipefail
          test "${CONFIRM_REPAIR}" = "I_CONFIRM_GUARDED_LEGACY_SOURCE_REPAIR"

  dry_run:
    name: Validate two-source repair without a write
    needs: validate_dispatch
    runs-on: ubuntu-latest
    if: ${{ !inputs.apply_to_production }}
    env:
      MANIFEST_URL: ${{ inputs.manifest_url }}
      EXPECTED_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch exact private manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/legacy-repair-manifest.json"
          curl --fail --silent --show-error --location --proto '=https' \
            --connect-timeout 15 --max-time 120 --max-filesize 5242880 \
            --output "${manifest}" "${MANIFEST_URL}"
          printf '%s  %s\n' "${EXPECTED_SHA256,,}" "${manifest}" | sha256sum --check --status
          chmod 600 "${manifest}"
          python scripts/repair_legacy_legal_sources.py --input "${manifest}"

  apply:
    name: Apply guarded two-source replacement
    needs: validate_dispatch
    runs-on: ubuntu-latest
    environment: Production
    if: ${{ github.ref == 'refs/heads/main' && inputs.apply_to_production }}
    env:
      MANIFEST_URL: ${{ inputs.manifest_url }}
      EXPECTED_SHA256: ${{ inputs.manifest_sha256 }}
      DATABASE_URL: ${{ secrets.KATI_INTERNAL_KB_DATABASE_URL }}
      KATI_STORAGE_VERIFIER_URL: https://wiylzbdbjokignwvizxt.supabase.co/functions/v1/verify-guarded-legal-source-storage
      KATI_GUARDED_INTAKE_VERIFY_TOKEN: ${{ secrets.KATI_GUARDED_INTAKE_VERIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Fetch exact private manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/legacy-repair-manifest.json"
          curl --fail --silent --show-error --location --proto '=https' \
            --connect-timeout 15 --max-time 120 --max-filesize 5242880 \
            --output "${manifest}" "${MANIFEST_URL}"
          printf '%s  %s\n' "${EXPECTED_SHA256,,}" "${manifest}" | sha256sum --check --status
          chmod 600 "${manifest}"
          echo "MANIFEST_PATH=${manifest}" >> "${GITHUB_ENV}"
      - name: Validate without a write
        run: python scripts/repair_legacy_legal_sources.py --input "${MANIFEST_PATH}"
      - name: Apply one guarded transaction
        run: python scripts/repair_legacy_legal_sources.py --input "${MANIFEST_PATH}" --apply
      - name: Read-only post-repair audit
        shell: bash
        run: |
          set -euo pipefail
          python - "${MANIFEST_PATH}" <<'PY'
          import os
          import sys
          import psycopg
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import repair_legacy_legal_sources as repair

          rows = repair.normalize_all(Path(sys.argv[1]))
          new_ids = [row["source_group_id"] for row in rows]
          old_ids = [row["legacy_source_group_id"] for row in rows]
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("""
                select count(distinct metadata->>'source_group_id'), count(*),
                  count(*) filter (where (metadata->>'is_source_head') = 'true'),
                  bool_and((metadata->>'official_origin_verified') = 'false'),
                  bool_and((metadata->>'content_verified') = 'false'),
                  bool_and((metadata->>'temporal_verified') = 'false'),
                  bool_and((metadata->>'substantive_use_allowed') = 'false'),
                  bool_and((metadata->>'use_in_generation') = 'false')
                from public.legal_knowledge_chunks
                where is_active and metadata->>'source_group_id' = any(%s)
              """, (new_ids,))
              groups, chunks, heads, origin, content, temporal, substantive, generation = cur.fetchone()
              cur.execute("""
                select count(*) from public.legal_knowledge_chunks
                where is_active and metadata->>'source_group_id' = any(%s)
              """, (old_ids,))
              (active_legacy,) = cur.fetchone()
          assert groups == 2 and heads == 2 and chunks > 2
          assert active_legacy == 0
          assert all((origin, content, temporal, substantive, generation))
          print('{"source_groups": 2, "legacy_active_rows": 0, "fail_closed": true, "legal_law_chunks_touched": false, "legal_source_registry_touched": false}')
          PY
