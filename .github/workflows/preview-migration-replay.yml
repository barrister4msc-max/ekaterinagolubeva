name: Preview migration replay (local only)

on:
  pull_request:
    paths:
      - '.github/workflows/preview-migration-replay.yml'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'supabase/roles.sql'
      - 'supabase/seed.sql'
      - 'supabase/tests/guarded-source-preview-replay.test.ts'
      - 'supabase/tests/final-history-isolated-replay.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-preview-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Prove empty and partial guarded-source behavior offline
        run: bun test supabase/tests/guarded-source-preview-replay.test.ts
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Replay active migrations in disposable local Supabase
        run: supabase start
      - name: Replay exact stored candidate history on a second isolated Supabase
        run: node supabase/tests/final-history-isolated-replay.mjs
