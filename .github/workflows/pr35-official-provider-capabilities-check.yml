name: PR35 Official Provider Capabilities Check

on:
  push:
    branches:
      - feat/official-provider-capability-registry
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: PR35 capability regressions
        run: bun test supabase/functions/analyze-document-legal-position/official-provider-capabilities.test.ts
      - name: Existing official source regressions
        run: bun test supabase/functions/analyze-document-legal-position/official-sources.test.ts
      - name: Complete Analyzer regressions
        run: bun test supabase/functions/analyze-document-legal-position/*.test.ts
      - name: Diff check against main
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Deno check official sources
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/analyze-document-legal-position/official-sources.ts
