name: TEMP P0-A14 PR verifier

on:
  pull_request:
    branches:
      - feat/p0a13-revexp-freshness-schema-audit

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: 1.2.22}
      - run: bun install --frozen-lockfile
      - run: |
          cd scripts
          python -m unittest test_fns_open_data_revexp_dry_run.py
      - run: |
          curl --fail --location --retry 3 --retry-delay 2 -o /tmp/revexp.zip https://file.nalog.ru/opendata/7707329152-revexp/data-20260725-structure-20180110.zip
          echo "bada16ef2497084edd342c0e2f00442293ac708f28a51fb8954fa21a0941f8d8  /tmp/revexp.zip" | sha256sum -c -
          python scripts/fns_open_data_revexp_dry_run.py --input /tmp/revexp.zip --limit 25 | grep -q '"dataset_id": "7707329152-revexp"'
      - run: bun test ./supabase/tests/fns-open-data-revexp-storage-contract.test.ts
      - env: {PGPASSWORD: postgres}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role; end if;
          end $$;
          SQL
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260820173000_fns_open_data_snr_company_facts.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260820214000_fns_open_data_debtam_company_facts.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260821103000_fns_open_data_revexp_company_facts.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          insert into fns_open_data.company_financial_statements
            (inn,organization_name,income_amount,expense_amount,document_id,document_date,reporting_date,dataset_id,source_url,source_sha256)
          values
            ('7701234567','ООО Тест',11623000.10,10969000.20,'doc-2025','2026-07-25','2025-12-31','7707329152-revexp','https://file.nalog.ru/opendata/7707329152-revexp/data.zip',repeat('a',64)),
            ('7701234567','ООО Тест',100.10,90.20,'doc-2024','2025-07-25','2024-12-31','7707329152-revexp','https://file.nalog.ru/opendata/7707329152-revexp/data.zip',repeat('b',64));
          insert into fns_open_data.sync_state(dataset_id,status,source_url,source_sha256,data_as_of,published_at,records_count)
          values('7707329152-revexp','completed','https://file.nalog.ru/opendata/7707329152-revexp/data.zip',repeat('c',64),'2025-12-31','2026-07-25',2);
          SQL
          test "$(psql -h localhost -U postgres -d postgres -Atc "select income_amount || '|' || expense_amount || '|' || reporting_date from public.fns_open_data_get_financial_statement_text('7701234567', null);")" = "11623000.10|10969000.20|2025-12-31"
          test "$(psql -h localhost -U postgres -d postgres -Atc "select income_amount || '|' || reporting_date from public.fns_open_data_get_financial_statement_text('7701234567','2024-12-31');")" = "100.10|2024-12-31"
      - run: bun run typecheck
      - run: git diff --check origin/feat/p0a13-revexp-freshness-schema-audit...HEAD
