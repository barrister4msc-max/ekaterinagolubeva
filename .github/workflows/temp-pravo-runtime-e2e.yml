name: TEMP Pravo Runtime E2E

on:
  push:
    branches:
      - audit/law7-tax-core-execution-gate-20260819
    paths:
      - .github/workflows/temp-pravo-runtime-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pravo-runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Diagnose official Pravo transport
        shell: bash
        run: |
          set -u
          echo '=== DNS ==='
          getent ahosts publication.pravo.gov.ru | head -n 12 || true

          probe() {
            label="$1"
            family="$2"
            url="$3"
            out="/tmp/pravo-${label}.body"
            err="/tmp/pravo-${label}.err"
            echo "=== ${label} (${family}) ==="
            set +e
            meta=$(curl ${family} --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              --header 'Accept: application/json' \
              --output "$out" \
              --write-out 'http=%{http_code} remote_ip=%{remote_ip} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} first_byte=%{time_starttransfer} total=%{time_total} bytes=%{size_download}' \
              "$url" 2>"$err")
            rc=$?
            set -e
            echo "curl_rc=$rc $meta"
            sed -n '1,6p' "$err" || true
            if [ -f "$out" ]; then
              python3 - "$out" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          b=p.read_bytes()
          print('body_bytes=', len(b))
          print('body_prefix=', b[:240].decode('utf-8','replace').replace('\n',' '))
          PY
            fi
            echo "PROBE_RESULT label=${label} rc=${rc}"
            return 0
          }

          exact_url='https://publication.pravo.gov.ru/api/Documents?NumberSearchType=0&Number=163-%D0%A4%D0%97&PageSize=30'
          detail_url='https://publication.pravo.gov.ru/api/Document?eoNumber=2600202104190001'

          # GitHub runner currently resolves publication.pravo.gov.ru to IPv4.
          # Probe both normal selection and forced IPv4. Forced IPv6 is diagnostic-only.
          probe exact-auto '' "$exact_url"
          probe exact-ipv4 '-4' "$exact_url"
          probe detail-auto '' "$detail_url"
          probe detail-ipv4 '-4' "$detail_url"
          probe exact-ipv6 '-6' "$exact_url"

          echo '=== raw TCP/TLS ==='
          python3 - <<'PY'
          import socket, ssl, time
          host='publication.pravo.gov.ru'
          for family, name in [(socket.AF_INET,'ipv4'), (socket.AF_INET6,'ipv6')]:
              try:
                  infos=socket.getaddrinfo(host,443,family,socket.SOCK_STREAM)
              except Exception as e:
                  print(f'{name}_dns_error={e!r}')
                  continue
              if not infos:
                  print(f'{name}_no_addresses')
                  continue
              addr=infos[0][4]
              t=time.time()
              try:
                  s=socket.socket(family,socket.SOCK_STREAM)
                  s.settimeout(10)
                  s.connect(addr)
                  tcp=time.time()-t
                  ctx=ssl.create_default_context()
                  ss=ctx.wrap_socket(s,server_hostname=host)
                  tls=time.time()-t
                  print(f'{name}_tcp_tls=PASS addr={addr} tcp={tcp:.3f}s tls_total={tls:.3f}s cipher={ss.cipher()[0]}')
                  ss.close()
              except Exception as e:
                  print(f'{name}_tcp_tls=FAIL addr={addr} elapsed={time.time()-t:.3f}s error={e!r}')
          PY

          echo 'PRAVO_TRANSPORT_DIAGNOSTICS=COMPLETE'

      - name: Execute live Pravo provider E2E
        env:
          OFFICIAL_LEGAL_SOURCES_ENABLED: "true"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pravo-runtime-e2e.ts <<'TS'
          const originalDeno = (globalThis as any).Deno;
          const envGet = (name: string): string | undefined => process.env[name];
          try {
            if (originalDeno?.env) {
              (globalThis as any).Deno = { ...originalDeno, env: { ...originalDeno.env, get: envGet } };
            } else {
              (globalThis as any).Deno = { env: { get: envGet } };
            }
          } catch {
            if ((globalThis as any).Deno?.env) (globalThis as any).Deno.env.get = envGet;
          }

          const { searchOfficialLegalSources, isOfficialLegalUrl } = await import(`${process.cwd()}/supabase/functions/analyze-document-legal-position/official-sources.ts`);

          const query: any = {
            practice_area: "tax",
            subcategory: "налоговый контроль",
            document_type: "legal_research_e2e",
            facts: [], parties: [], amounts: [],
            dates: ["18.07.2017"], temporal_anchors: [],
            legal_issues: ["Применение статьи 54.1 НК РФ"],
            research_topics: ["ст. 54.1 НК РФ", "пределы осуществления прав по исчислению налоговой базы"],
            keywords: ["статья 54.1 НК РФ", "налоговая база"],
            articles: ["ст. 54.1 НК РФ", "Федеральный закон от 18.07.2017 № 163-ФЗ"],
            organizations: [], inn: [], ogrn: [],
            semantic_intents: ["официальная публикация изменений Налогового кодекса, связанных со статьей 54.1"],
            legal_concepts: ["пределы осуществления прав налогоплательщиком"],
            metadata_terms: ["18.07.2017", "163-ФЗ", "Налоговый кодекс"],
            search_hypotheses: ["проверить официальный акт, которым введена статья 54.1 НК РФ"],
          };

          const started = Date.now();
          const result = await searchOfficialLegalSources(query);
          const elapsed_ms = Date.now() - started;
          const d = result.diagnostics;
          const exact = result.sources.filter((s: any) => s?.metadata?.safety?.document_identity_verified === true);
          const substantive = result.sources.filter((s: any) => s?.metadata?.safety?.substantive_use_allowed === true);
          const badHosts = result.sources.filter((s: any) => !isOfficialLegalUrl(String(s.official_url ?? "")));
          const contentVerified = result.sources.filter((s: any) => s?.metadata?.safety?.content_verified === true);
          const actualityVerified = result.sources.filter((s: any) => s?.metadata?.safety?.actuality_status === "verified");

          console.log(JSON.stringify({
            provider_elapsed_ms: elapsed_ms,
            provider_enabled: d.enabled,
            exact_attempted: d.pravo_exact_attempted,
            context_attempted: d.pravo_context_attempted,
            found: d.pravo_found,
            identity_verified: d.pravo_identity_verified,
            ambiguous: d.pravo_ambiguous,
            substantive_usable: d.substantive_usable,
            failures: d.failures,
            exact_source_ids: exact.map((s: any) => s.source_id),
            exact_citations: exact.map((s: any) => s.citation),
            bad_official_hosts: badHosts.length,
            content_verified_count: contentVerified.length,
            actuality_verified_count: actualityVerified.length,
          }, null, 2));

          const fail = (message: string): never => {
            console.error(`E2E_FAIL: ${message}`);
            process.exit(1);
          };
          if (!d.enabled) fail("official provider rollout flag was not enabled");
          if (d.pravo_exact_attempted < 1) fail("exact requisites path was not attempted");
          if (d.pravo_context_attempted < 1) fail("context DocumentText path was not attempted");
          if (d.failures.length > 0) fail(`live Pravo calls failed: ${d.failures.join(" | ")}`);
          if (d.pravo_found < 1) fail("live Pravo API returned no provider results");
          if (exact.length < 1) fail("no exactly identified official document was verified");
          if (badHosts.length !== 0) fail("provider returned a non-official host");
          if (contentVerified.length !== 0) fail("unexpected content_verified=true");
          if (actualityVerified.length !== 0) fail("unexpected actuality_status=verified");
          if (substantive.length !== 0 || d.substantive_usable !== 0) fail("discovery/identity metadata unexpectedly became substantive authority");
          console.log("PRAVO_RUNTIME_E2E=PASS");
          TS
          bun /tmp/pravo-runtime-e2e.ts

      - name: Confirm no write surface in verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'SUPABASE_(SERVICE_ROLE_KEY|DB_URL|DATABASE_URL)|--apply|execute_sql|apply_migration' .github/workflows/temp-pravo-runtime-e2e.yml; then
            echo "Verifier unexpectedly contains a write-capable Supabase surface" >&2
            exit 1
          fi
          echo "NO_SUPABASE_WRITE_SURFACE=PASS"
