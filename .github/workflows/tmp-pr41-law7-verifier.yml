name: Temporary PR41 Law7 verifier

on:
  pull_request_target:
    types: [edited]
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  verify-pr41:
    if: ${{ github.event.pull_request.number == 41 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR41 head
        uses: actions/checkout@v4
        with:
          ref: 1ece55ed026450e5270b8d6449fe9c37d0824d64
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tested head SHA
        shell: bash
        run: |
          EXPECTED="1ece55ed026450e5270b8d6449fe9c37d0824d64"
          EVENT_HEAD="${{ github.event.pull_request.head.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          echo "expected_head_sha=$EXPECTED"
          echo "event_head_sha=$EVENT_HEAD"
          echo "tested_head_sha=$ACTUAL"
          test "$EVENT_HEAD" = "$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Python syntax
        run: python -m py_compile scripts/law7_controlled_export.py scripts/law7_mirror_import.py

      - name: Python TAX CORE tests + importer dry-run
        run: python -m unittest discover -s scripts/tests -p 'test_law7_controlled_export.py' -v

      - name: Legacy Law7 controlled PoC contract
        run: bun test supabase/tests/law7-controlled-real-data-poc.test.ts

      - name: Law7 mirror migration contract
        run: bun test supabase/tests/law7-mirror-poc-migration.test.ts

      - name: Law7 temporal verification contract
        run: bun test supabase/tests/law7-article-temporal-verification.test.ts

      - name: Law7 analyzer/provider suite
        run: >-
          bun test
          supabase/functions/analyze-document-legal-position/law7-provider.test.ts
          supabase/functions/analyze-document-legal-position/law7-repository-wiring.test.ts
          supabase/functions/analyze-document-legal-position/law7-supabase-transport.test.ts

      - name: Importer TAX CORE fixture dry-run
        run: python scripts/law7_mirror_import.py --input scripts/tests/fixtures/law7_tax_core_dry_run.json

      - name: Diff check
        run: git diff --check e378cc459b5024c9fb646852852f674ab8acfa40...HEAD

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Final tested SHA
        run: echo "tested_head_sha=$(git rev-parse HEAD)"

      - name: Publish PR41 verifier success status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/1ece55ed026450e5270b8d6449fe9c37d0824d64" \
            -d "{\"state\":\"success\",\"context\":\"pr41-law7-verifier\",\"description\":\"PR41 execution gate passed; run $RUN_ID\",\"target_url\":\"$SERVER_URL/$REPO/actions/runs/$RUN_ID\"}"
