name: PR32 Research Coverage Source Apply v2

on:
  push:
    branches:
      - feat/official-legal-sources-layer

permissions:
  contents: write

jobs:
  apply-check-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-legal-sources-layer
          fetch-depth: 0

      - name: Wire issue coverage into existing pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/analyze-document-legal-position/enrich.ts')
          s = p.read_text()
          marker = '  actually_used_in_generation: boolean;\n};'
          repl = '''  actually_used_in_generation: boolean;\n  research_issue_ids?: string[];\n  research_issue_texts?: string[];\n  research_modes?: string[];\n};'''
          if repl not in s:
            if marker not in s: raise SystemExit('TrustedSource marker not found')
            s = s.replace(marker, repl, 1)
          old = '''export function evaluateSufficiency(opts: {\n  trusted: TrustedSource[];\n  conclusions: Conclusion[];\n}): {'''
          new = '''export function evaluateSufficiency(opts: {\n  trusted: TrustedSource[];\n  conclusions: Conclusion[];\n  researchCoverageGaps?: string[];\n}): {'''
          if new not in s:
            if old not in s: raise SystemExit('sufficiency signature not found')
            s = s.replace(old, new, 1)
          marker = '  if (!hasHighCourt) gaps.push("Нет практики ВС РФ / кассации по вопросу");\n'
          add = marker + '  for (const gap of opts.researchCoverageGaps ?? []) {\n    if (gap && !gaps.includes(gap)) gaps.push(gap);\n  }\n'
          if add not in s:
            if marker not in s: raise SystemExit('sufficiency gap marker not found')
            s = s.replace(marker, add, 1)
          p.write_text(s)

          p = Path('supabase/functions/analyze-document-legal-position/source-metadata-bridge.ts')
          s = p.read_text()
          marker = '  "transport",\n] as const;'
          repl = '  "transport",\n  "research_issue_ids",\n  "research_issue_texts",\n  "research_modes",\n] as const;'
          if repl not in s:
            if marker not in s: raise SystemExit('bridge key marker not found')
            s = s.replace(marker, repl, 1)
          p.write_text(s)

          p = Path('supabase/functions/analyze-document-legal-position/repositories.ts')
          s = p.read_text()
          s = s.replace(
            'import { buildResearchPlan, queryForBucket, queryForQuestion, type ResearchQuestion } from "./research-routing.ts";',
            'import { buildResearchPlan, queryForBucket, queryForQuestion, type ResearchPlan, type ResearchQuestion } from "./research-routing.ts";',
          )
          old = '): Promise<{ sources: RawSource[]; counts: Record<string, number> }> {'
          new = '): Promise<{ sources: RawSource[]; counts: Record<string, number>; researchPlan: ResearchPlan }> {'
          if new not in s:
            if old not in s: raise SystemExit('repository return type not found')
            s = s.replace(old, new, 1)
          s = s.replace('  return { sources, counts };\n}\n\n/**\n * Gap-targeted retry:', '  return { sources, counts, researchPlan };\n}\n\n/**\n * Gap-targeted retry:', 1)

          old_gap = '''export async function gapSearch(\n  sb: SbClient,\n  gaps: string[],\n  practiceArea: string | null,\n): Promise<RawSource[]> {\n  if (!gaps.length) return [];\n  const out: RawSource[] = [];\n  for (const gap of gaps.slice(0, 5)) {\n    const terms = gap\n      .replace(/[^\\p{L}\\p{N}\\s]+/gu, " ")\n      .split(/\\s+/)\n      .filter((t) => t.length >= 4)\n      .slice(0, 4);\n    if (terms.length === 0) continue;\n    const pattern = "%" + terms.join("%") + "%";\n    let q = sb\n      .from("legal_knowledge_chunks")\n      .select("id, title, content, metadata, category, source_type")\n      .eq("is_active", true)\n      .ilike("content", pattern)\n      .limit(6);\n    if (practiceArea) q = q.eq("category", practiceArea);\n    const { data } = await q;\n    for (const r of (data ?? []) as any[]) {\n      const st = ((r.source_type as string | null) ?? "").toLowerCase();\n      let bucket: Bucket = "laws";\n      if (st.includes("court")) bucket = "court_practice";\n      else if (st.includes("fns")) bucket = "fns_letters";\n      else if (st.includes("minfin")) bucket = "minfin_letters";\n      else if (st.includes("ekaterina")) bucket = "ekaterina";\n      else if (st.includes("manual") || st.includes("template")) bucket = "manuals";\n      out.push(makeChunkSource(r, bucket));\n    }\n  }\n  return out;\n}'''
          new_gap = '''export async function gapSearch(\n  sb: SbClient,\n  gaps: string[],\n  practiceArea: string | null,\n  researchPlan?: ResearchPlan,\n): Promise<RawSource[]> {\n  if (!gaps.length) return [];\n  const out: RawSource[] = [];\n  for (const gap of gaps.slice(0, 5)) {\n    const issueId = gap.match(/^\\[(issue-\\d+)\\]/)?.[1] ?? null;\n    const issue = issueId ? researchPlan?.questions.find((question) => question.id === issueId) ?? null : null;\n    const expectedBucket: Bucket | null = /позиция ФНС/iu.test(gap)\n      ? "fns_letters"\n      : /позиция Минфина/iu.test(gap)\n        ? "minfin_letters"\n        : null;\n    const searchText = issue?.issue ?? gap;\n    const terms = searchText\n      .replace(/[^\\p{L}\\p{N}\\s]+/gu, " ")\n      .split(/\\s+/)\n      .filter((t) => t.length >= 4)\n      .slice(0, 4);\n    if (terms.length === 0) continue;\n    const pattern = "%" + terms.join("%") + "%";\n    let q = sb\n      .from("legal_knowledge_chunks")\n      .select("id, title, content, metadata, category, source_type")\n      .eq("is_active", true)\n      .ilike("content", pattern)\n      .limit(6);\n    if (practiceArea) q = q.eq("category", practiceArea);\n    const { data } = await q;\n    for (const r of (data ?? []) as any[]) {\n      const st = ((r.source_type as string | null) ?? "").toLowerCase();\n      let bucket: Bucket = "laws";\n      if (st.includes("court")) bucket = "court_practice";\n      else if (st.includes("fns")) bucket = "fns_letters";\n      else if (st.includes("minfin")) bucket = "minfin_letters";\n      else if (st.includes("ekaterina")) bucket = "ekaterina";\n      else if (st.includes("manual") || st.includes("template")) bucket = "manuals";\n      if (expectedBucket && bucket !== expectedBucket) continue;\n      const source = makeChunkSource(r, bucket);\n      out.push(issue ? {\n        ...source,\n        metadata: {\n          ...(source.metadata ?? {}),\n          research_issue_ids: [issue.id],\n          research_issue_texts: [issue.issue],\n          research_modes: issue.modes,\n        },\n      } : source);\n    }\n  }\n  return out;\n}'''
          if new_gap not in s:
            if old_gap not in s: raise SystemExit('exact gapSearch block not found')
            s = s.replace(old_gap, new_gap, 1)
          p.write_text(s)

          p = Path('supabase/functions/analyze-document-legal-position/index.ts')
          s = p.read_text()
          marker = 'import { runChallenge } from "./challenge.ts";\n'
          if 'import { evaluateOfficialExplanationsCoverage }' not in s:
            s = s.replace(marker, 'import { evaluateOfficialExplanationsCoverage } from "./research-coverage.ts";\n' + marker, 1)
          s = s.replace('    const { sources: repositorySources, counts } = await runAllRepositories(\n', '    const { sources: repositorySources, counts, researchPlan } = await runAllRepositories(\n', 1)
          old = '''    let validatedConclusions = validateConclusions(provBuild.conclusions, trusted);\n    let sufficiency = evaluateSufficiency({\n      trusted,\n      conclusions: validatedConclusions,\n    });'''
          new = '''    let validatedConclusions = validateConclusions(provBuild.conclusions, trusted);\n    let officialExplanationsCoverage = evaluateOfficialExplanationsCoverage({ plan: researchPlan, trusted });\n    let sufficiency = evaluateSufficiency({\n      trusted,\n      conclusions: validatedConclusions,\n      researchCoverageGaps: officialExplanationsCoverage.gaps,\n    });'''
          if old not in s: raise SystemExit('initial sufficiency block not found')
          s = s.replace(old, new, 1)
          s = s.replace('      const extraRaw = await gapSearch(sb, sufficiency.gaps, practiceArea);', '      const extraRaw = await gapSearch(sb, sufficiency.gaps, practiceArea, researchPlan);', 1)
          old = '''        validatedConclusions = validateConclusions(provBuild.conclusions, trusted);\n        sufficiency = evaluateSufficiency({\n          trusted,\n          conclusions: validatedConclusions,\n        });'''
          new = '''        validatedConclusions = validateConclusions(provBuild.conclusions, trusted);\n        officialExplanationsCoverage = evaluateOfficialExplanationsCoverage({ plan: researchPlan, trusted });\n        sufficiency = evaluateSufficiency({\n          trusted,\n          conclusions: validatedConclusions,\n          researchCoverageGaps: officialExplanationsCoverage.gaps,\n        });'''
          if old not in s: raise SystemExit('retry sufficiency block not found')
          s = s.replace(old, new, 1)
          marker = '    parsed.source_sufficiency = sufficiency;\n'
          add = marker + '    parsed.research_coverage = { official_explanations: officialExplanationsCoverage };\n'
          if add not in s: s = s.replace(marker, add, 1)
          p.write_text(s)
          PY

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Research coverage tests
        run: bun test supabase/functions/analyze-document-legal-position/research-routing.test.ts supabase/functions/analyze-document-legal-position/research-coverage.test.ts supabase/functions/analyze-document-legal-position/dedupe-canonical.test.ts supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Commit source files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-document-legal-position/enrich.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.ts supabase/functions/analyze-document-legal-position/repositories.ts supabase/functions/analyze-document-legal-position/index.ts
          git commit -m "feat(research): enforce issue-scoped explanation coverage"
          git push origin HEAD:feat/official-legal-sources-layer
