# Temporary verification workflow; remove after GREEN.
name: PR31 Post Main Sync Check

on:
  push:
    branches:
      - fix/registry-activity-match-and-builder-exit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: PR31 regression tests
        run: bun test supabase/tests/pr31-activity-match-and-builder-exit.test.ts
      - name: Supabase regression tests
        run: bun test supabase/tests/*.test.ts
      - name: Frontend regression tests
        run: bun test tests/*.test.ts
      - name: Analyzer regression tests
        run: bun test supabase/functions/analyze-document-legal-position/*.test.ts
      - name: Diff check against main
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Deno check company registry
        run: deno check --no-lock supabase/functions/company-registry-lookup/index.ts
