# Temporary verification workflow; remove after final verification.
name: PR31 Post Main Sync Check

on:
  push:
    branches:
      - fix/registry-activity-match-and-builder-exit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: PR31 regression tests
        run: bun test supabase/tests/pr31-activity-match-and-builder-exit.test.ts
      - name: Confirm unrelated failures already exist on main
        run: |
          git fetch origin main
          git worktree add /tmp/pr31-main origin/main
          set +e
          (cd /tmp/pr31-main && bun test supabase/tests/workspace-dark-card-contrast.test.ts supabase/tests/document-intake-retry.test.ts supabase/tests/extract-document-text-short-files.test.ts)
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected the three known main-baseline regressions to fail, but they passed. Reassess exclusion list."
            exit 1
          fi
          echo "Confirmed: known broad-suite failures reproduce on untouched origin/main."
      - name: Supabase regression tests excluding confirmed main-baseline failures
        run: |
          files=$(find supabase/tests -maxdepth 1 -name '*.test.ts' \
            ! -name 'workspace-dark-card-contrast.test.ts' \
            ! -name 'document-intake-retry.test.ts' \
            ! -name 'extract-document-text-short-files.test.ts' -print)
          bun test $files
      - name: Frontend regression tests
        run: bun test tests/*.test.ts
      - name: Analyzer regression tests
        run: bun test supabase/functions/analyze-document-legal-position/*.test.ts
      - name: Diff check against main
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Deno check company registry with automatic npm resolution
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/company-registry-lookup/index.ts
