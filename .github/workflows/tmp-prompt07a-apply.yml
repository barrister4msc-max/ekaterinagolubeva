name: TMP Prompt 07A Apply

on:
  push:
    branches:
      - fix/prompt07a-challenge-execution-readiness

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt07a-challenge-execution-readiness
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply minimal Prompt 07A patch
        shell: python
        run: |
          from pathlib import Path

          challenge = Path('supabase/functions/analyze-document-legal-position/challenge.ts')
          s = challenge.read_text()
          s = s.replace('export type ChallengeResult = {\n  status: "passed" | "needs_revision" | "blocked";', 'export type ChallengeExecutionStatus =\n  | "not_run"\n  | "unavailable"\n  | "invalid_response"\n  | "failed"\n  | "passed";\n\nexport type ChallengeResult = {\n  execution_status: ChallengeExecutionStatus;\n  status: "passed" | "needs_revision" | "blocked" | null;')
          s = s.replace('const EMPTY_RESULT: ChallengeResult = {\n  status: "passed",', 'const EMPTY_RESULT: ChallengeResult = {\n  execution_status: "not_run",\n  status: null,')
          s = s.replace('  reasoning: "Challenge pass skipped (no LLM key) or returned no issues.",', '  reasoning: "Challenge не завершён; содержательный verdict отсутствует.",')
          old = '''  // LLM pass (cheap flash model). Skips silently when key absent.\n  let llmIssues: ChallengeResult["issues"] = [];\n  let llmReasoning = "";\n  try {\n    if (Deno.env.get("GEMINI_API_KEY") || Deno.env.get("LOVABLE_API_KEY")) {\n      const prompt = buildChallengePrompt(opts);\n      const { text } = await callGeminiWithFallback(prompt, {\n        models: FLASH_GEMINI_MODELS,\n        temperature: 0.15,\n        maxOutputTokens: 2048,\n        responseMimeType: "application/json",\n      });\n      if (text) {\n        const parsed = safeParseGeminiJson(text) as Partial<ChallengeResult>;\n        if (Array.isArray(parsed?.issues)) llmIssues = parsed.issues;\n        if (typeof parsed?.reasoning === "string") llmReasoning = parsed.reasoning;\n        for (const r of parsed?.adverse_sources ?? []) {\n          if (typeof r === "string") adverseRefs.add(r);\n        }\n      }\n    }\n  } catch (e) {\n    console.warn("[challenge] LLM pass failed:", (e as Error).message);\n  }\n\n  const issues = [...seedIssues, ...llmIssues];'''
          new = '''  // LLM execution state is distinct from the substantive verdict. Missing\n  // credentials, invalid output and transport/model failure are never PASSED.\n  let llmIssues: ChallengeResult["issues"] = [];\n  let llmReasoning = "";\n  let executionStatus: ChallengeExecutionStatus = "not_run";\n  const hasChallengeKey = Boolean(\n    Deno.env.get("GEMINI_API_KEY") || Deno.env.get("LOVABLE_API_KEY"),\n  );\n\n  if (!hasChallengeKey) {\n    executionStatus = "unavailable";\n  } else {\n    try {\n      const prompt = buildChallengePrompt(opts);\n      const { text } = await callGeminiWithFallback(prompt, {\n        models: FLASH_GEMINI_MODELS,\n        temperature: 0.15,\n        maxOutputTokens: 2048,\n        responseMimeType: "application/json",\n      });\n      if (!text?.trim()) {\n        executionStatus = "invalid_response";\n      } else {\n        try {\n          const parsed = safeParseGeminiJson(text) as Partial<ChallengeResult>;\n          if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.issues)) {\n            executionStatus = "invalid_response";\n          } else {\n            llmIssues = parsed.issues;\n            if (typeof parsed.reasoning === "string") llmReasoning = parsed.reasoning;\n            for (const r of parsed.adverse_sources ?? []) {\n              if (typeof r === "string") adverseRefs.add(r);\n            }\n            executionStatus = "passed";\n          }\n        } catch (e) {\n          executionStatus = "invalid_response";\n          console.warn("[challenge] invalid response:", (e as Error).message);\n        }\n      }\n    } catch (e) {\n      executionStatus = "failed";\n      console.warn("[challenge] LLM pass failed:", (e as Error).message);\n    }\n  }\n\n  const issues = [...seedIssues, ...llmIssues];'''
          if old not in s:
            raise SystemExit('challenge LLM block not found')
          s = s.replace(old, new)
          old2 = '''  return {\n    status: blocked ? "blocked" : needsRevision ? "needs_revision" : "passed",\n    issues,\n    required_changes: deriveRequiredChanges(issues),\n    adverse_sources: [...adverseRefs],\n    unresolved_risks: deriveUnresolvedRisks(issues),\n    reasoning: llmReasoning || EMPTY_RESULT.reasoning,\n  };'''
          new2 = '''  return {\n    execution_status: executionStatus,\n    status: blocked\n      ? "blocked"\n      : needsRevision\n        ? "needs_revision"\n        : executionStatus === "passed"\n          ? "passed"\n          : null,\n    issues,\n    required_changes: deriveRequiredChanges(issues),\n    adverse_sources: [...adverseRefs],\n    unresolved_risks: deriveUnresolvedRisks(issues),\n    reasoning:\n      llmReasoning ||\n      (executionStatus === "passed"\n        ? "Challenge завершён без выявленных issues."\n        : EMPTY_RESULT.reasoning),\n  };'''
          if old2 not in s:
            raise SystemExit('challenge return block not found')
          challenge.write_text(s)

          enrich = Path('supabase/functions/analyze-document-legal-position/enrich.ts')
          s = enrich.read_text()
          s = s.replace('  challenge: { status: string; issues: Array<{ kind: string; description?: string }> };', '  challenge: {\n    execution_status?: string;\n    status: string | null;\n    issues: Array<{ kind: string; description?: string }>;\n  };')
          old3 = '''  const blockFinal =\n    blockDraft || opts.sufficiency.status !== "sufficient" || finalBlockingWarnings.length > 0;'''
          new3 = '''  const challengeCompleted = opts.challenge.execution_status === "passed";\n  const blockFinal =\n    blockDraft ||\n    !challengeCompleted ||\n    opts.challenge.status === "blocked" ||\n    opts.sufficiency.status !== "sufficient" ||\n    finalBlockingWarnings.length > 0;'''
          if old3 not in s:
            raise SystemExit('enrich blockFinal not found')
          s = s.replace(old3, new3)
          marker = '''  if (finalBlockingWarnings.length > 0) reasons.push("low_trust_or_superseded_used_in_generation");'''
          replacement = '''  if (!challengeCompleted) reasons.push(`challenge_execution:${opts.challenge.execution_status ?? "not_run"}`);\n  if (opts.challenge.status === "blocked") reasons.push("challenge:blocked");\n  if (finalBlockingWarnings.length > 0) reasons.push("low_trust_or_superseded_used_in_generation");'''
          if marker not in s:
            raise SystemExit('enrich reasons marker not found')
          s = s.replace(marker, replacement)
          enrich.write_text(s)

          index = Path('supabase/functions/analyze-document-legal-position/index.ts')
          s = index.read_text()
          old4 = '    for (const c of validatedConclusions) c.provenance.reviewed_by_challenge = true;'
          new4 = '    for (const c of validatedConclusions)\n      c.provenance.reviewed_by_challenge = challengeResult.execution_status === "passed";'
          if old4 not in s:
            raise SystemExit('index reviewed_by_challenge line not found')
          s = s.replace(old4, new4)
          index.write_text(s)

          test = Path('supabase/functions/analyze-document-legal-position/challenge-readiness-fail-closed.test.ts')
          test.write_text('''import { describe, expect, test } from "bun:test";\nimport { decideGeneration } from "./enrich.ts";\n\nconst base = {\n  sufficiency: { status: "sufficient" },\n  warnings: [],\n  conclusions: [],\n  trusted: [],\n};\n\nfunction decision(execution_status: string, status: string | null = null, issues: any[] = []) {\n  return decideGeneration({\n    ...base,\n    challenge: { execution_status, status, issues },\n  } as any);\n}\n\ndescribe("Prompt 07A challenge execution readiness", () => {\n  test("unavailable challenge preserves draft but blocks final", () => {\n    const result = decision("unavailable");\n    expect(result.draft).toBe(true);\n    expect(result.final).toBe(false);\n    expect(result.reasons).toContain("challenge_execution:unavailable");\n  });\n\n  test("failed challenge preserves draft but blocks final", () => {\n    const result = decision("failed");\n    expect(result.draft).toBe(true);\n    expect(result.final).toBe(false);\n    expect(result.reasons).toContain("challenge_execution:failed");\n  });\n\n  test("invalid response preserves draft but blocks final", () => {\n    const result = decision("invalid_response");\n    expect(result.draft).toBe(true);\n    expect(result.final).toBe(false);\n    expect(result.reasons).toContain("challenge_execution:invalid_response");\n  });\n\n  test("not-run or legacy missing execution status cannot become final", () => {\n    expect(decision("not_run").final).toBe(false);\n    const legacy = decideGeneration({\n      ...base,\n      challenge: { status: "passed", issues: [] },\n    } as any);\n    expect(legacy.final).toBe(false);\n    expect(legacy.reasons).toContain("challenge_execution:not_run");\n  });\n\n  test("completed valid challenge can allow final when all other gates pass", () => {\n    const result = decision("passed", "passed");\n    expect(result.draft).toBe(true);\n    expect(result.final).toBe(true);\n  });\n\n  test("completed challenge with blocking issue blocks draft and final", () => {\n    const result = decision("passed", "blocked", [{ kind: "critical_missing_evidence" }]);\n    expect(result.draft).toBe(false);\n    expect(result.final).toBe(false);\n  });\n});\n''')

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Prompt 07A regression
        run: bun test supabase/functions/analyze-document-legal-position/challenge-readiness-fail-closed.test.ts
      - name: Run adjacent evidence and lineage regressions
        run: |
          bun test supabase/functions/analyze-document-legal-position/evidence-relation-fail-closed.test.ts
          bun test supabase/functions/analyze-document-legal-position/evidence-contradiction-unresolved.test.ts
          bun test supabase/functions/analyze-document-legal-position/evidence-identity-fingerprint.test.ts
      - name: Diff check
        run: git diff --check
      - name: Commit verified product patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-prompt07a-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-document-legal-position/challenge.ts \
                  supabase/functions/analyze-document-legal-position/enrich.ts \
                  supabase/functions/analyze-document-legal-position/index.ts \
                  supabase/functions/analyze-document-legal-position/challenge-readiness-fail-closed.test.ts \
                  .github/workflows/tmp-prompt07a-apply.yml
          git commit -m "Fail closed when Challenge is not completed"
          git push origin HEAD:fix/prompt07a-challenge-execution-readiness
