name: TEMP P0-A12 DEBTAM matrix persistence

on:
  push:
    branches:
      - feat/p0a12-debtam-matrix-persistence
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0a12-debtam-matrix-persistence
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0a12-debtam-matrix-persistence
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Patch additive Analyzer persistence only
        id: patch
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/analyze-document-legal-position/index.ts')
          s = p.read_text(encoding='utf-8')

          imp_anchor = 'import { buildCompanyFactualEvidenceMatrix } from "./company-factual-evidence-matrix.ts";\n'
          imp_line = 'import { buildCompanyTaxDebtEvidenceMatrix } from "./company-tax-debt-evidence-matrix.ts";\n'
          if imp_line not in s:
              assert s.count(imp_anchor) == 1, s.count(imp_anchor)
              s = s.replace(imp_anchor, imp_anchor + imp_line, 1)

          build_anchor = '''    const companyFactualMatrix = buildCompanyFactualEvidenceMatrix(\n      companyFactualRuntime.company_factual_evidence,\n    );\n'''
          build_block = build_anchor + '''    // P0-A12: separate DEBTAM point-in-time factual matrix. It is audit-only\n    // and never enters legal/document evidence or model inputs.\n    const companyTaxDebtFactualMatrix = buildCompanyTaxDebtEvidenceMatrix(\n      companyFactualRuntime.company_tax_debt_evidence,\n    );\n'''
          if 'const companyTaxDebtFactualMatrix = buildCompanyTaxDebtEvidenceMatrix(' not in s:
              assert s.count(build_anchor) == 1, s.count(build_anchor)
              s = s.replace(build_anchor, build_block, 1)

          duplicate = '''          company_tax_debt_evidence: companyFactualRuntime.company_tax_debt_evidence,\n          company_factual_dataset_diagnostics: companyFactualRuntime.dataset_diagnostics,\n          company_tax_debt_evidence: companyFactualRuntime.company_tax_debt_evidence,\n          company_factual_dataset_diagnostics: companyFactualRuntime.dataset_diagnostics,\n'''
          single = '''          company_tax_debt_evidence: companyFactualRuntime.company_tax_debt_evidence,\n          company_factual_dataset_diagnostics: companyFactualRuntime.dataset_diagnostics,\n'''
          while duplicate in s:
              s = s.replace(duplicate, single, 1)
          assert duplicate not in s

          if 'company_tax_debt_factual_matrix_diagnostics:' not in s:
              lines = s.splitlines(keepends=True)
              out = []
              seen = 0
              target = 'company_factual_matrix_diagnostics: companyFactualMatrix.diagnostics,'
              for line in lines:
                  out.append(line)
                  if line.strip() == target:
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(indent + 'company_tax_debt_factual_evidence_matrix: companyTaxDebtFactualMatrix.company_tax_debt_factual_evidence_matrix,\n')
                      out.append(indent + 'company_tax_debt_factual_matrix_diagnostics: companyTaxDebtFactualMatrix.diagnostics,\n')
                      seen += 1
              assert seen == 4, seen
              s = ''.join(out)

          parsed_anchor = '''    parsed.company_factual_identity = {\n      canonical_company_facts: companyFactualMatrix.canonical_company_facts,\n      company_fact_evidence_links: companyFactualMatrix.company_fact_evidence_links,\n      diagnostics: companyFactualMatrix.diagnostics,\n    };\n'''
          parsed_add = parsed_anchor + '''    // P0-A12: DEBTAM identity/matrix persistence remains a separate factual channel.\n    parsed.company_tax_debt_factual_evidence_matrix =\n      companyTaxDebtFactualMatrix.company_tax_debt_factual_evidence_matrix;\n    parsed.company_tax_debt_factual_identity = {\n      canonical_company_tax_debt_facts:\n        companyTaxDebtFactualMatrix.canonical_company_tax_debt_facts,\n      company_tax_debt_evidence_links:\n        companyTaxDebtFactualMatrix.company_tax_debt_evidence_links,\n      diagnostics: companyTaxDebtFactualMatrix.diagnostics,\n    };\n'''
          if 'parsed.company_tax_debt_factual_identity = {' not in s:
              assert s.count(parsed_anchor) == 1, s.count(parsed_anchor)
              s = s.replace(parsed_anchor, parsed_add, 1)

          assert s.count('company_tax_debt_factual_matrix_diagnostics:') == 4
          assert s.count('company_tax_debt_factual_evidence_matrix:') >= 4
          assert 'parsed.company_tax_debt_factual_identity = {' in s
          assert imp_line in s
          assert duplicate not in s
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Install
        id: install
        continue-on-error: true
        run: bun install --frozen-lockfile

      - name: P0-A12 orchestration test
        id: orchestration
        continue-on-error: true
        run: bun test ./supabase/functions/analyze-document-legal-position/company-tax-debt-matrix-orchestration.test.ts

      - name: Factual matrix regressions
        id: regressions
        continue-on-error: true
        run: |
          bun test ./supabase/functions/analyze-document-legal-position/company-tax-debt-evidence-matrix.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-factual-evidence-matrix.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-factual-identity.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-tax-debt-evidence.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-factual-runtime.test.ts

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Diff check
        id: diffcheck
        continue-on-error: true
        run: git diff --check origin/feat/p0a11-debtam-canonical-identity-matrix...HEAD && git diff --check

      - name: Record verified branch state
        if: always()
        env:
          BRANCH: feat/p0a12-debtam-matrix-persistence
          PATCH: ${{ steps.patch.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          ORCHESTRATION: ${{ steps.orchestration.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
        run: |
          cat > .tmp-p0a12-verification-status.txt <<EOF
          patch=$PATCH
          install=$INSTALL
          orchestration=$ORCHESTRATION
          regressions=$REGRESSIONS
          typecheck=$TYPECHECK
          diffcheck=$DIFFCHECK
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-document-legal-position/index.ts .tmp-p0a12-verification-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "feat: persist and verify DEBTAM factual matrix audit"
          fi
          git push origin HEAD:"$BRANCH"

      - name: Enforce GREEN
        if: always()
        env:
          PATCH: ${{ steps.patch.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          ORCHESTRATION: ${{ steps.orchestration.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
        run: |
          test "$PATCH" = success
          test "$INSTALL" = success
          test "$ORCHESTRATION" = success
          test "$REGRESSIONS" = success
          test "$TYPECHECK" = success
          test "$DIFFCHECK" = success
