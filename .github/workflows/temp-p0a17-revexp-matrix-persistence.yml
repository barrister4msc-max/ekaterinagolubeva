name: TEMP P0-A17 REVEXP matrix persistence
on:
  push:
    branches: [feat/p0a17-revexp-matrix-persistence]
  pull_request:
    branches: [feat/p0a16-revexp-canonical-identity-matrix]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.22 }
      - name: Patch Analyzer
        id: patch
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('supabase/functions/analyze-document-legal-position/index.ts')
          s=p.read_text()
          if 'import { buildCompanyFinancialStatementEvidenceMatrix }' not in s:
            s,n=re.subn(r'(import \{ buildCompanyTaxDebtEvidenceMatrix \} from "\./company-tax-debt-evidence-matrix\.ts";\n)',r'\1import { buildCompanyFinancialStatementEvidenceMatrix } from "./company-financial-statement-evidence-matrix.ts";\n',s,count=1)
            assert n==1,n
          if 'const companyFinancialStatementFactualMatrix' not in s:
            pat=r'(    const companyTaxDebtFactualMatrix = buildCompanyTaxDebtEvidenceMatrix\(\n      companyFactualRuntime\.company_tax_debt_evidence,\n    \);\n)'
            add=r'''\1    // P0-A17: separate REVEXP factual matrix; audit-only.
    const companyFinancialStatementFactualMatrix = buildCompanyFinancialStatementEvidenceMatrix(
      companyFactualRuntime.company_financial_statement_evidence,
    );
'''
            s,n=re.subn(pat,add,s,count=1); assert n==1,n
          if 'company_financial_statement_factual_evidence_matrix: companyFinancialStatementFactualMatrix.company_financial_statement_evidence_matrix,' not in s:
            pat=re.compile(r'(?m)^(\s*)company_financial_statement_evidence: companyFactualRuntime\.company_financial_statement_evidence,\n')
            def repl(m):
              i=m.group(1)
              return f'{i}company_financial_statement_evidence: companyFactualRuntime.company_financial_statement_evidence,\n{i}company_financial_statement_factual_evidence_matrix: companyFinancialStatementFactualMatrix.company_financial_statement_evidence_matrix,\n{i}company_financial_statement_factual_matrix_diagnostics: companyFinancialStatementFactualMatrix.diagnostics,\n'
            s,n=pat.subn(repl,s); assert n==4,n
          if 'parsed.company_financial_statement_factual_identity = {' not in s:
            anchor='    parsed.company_financial_statement_evidence = companyFactualRuntime.company_financial_statement_evidence;\n'
            assert s.count(anchor)==1,s.count(anchor)
            add=anchor+'''    parsed.company_financial_statement_factual_evidence_matrix =
      companyFinancialStatementFactualMatrix.company_financial_statement_evidence_matrix;
    parsed.company_financial_statement_factual_identity = {
      canonical_company_financial_statement_facts:
        companyFinancialStatementFactualMatrix.canonical_company_financial_statement_facts,
      company_financial_statement_fact_evidence_links:
        companyFinancialStatementFactualMatrix.company_financial_statement_fact_evidence_links,
      diagnostics: companyFinancialStatementFactualMatrix.diagnostics,
    };
'''
            s=s.replace(anchor,add,1)
          p.write_text(s)
          PY
          git diff --check
          if [ "${{ github.event_name }}" = "push" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add supabase/functions/analyze-document-legal-position/index.ts
            git commit -m "feat: persist REVEXP factual matrix in Analyzer audit"
            git push origin HEAD:feat/p0a17-revexp-matrix-persistence
          fi
      - name: Install
        id: install
        continue-on-error: true
        run: bun install --frozen-lockfile
      - name: Orchestration
        id: orchestration
        continue-on-error: true
        run: bun test ./supabase/functions/analyze-document-legal-position/company-financial-statement-matrix-orchestration.test.ts
      - name: Matrix regressions
        id: matrix
        continue-on-error: true
        run: |
          bun test ./supabase/functions/analyze-document-legal-position/company-financial-statement-identity.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-financial-statement-evidence-matrix.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-financial-statement-evidence.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-revexp-runtime.test.ts
      - name: Existing regressions
        id: regressions
        continue-on-error: true
        run: |
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-factual-runtime.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-tax-debt-evidence.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-tax-debt-evidence-matrix.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-factual-identity.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-factual-evidence-matrix.test.ts
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: Diffcheck
        id: diffcheck
        continue-on-error: true
        run: git diff --check origin/feat/p0a16-revexp-canonical-identity-matrix...HEAD
      - name: Record
        if: always() && github.event_name == 'push'
        env:
          PATCH: ${{ steps.patch.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          ORCH: ${{ steps.orchestration.outcome }}
          MATRIX: ${{ steps.matrix.outcome }}
          REG: ${{ steps.regressions.outcome }}
          TYPE: ${{ steps.typecheck.outcome }}
          DIFF: ${{ steps.diffcheck.outcome }}
        run: |
          printf 'patch=%s\ninstall=%s\norchestration=%s\nmatrix=%s\nregressions=%s\ntypecheck=%s\ndiffcheck=%s\n' "$PATCH" "$INSTALL" "$ORCH" "$MATRIX" "$REG" "$TYPE" "$DIFF" > .tmp-p0a17-verification-status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp-p0a17-verification-status.txt
          git commit -m "chore: record P0-A17 verification outcomes"
          git push origin HEAD:feat/p0a17-revexp-matrix-persistence
      - name: Enforce GREEN
        if: always()
        env:
          PATCH: ${{ steps.patch.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          ORCH: ${{ steps.orchestration.outcome }}
          MATRIX: ${{ steps.matrix.outcome }}
          REG: ${{ steps.regressions.outcome }}
          TYPE: ${{ steps.typecheck.outcome }}
          DIFF: ${{ steps.diffcheck.outcome }}
        run: |
          test "$PATCH" = success && test "$INSTALL" = success && test "$ORCH" = success && test "$MATRIX" = success && test "$REG" = success && test "$TYPE" = success && test "$DIFF" = success
