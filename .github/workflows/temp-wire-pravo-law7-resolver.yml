name: TEMP Wire Pravo Law7 resolver

on:
  push:
    branches:
      - fix/pravo-law7-canonical-verification

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pravo-law7-canonical-verification
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Wire resolver exactly once
        shell: python
        run: |
          from pathlib import Path
          p = Path('supabase/functions/analyze-document-legal-position/repositories.ts')
          s = p.read_text()
          import_anchor = 'import { SupabaseLaw7ResearchProvider, SupabaseLaw7Transport } from "./law7-supabase-transport.ts";\n'
          import_line = 'import { applyLaw7OfficialVerification } from "./official-verification-resolver.ts";\n'
          if import_line not in s:
              if import_anchor not in s:
                  raise SystemExit('import anchor missing')
              s = s.replace(import_anchor, import_anchor + import_line, 1)
          old = '  const localSources = [...laws, ...court, ...fns, ...minfin, ...ek, ...manuals, ...law7.sources];\n  const mergedOfficial = mergeOfficialWithLocalSources(localSources, official.sources);'
          new = '''  const verifiedLaw7Sources = law7.sources.map((source) =>
            applyLaw7OfficialVerification(source, official.sources) as RawSource
          );
          const localSources = [...laws, ...court, ...fns, ...minfin, ...ek, ...manuals, ...verifiedLaw7Sources];
          const mergedOfficial = mergeOfficialWithLocalSources(localSources, official.sources);'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const verifiedLaw7Sources = law7.sources.map' not in s:
              raise SystemExit('runtime anchor missing')
          p.write_text(s)
      - name: Commit runtime wiring if changed
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/functions/analyze-document-legal-position/repositories.ts
            git commit -m "Wire Pravo Law7 resolver into repository runtime"
            git push origin HEAD:fix/pravo-law7-canonical-verification
          fi
      - name: Install
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun test supabase/functions/analyze-document-legal-position/official-verification-resolver.test.ts supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/law7-repository-wiring.test.ts
      - name: Typecheck
        run: bun run typecheck
