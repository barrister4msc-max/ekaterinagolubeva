name: TEMP P0-A18 SSHR2019 audit
on:
  push:
    branches: [feat/p0a18-sshr2019-freshness-schema-audit]
  pull_request:
    branches: [feat/p0a17-revexp-matrix-persistence]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.22 }
      - name: Official release proof
        id: official
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          data_url='https://file.nalog.ru/opendata/7707329152-sshr2019/data-20260725-structure-20200408.zip'
          xsd_url='https://file.nalog.ru/opendata/7707329152-sshr2019/structure-20200408.xsd'
          def get(u):
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 KATI-LAWYER-source-audit'})
              with urllib.request.urlopen(req,timeout=180) as r:return r.read()
          xsd=get(xsd_url); data=get(data_url)
          assert hashlib.sha256(data).hexdigest()=='265eca8b05a234ff629f57779ebbc647d07e42c7e43612b40e9ae84340de1464'
          assert hashlib.sha256(xsd).hexdigest()=='3c63a9447e0c0dbacaf9fe11f1888c5873137f9252f226c148303dd6dfa9d137'
          z=zipfile.ZipFile(io.BytesIO(data)); names=[n for n in z.namelist() if n.lower().endswith('.xml')]
          assert len(names)==2271
          docs=inns=counts=0; zero=False
          for n in names[:5]:
              root=ET.fromstring(z.read(n)); assert root.attrib.get('ВерсФорм')=='4.01'
              for e in root.iter():
                  tag=e.tag.split('}')[-1]
                  if tag=='Документ':
                      docs+=1; assert e.attrib.get('ДатаДок')=='25.07.2026'; assert e.attrib.get('ДатаСост')=='31.12.2025'; assert e.attrib.get('ИдДок')
                  elif tag=='СведНП':
                      inns+=1; inn=e.attrib.get('ИННЮЛ',''); assert len(inn)==10 and inn.isdigit(); assert e.attrib.get('НаимОрг')
                  elif tag=='СведССЧР':
                      counts+=1; raw=e.attrib.get('КолРаб'); assert raw is not None and raw.isdigit(); zero = zero or raw=='0'
          assert docs==4500 and inns==4500 and counts==4500 and zero
          PY
      - name: Install
        id: install
        continue-on-error: true
        run: bun install --frozen-lockfile
      - name: Catalog tests
        id: catalog
        continue-on-error: true
        run: bun test ./supabase/functions/analyze-document-legal-position/fns-open-data-catalog.test.ts
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: Diffcheck
        id: diffcheck
        continue-on-error: true
        run: git diff --check origin/feat/p0a17-revexp-matrix-persistence...HEAD
      - name: Record
        if: always() && github.event_name == 'push'
        env:
          OFFICIAL: ${{ steps.official.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          CATALOG: ${{ steps.catalog.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
        run: |
          printf 'official=%s\ninstall=%s\ncatalog=%s\ntypecheck=%s\ndiffcheck=%s\n' "$OFFICIAL" "$INSTALL" "$CATALOG" "$TYPECHECK" "$DIFFCHECK" > .tmp-p0a18-verification-status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp-p0a18-verification-status.txt
          git commit -m "chore: record P0-A18 verification outcomes"
          git push origin HEAD:feat/p0a18-sshr2019-freshness-schema-audit
      - name: Enforce GREEN
        if: always()
        env:
          OFFICIAL: ${{ steps.official.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          CATALOG: ${{ steps.catalog.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
        run: |
          test "$OFFICIAL" = success && test "$INSTALL" = success && test "$CATALOG" = success && test "$TYPECHECK" = success && test "$DIFFCHECK" = success
