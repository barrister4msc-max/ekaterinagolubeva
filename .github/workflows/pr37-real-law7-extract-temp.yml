name: PR37 Real Law7 Extraction TEMP

on:
  push:
    branches:
      - feat/law7-controlled-real-data-poc
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: law7
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d law7"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      LAW7_BACKUP_SHA256: 70a1d8fc6b27b67ad7f12f03f017d02b5f68a0c895447159039800965895f8b2
      LAW7_SOURCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/law7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction dependencies
        run: pip install --disable-pip-version-check gdown 'psycopg[binary]'

      - name: Download published Law7 backup
        run: |
          gdown 'https://drive.google.com/file/d/1DPLpFpuwUZbLZEGo2TxnCAcLRdb2V1aD/view?usp=sharing' -O /tmp/law7_backup.tar.gz
          test -s /tmp/law7_backup.tar.gz

      - name: Verify upstream backup checksum
        run: |
          ACTUAL="$(sha256sum /tmp/law7_backup.tar.gz | awk '{print $1}')"
          echo "backup_sha256=$ACTUAL"
          test "$ACTUAL" = "$LAW7_BACKUP_SHA256"

      - name: Extract PostgreSQL dump only
        run: |
          mkdir -p /tmp/law7_backup
          tar -xzf /tmp/law7_backup.tar.gz -C /tmp/law7_backup
          DUMP="$(find /tmp/law7_backup -type f -path '*/postgresql/law7.dump' -print -quit)"
          test -n "$DUMP"
          echo "LAW7_DUMP=$DUMP" >> "$GITHUB_ENV"

      - name: Restore only Law7 consolidated-code tables
        run: |
          pg_restore -h 127.0.0.1 -U postgres -d law7 --no-owner --no-acl \
            --table=consolidated_codes \
            --table=code_article_versions \
            --table=amendment_applications \
            "$LAW7_DUMP"
          psql -h 127.0.0.1 -U postgres -d law7 -Atc "select count(*) from code_article_versions;"
          psql -h 127.0.0.1 -U postgres -d law7 -Atc "select count(*) from code_article_versions where code_id='NK_RF' and article_number in ('54.1','88','89','93','100','101');"

      - name: Export controlled real Law7 dataset
        env:
          LAW7_SOURCE_COMMIT: 70a1d8fc6b27b67ad7f12f03f017d02b5f68a0c895447159039800965895f8b2
        run: |
          python scripts/law7_controlled_export.py --output /tmp/law7_nk_controlled.json
          python scripts/law7_mirror_import.py --input /tmp/law7_nk_controlled.json

      - name: Assert controlled scope
        run: |
          python - <<'PY'
          import json
          p='/tmp/law7_nk_controlled.json'
          d=json.load(open(p, encoding='utf-8'))
          allowed={'54.1','88','89','93','100','101'}
          articles={str(r['article_number']) for r in d['article_versions']}
          assert articles == allowed, (articles, allowed)
          assert d['source_commit'] == '70a1d8fc6b27b67ad7f12f03f017d02b5f68a0c895447159039800965895f8b2'
          assert all(r['code_id']=='NK_RF' for r in d['article_versions'])
          print(json.dumps({
            'codes': len(d['codes']),
            'articles': sorted(articles),
            'article_versions': len(d['article_versions']),
            'amendments': len(d['amendments']),
            'source_revision': d['source_commit'],
          }, ensure_ascii=False))
          PY

      - name: Upload controlled dataset
        uses: actions/upload-artifact@v4
        with:
          name: pr37-law7-nk-controlled-real-data
          path: /tmp/law7_nk_controlled.json
          retention-days: 1
          if-no-files-found: error
