name: TEMP PR43 Analyzer Auth

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/analyzer-auth-guard-v2]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Analyzer auth regressions
        run: bun test supabase/tests/analyze-document-legal-position-auth.test.ts
      - name: Provider safety regressions
        run: bun test supabase/functions/analyze-document-legal-position/provider-safety-contract.test.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
