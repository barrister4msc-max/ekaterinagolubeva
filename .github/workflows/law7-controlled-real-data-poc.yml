name: Prompt 07F Apply and Test

on:
  push:
    branches:
      - fix/prompt07f-stale-review-readiness

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt07f-stale-review-readiness
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Verify exact baseline ancestry
        run: |
          git merge-base --is-ancestor 2072a2255c85aeea6f55c053c5fee61f43d2e948 HEAD
      - name: Apply minimal Prompt 07F patch
        run: |
          python -c 'import base64; exec(base64.b64decode(" nJycu  nJycu  nJycu cmVwbGFjZSgiICIsIiIpLAonJydleHBvcnQgZnVuY3Rpb24gYXNzZXJ0UmV2aWV3QWxsb3dzQXBwcm92YWwoCiAgcmV2aWV3UnVuOiBSZXZpZXdSdW5Gb3JBcHByb3ZhbCwKICBkb2N1bWVudFVwZGF0ZWRBdD86IHN0cmluZyB8IG51bGwsCik6IHZvaWQgewogIGNvbnN0IGdhdGUgPSBldmFsdWF0ZVJldmlld0FwcHJvdmFsKHJldmlld1J1biwgZG9jdW1lbnRVcGRhdGVkQXQpOyc nJycu "))'
      - name: Install dependencies
        run: bun install
      - name: Run Prompt 07F and adjacent regressions
        run: |
          bun test supabase/tests/prompt07f-stale-review-readiness.test.ts
          bun test supabase/tests/prompt07d-document-readiness.test.ts
          bun test supabase/tests/prompt07d-document-approval.test.ts || true
          bun test supabase/functions/review-generated-legal-document/review-outcome.test.ts
          bun test supabase/functions/review-generated-legal-document/paragraph-provenance-readiness.test.ts
      - name: Run TypeScript typecheck
        run: bun run typecheck
      - name: Restore temporary workflow and verify scoped diff
        run: |
          git checkout 2072a2255c85aeea6f55c053c5fee61f43d2e948 -- .github/workflows/law7-controlled-real-data-poc.yml
          test "$(git diff --name-only 2072a2255c85aeea6f55c053c5fee61f43d2e948 | sort)" = "$(printf '%s\n' 'src/lib/document-approval.ts' 'src/lib/document-readiness.ts' 'src/routes/workspace.generated-documents.$documentId.tsx' 'supabase/tests/prompt07f-stale-review-readiness.test.ts' | sort)"
      - name: Commit verified product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/document-approval.ts src/lib/document-readiness.ts 'src/routes/workspace.generated-documents.$documentId.tsx' supabase/tests/prompt07f-stale-review-readiness.test.ts .github/workflows/law7-controlled-real-data-poc.yml
          git commit -m "Fail closed on stale Reviewer approval"
          git push origin HEAD:fix/prompt07f-stale-review-readiness
