name: Prompt07D Scoped Verifier

on:
  push:
    branches:
      - fix/prompt07d-missing-review-readiness

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt07d-missing-review-readiness
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply minimal Prompt 07D patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/document-readiness.ts')
          s = p.read_text()
          a='''  review: any | null; // review_run.ai_result
  // Source Review warnings whose affected_conclusions is non-empty are treated
'''
          b='''  review: any | null; // review_run.ai_result
  reviewCompleted: boolean;
  // Source Review warnings whose affected_conclusions is non-empty are treated
'''
          assert a in s
          s=s.replace(a,b,1)
          a='''  // NEEDS_REVISION
  if (reviewStatus === "needs_revision") {
    reasons.push(`review_status=${reviewStatus}`);
  }
'''
          b='''  // NEEDS_REVISION
  const validReviewStatuses = new Set(["passed", "needs_revision", "blocked"]);
  if (!input.reviewCompleted) {
    reasons.push("review_not_completed");
  } else if (!validReviewStatuses.has(reviewStatus)) {
    reasons.push("review_result_invalid");
  }
  if (reviewStatus === "needs_revision") {
    reasons.push(`review_status=${reviewStatus}`);
  }
'''
          assert a in s
          p.write_text(s.replace(a,b,1))

          Path('src/lib/document-approval.ts').write_text('''export type ReviewRunForApproval = { status?: unknown; ai_result?: unknown } | null;\n\nexport type ReviewApprovalGate =\n  | { allowed: true; reason: null }\n  | { allowed: false; reason: "review_not_completed" | "review_result_invalid" | "review_not_passed" };\n\nexport function evaluateReviewApproval(reviewRun: ReviewRunForApproval): ReviewApprovalGate {\n  if (!reviewRun || String(reviewRun.status ?? "").toLowerCase() !== "completed") {\n    return { allowed: false, reason: "review_not_completed" };\n  }\n  const result = reviewRun.ai_result && typeof reviewRun.ai_result === "object" && !Array.isArray(reviewRun.ai_result)\n    ? reviewRun.ai_result as Record<string, unknown>\n    : null;\n  const reviewStatus = String(result?.review_status ?? "").toLowerCase();\n  if (!["passed", "needs_revision", "blocked"].includes(reviewStatus)) {\n    return { allowed: false, reason: "review_result_invalid" };\n  }\n  if (reviewStatus !== "passed") return { allowed: false, reason: "review_not_passed" };\n  return { allowed: true, reason: null };\n}\n\nexport function assertReviewAllowsApproval(reviewRun: ReviewRunForApproval): void {\n  const gate = evaluateReviewApproval(reviewRun);\n  if (!gate.allowed) throw new Error(`Document approval blocked: ${gate.reason}`);\n}\n''')

          p = Path('src/routes/workspace.generated-documents.$documentId.tsx')
          s = p.read_text()
          a='import { computeDocumentReadiness } from "@/lib/document-readiness";\n'
          assert a in s
          s=s.replace(a,a+'import { assertReviewAllowsApproval } from "@/lib/document-approval";\n',1)
          a='''  const approve = useMutation({
    mutationFn: async () => {
      if (!doc) return;
      const { data: u } = await supabase.auth.getUser();
      const { error } = await supabase
'''
          b='''  const approve = useMutation({
    mutationFn: async () => {
      if (!doc) return;
      const { data: latestReviewRun, error: latestReviewError } = await supabase
        .from("document_intake_ai_runs")
        .select("status,ai_result")
        .eq("generated_document_id" as any, doc.id)
        .order("created_at", { ascending: false })
        .limit(1)
        .maybeSingle();
      if (latestReviewError) throw latestReviewError;
      assertReviewAllowsApproval(latestReviewRun);

      const { data: u } = await supabase.auth.getUser();
      const { error } = await supabase
'''
          assert a in s
          s=s.replace(a,b,1)
          a='''      computeDocumentReadiness({
        consistency,
        review,
        sourceWarnings: (matterSnapshot?.source_warnings as any[]) ?? null,
      }),
    [consistency, review, matterSnapshot?.source_warnings],
'''
          b='''      computeDocumentReadiness({
        consistency,
        review,
        reviewCompleted:
          !!reviewRun && String(reviewRun.status ?? "").toLowerCase() === "completed",
        sourceWarnings: (matterSnapshot?.source_warnings as any[]) ?? null,
      }),
    [consistency, review, reviewRun, matterSnapshot?.source_warnings],
'''
          assert a in s
          p.write_text(s.replace(a,b,1))

          Path('src/lib/document-readiness.test.ts').write_text('''import { describe, expect, test } from "bun:test";\nimport { computeDocumentReadiness } from "./document-readiness";\nconst consistency = { ready: true, criticalFailed: [], warningsFailed: [], blockReason: null };\ndescribe("Prompt 07D readiness", () => {\n  test("missing review is fail-closed", () => { const r=computeDocumentReadiness({consistency,review:null,reviewCompleted:false}); expect(r.status).toBe("NEEDS_REVISION"); expect(r.reasons).toContain("review_not_completed"); });\n  test("invalid completed review is fail-closed", () => { const r=computeDocumentReadiness({consistency,review:{},reviewCompleted:true}); expect(r.status).toBe("NEEDS_REVISION"); expect(r.reasons).toContain("review_result_invalid"); });\n  test("completed passed review can be ready", () => expect(computeDocumentReadiness({consistency,review:{review_status:"passed",problems:[]},reviewCompleted:true})).toEqual({status:"READY",reasons:[]}));\n  test("noncritical findings remain warnings", () => expect(computeDocumentReadiness({consistency,review:{review_status:"passed",problems:[{severity:"high"}]},reviewCompleted:true}).status).toBe("READY_WITH_WARNINGS"));\n  test("needs_revision and blocked are preserved", () => { expect(computeDocumentReadiness({consistency,review:{review_status:"needs_revision"},reviewCompleted:true}).status).toBe("NEEDS_REVISION"); expect(computeDocumentReadiness({consistency,review:{review_status:"blocked"},reviewCompleted:true}).status).toBe("BLOCKED"); });\n});\n''')
          Path('src/lib/document-approval.test.ts').write_text('''import { describe, expect, test } from "bun:test";\nimport { assertReviewAllowsApproval, evaluateReviewApproval } from "./document-approval";\ndescribe("Prompt 07D approval", () => {\n  test("missing pending failed are rejected", () => { expect(evaluateReviewApproval(null).allowed).toBe(false); expect(evaluateReviewApproval({status:"pending",ai_result:{review_status:"passed"}}).allowed).toBe(false); expect(evaluateReviewApproval({status:"failed",ai_result:{review_status:"passed"}}).allowed).toBe(false); });\n  test("invalid result is rejected", () => expect(evaluateReviewApproval({status:"completed",ai_result:{}})).toEqual({allowed:false,reason:"review_result_invalid"}));\n  test("needs_revision and blocked are rejected", () => { expect(evaluateReviewApproval({status:"completed",ai_result:{review_status:"needs_revision"}}).allowed).toBe(false); expect(evaluateReviewApproval({status:"completed",ai_result:{review_status:"blocked"}}).allowed).toBe(false); });\n  test("completed passed is accepted", () => { const run={status:"completed",ai_result:{review_status:"passed"}}; expect(evaluateReviewApproval(run)).toEqual({allowed:true,reason:null}); expect(() => assertReviewAllowsApproval(run)).not.toThrow(); });\n  test("assertion fails closed", () => expect(() => assertReviewAllowsApproval(null)).toThrow("review_not_completed"));\n});\n''')
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Targeted regressions
        run: bun test src/lib/document-readiness.test.ts src/lib/document-approval.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Commit verified product patch
        shell: bash
        run: |
          git checkout 9d26b3b70c286e46a5a3a79b93a7b8b07084ec7a -- .github/workflows/law7-controlled-real-data-poc.yml .github/workflows/pr-quality-gate.yml
          rm -f .github/workflows/prompt07d-apply-test.yml
          changed="$(git diff --name-only 9d26b3b70c286e46a5a3a79b93a7b8b07084ec7a | sort)"
          expected="$(printf '%s\n' 'src/lib/document-approval.test.ts' 'src/lib/document-approval.ts' 'src/lib/document-readiness.test.ts' 'src/lib/document-readiness.ts' 'src/routes/workspace.generated-documents.$documentId.tsx' | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fail closed on missing Reviewer approval gate"
          git push origin HEAD:fix/prompt07d-missing-review-readiness
