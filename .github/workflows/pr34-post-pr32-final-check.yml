# Temporary verification workflow; remove after GREEN.
name: PR34 Post PR32 Final Check

on:
  push:
    branches:
      - feat/external-legal-research-import
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Human Research Connector tests
        run: bun test tests/external-research-human-connector.test.ts
      - name: External research extractor tests
        run: bun test tests/external-legal-research-extractor.test.ts
      - name: External research staging tests
        run: bun test tests/external-legal-research-staging.test.ts
      - name: External research OCR safety tests
        run: bun test supabase/tests/extract-external-research-text-safety.test.ts
      - name: External Research Analyzer tests
        run: bun test supabase/functions/analyze-document-legal-position/external-research-import.test.ts
      - name: Temporal regression tests after sync
        run: bun test supabase/functions/analyze-document-legal-position/temporal-gap-retry.test.ts supabase/functions/analyze-document-legal-position/temporal-applicability.test.ts supabase/functions/analyze-document-legal-position/temporal-date.test.ts
      - name: Complete Analyzer tests
        run: bun test supabase/functions/analyze-document-legal-position/*.test.ts
      - name: Diff check against main
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
