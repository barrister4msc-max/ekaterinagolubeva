name: TEMP P0-A3 FNS SNR factual evidence

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260820173000_fns_open_data_snr_company_facts.sql'
      - 'supabase/functions/analyze-document-legal-position/fns-company-factual-evidence.ts'
      - 'supabase/functions/analyze-document-legal-position/fns-company-factual-evidence.test.ts'
      - 'supabase/tests/fns-open-data-snr-storage-contract.test.ts'
      - 'scripts/fns_open_data_snr_dry_run.py'
      - 'scripts/test_fns_open_data_snr_dry_run.py'
      - '.github/workflows/temp-p0a3-fns-snr-factual-evidence.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: FNS SNR parser tests
        run: python3 scripts/test_fns_open_data_snr_dry_run.py
      - name: FNS factual evidence tests
        run: bun test supabase/functions/analyze-document-legal-position/fns-company-factual-evidence.test.ts supabase/tests/fns-open-data-snr-storage-contract.test.ts
      - name: Existing FNS catalog tests
        run: bun test supabase/functions/analyze-document-legal-position/fns-open-data-catalog.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
