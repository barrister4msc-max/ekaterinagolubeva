name: PR32 Official Issue Routing Apply

on:
  push:
    branches:
      - feat/official-legal-sources-layer

permissions:
  contents: write

jobs:
  apply-check-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-legal-sources-layer
          fetch-depth: 0
      - name: Make official search issue-scoped
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/analyze-document-legal-position/repositories.ts')
          s = p.read_text()

          old_import = '''  searchOfficialLegalSources,\n  type OfficialSourceResult,\n  type OfficialSourceSafety,\n} from "./official-sources.ts";'''
          new_import = '''  searchOfficialLegalSources,\n  type OfficialSourceDiagnostics,\n  type OfficialSourceResult,\n  type OfficialSourceSafety,\n} from "./official-sources.ts";'''
          if new_import not in s:
              if old_import not in s: raise SystemExit('official import block not found')
              s = s.replace(old_import, new_import, 1)

          marker = '''  const searchPerIssue = async (bucket: Bucket): Promise<RawSource[]> => {\n    const repository = repos[bucket];\n    const questions = researchPlan.questions.filter((question) => question.buckets.includes(bucket));\n    if (!repository || questions.length === 0) return [];\n    const batches = await Promise.all(\n      questions.map(async (question) => {\n        const found = await repository.search(queryForQuestion(query, question), area);\n        return found.map((source) => annotateQuestion(source, question));\n      }),\n    );\n    return mergeQuestionAnnotations(batches.flat());\n  };\n\n'''
          addition = marker + '''  const searchOfficialPerIssue = async (): Promise<{\n    sources: OfficialSourceResult[];\n    diagnostics: OfficialSourceDiagnostics;\n  }> => {\n    const questions = researchPlan.questions.filter((question) => question.buckets.includes("laws"));\n    const results = await Promise.all(\n      questions.map(async (question) => ({\n        question,\n        result: await searchOfficialLegalSources(queryForQuestion(query, question)),\n      })),\n    );\n\n    const annotated: OfficialSourceResult[] = [];\n    const failures: string[] = [];\n    let enabled = false;\n    let pravoExactAttempted = 0;\n    let pravoContextAttempted = 0;\n    let pravoAmbiguous = 0;\n    let registeredProviders = 0;\n\n    for (const { question, result } of results) {\n      enabled ||= result.diagnostics.enabled;\n      pravoExactAttempted += result.diagnostics.pravo_exact_attempted;\n      pravoContextAttempted += result.diagnostics.pravo_context_attempted;\n      pravoAmbiguous += result.diagnostics.pravo_ambiguous;\n      registeredProviders = Math.max(registeredProviders, result.diagnostics.registered_providers);\n      failures.push(...result.diagnostics.failures.map((failure) => `${question.id}:${failure}`));\n      for (const source of result.sources) {\n        annotated.push({\n          ...source,\n          metadata: {\n            ...(source.metadata ?? {}),\n            research_issue_ids: [question.id],\n            research_issue_texts: [question.issue],\n            research_modes: question.modes,\n          },\n        });\n      }\n    }\n\n    const merged = mergeQuestionAnnotations(annotated as RawSource[]) as OfficialSourceResult[];\n    const identityVerified = merged.filter(\n      (source) => ((source.metadata?.safety as OfficialSourceSafety | undefined)?.document_identity_verified ?? false),\n    ).length;\n    const substantiveUsable = merged.filter(\n      (source) => ((source.metadata?.safety as OfficialSourceSafety | undefined)?.substantive_use_allowed ?? false),\n    ).length;\n\n    return {\n      sources: merged,\n      diagnostics: {\n        enabled,\n        pravo_exact_attempted: pravoExactAttempted,\n        pravo_context_attempted: pravoContextAttempted,\n        pravo_found: merged.length,\n        pravo_identity_verified: identityVerified,\n        pravo_ambiguous: pravoAmbiguous,\n        substantive_usable: substantiveUsable,\n        registered_providers: registeredProviders,\n        failures,\n      },\n    };\n  };\n\n'''
          if 'const searchOfficialPerIssue = async' not in s:
              if marker not in s: raise SystemExit('searchPerIssue marker not found')
              s = s.replace(marker, addition, 1)

          old = '''  const officialQuery = queryForBucket(query, researchPlan, "laws");\n  const [laws, court, fns, minfin, ek, manuals, official] = await Promise.all([\n    searchPerIssue("laws"),\n    searchPerIssue("court_practice"),\n    searchPerIssue("fns_letters"),\n    searchPerIssue("minfin_letters"),\n    searchPerIssue("ekaterina"),\n    searchPerIssue("manuals"),\n    searchOfficialLegalSources(officialQuery),\n  ]);'''
          new = '''  const [laws, court, fns, minfin, ek, manuals, official] = await Promise.all([\n    searchPerIssue("laws"),\n    searchPerIssue("court_practice"),\n    searchPerIssue("fns_letters"),\n    searchPerIssue("minfin_letters"),\n    searchPerIssue("ekaterina"),\n    searchPerIssue("manuals"),\n    searchOfficialPerIssue(),\n  ]);'''
          if new not in s:
              if old not in s: raise SystemExit('official aggregate search block not found')
              s = s.replace(old, new, 1)

          # queryForBucket is no longer used by Repository Layer.
          s = s.replace('import { buildResearchPlan, queryForBucket, queryForQuestion, type ResearchPlan, type ResearchQuestion } from "./research-routing.ts";', 'import { buildResearchPlan, queryForQuestion, type ResearchPlan, type ResearchQuestion } from "./research-routing.ts";', 1)

          p.write_text(s)
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Research contract tests
        run: bun test supabase/functions/analyze-document-legal-position/temporal-applicability.test.ts supabase/functions/analyze-document-legal-position/research-routing.test.ts supabase/functions/analyze-document-legal-position/research-coverage.test.ts supabase/functions/analyze-document-legal-position/dedupe-canonical.test.ts supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts
      - name: Assert no Lovable research transport
        run: |
          if grep -n "ai.gateway.lovable.dev\|LOVABLE_API_KEY" supabase/functions/analyze-document-legal-position/fact-extraction.ts; then exit 1; fi
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Commit source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-document-legal-position/repositories.ts
          git commit -m "feat(research): make official retrieval issue-scoped"
          git push origin HEAD:feat/official-legal-sources-layer
