name: TEMP Pravo relay VPS gate

on:
  push:
    branches:
      - feat/pravo-relay-vps-transport
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Relay policy tests
        run: bun test infra/pravo-relay/handler.test.ts
      - name: Typecheck
        run: bun run typecheck
