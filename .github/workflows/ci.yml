name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Targeted Pravo/Law7 tests
        run: |
          bun test supabase/functions/analyze-document-legal-position/official-verification-resolver.test.ts
          bun test supabase/functions/analyze-document-legal-position/pravo-article-text.test.ts

      - name: Full test suite
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build
