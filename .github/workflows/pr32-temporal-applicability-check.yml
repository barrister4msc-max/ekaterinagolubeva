name: PR32 Temporal Applicability Check

on:
  push:
    branches:
      - feat/official-legal-sources-layer

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Targeted temporal tests
        run: |
          bun test supabase/functions/analyze-document-legal-position/temporal-date.test.ts
          bun test supabase/functions/analyze-document-legal-position/temporal-applicability.test.ts
      - name: Analyzer tests
        run: bun test supabase/functions/analyze-document-legal-position/*.test.ts
      - name: Diff check
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
