name: PR32 Official Sources Check

on:
  push:
    branches:
      - feat/official-legal-sources-layer

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Official sources contract tests
        run: bun test supabase/functions/analyze-document-legal-position/official-sources.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
