# Temporary verification workflow; remove after GREEN.
name: PR32 Temporal Final Check

on:
  push:
    branches:
      - feat/official-legal-sources-layer
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Temporal gap retry tests
        run: bun test supabase/functions/analyze-document-legal-position/temporal-gap-retry.test.ts
      - name: Temporal applicability tests
        run: bun test supabase/functions/analyze-document-legal-position/temporal-applicability.test.ts supabase/functions/analyze-document-legal-position/temporal-date.test.ts
      - name: Research routing and coverage tests
        run: bun test supabase/functions/analyze-document-legal-position/research-routing.test.ts supabase/functions/analyze-document-legal-position/research-coverage.test.ts
      - name: Provider and source safety tests
        run: bun test supabase/functions/analyze-document-legal-position/research-provider-contract.test.ts supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/law7-provider.test.ts
      - name: Canonical metadata and dedupe tests
        run: bun test supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts supabase/functions/analyze-document-legal-position/dedupe-canonical.test.ts
      - name: Complete Analyzer tests
        run: bun test supabase/functions/analyze-document-legal-position/*.test.ts
      - name: Diff check against main
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
