name: PR32 no Lovable analyzer transport

on:
  push:
    branches:
      - feat/official-legal-sources-layer

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.head_commit.message == 'chore(pr32): apply no-Lovable analyzer transport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-legal-sources-layer
          fetch-depth: 0

      - name: Remove Lovable AI gateway from Analyzer research path
        shell: python
        run: |
          from pathlib import Path
          p = Path('supabase/functions/analyze-document-legal-position/fact-extraction.ts')
          s = p.read_text()
          s = s.replace('const LOVABLE_API_KEY = Deno.env.get("LOVABLE_API_KEY") ?? "";\n', '')
          s = s.replace('const LOVABLE_FLASH_MODEL = "google/gemini-2.5-flash";\n', '')
          start = s.index('async function callFlashViaLovable(')
          end = s.index('import { callGeminiWithFallback', start)
          s = s[:start] + s[end:]
          s = s.replace('  let raw = await callFlashViaLovable(prompt);\n  if (!raw) raw = await callFlashViaGemini(prompt);', '  const raw = await callFlashViaGemini(prompt);')
          s = s.replace('[fact-extraction] no LLM response (LOVABLE_API_KEY/GEMINI_API_KEY missing or error)', '[fact-extraction] no LLM response (GEMINI_API_KEY missing or error)')
          old = '''export async function embedQuery(text: string): Promise<number[] | null> {\n  if (!LOVABLE_API_KEY || !text.trim()) return null;\n  try {\n    const res = await fetch("https://ai.gateway.lovable.dev/v1/embeddings", {\n      method: "POST",\n      headers: {\n        "Content-Type": "application/json",\n        "Authorization": `Bearer ${LOVABLE_API_KEY}`,\n      },\n      body: JSON.stringify({\n        model: "google/gemini-embedding-001",\n        input: text.slice(0, 8000),\n      }),\n    });\n    if (!res.ok) return null;\n    const data = await res.json();\n    const emb = data?.data?.[0]?.embedding;\n    return Array.isArray(emb) ? emb : null;\n  } catch {\n    return null;\n  }\n}\n'''
          new = '''export async function embedQuery(text: string): Promise<number[] | null> {\n  if (!GEMINI_API_KEY || !text.trim()) return null;\n  try {\n    const res = await fetch(\n      "https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent",\n      {\n        method: "POST",\n        headers: {\n          "Content-Type": "application/json",\n          "x-goog-api-key": GEMINI_API_KEY,\n        },\n        body: JSON.stringify({\n          model: "models/gemini-embedding-001",\n          content: { parts: [{ text: text.slice(0, 8000) }] },\n          taskType: "RETRIEVAL_QUERY",\n          outputDimensionality: 1536,\n        }),\n      },\n    );\n    if (!res.ok) {\n      console.error("[fact-extraction] gemini embedding error", res.status);\n      return null;\n    }\n    const data = await res.json();\n    const emb = data?.embedding?.values;\n    return Array.isArray(emb) ? emb : null;\n  } catch (e) {\n    console.error("[fact-extraction] gemini embedding exception", e);\n    return null;\n  }\n}\n'''
          if old not in s:
              raise SystemExit('expected embedQuery block not found')
          s = s.replace(old, new)
          p.write_text(s)

      - name: Verify no Lovable credits path remains
        run: |
          ! grep -n "ai.gateway.lovable.dev\|LOVABLE_API_KEY\|LOVABLE_FLASH_MODEL\|callFlashViaLovable" supabase/functions/analyze-document-legal-position/fact-extraction.ts
          grep -n "generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent" supabase/functions/analyze-document-legal-position/fact-extraction.ts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Source contract tests
        run: bun test supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts supabase/functions/analyze-document-legal-position/dedupe.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Remove temporary workflow
        run: rm -f .github/workflows/pr32-no-lovable-analyzer.yml

      - name: Commit transport change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pr32): use direct Gemini for analyzer research"
          git push origin HEAD:feat/official-legal-sources-layer
