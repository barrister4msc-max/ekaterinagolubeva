name: PR32 no Lovable analyzer transport

on:
  push:
    branches:
      - feat/official-legal-sources-layer

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.head_commit.message == 'chore(pr32): apply no-Lovable analyzer transport v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-legal-sources-layer
          fetch-depth: 0

      - name: Patch Analyzer transport
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/analyze-document-legal-position/fact-extraction.ts')
          s = p.read_text()
          s = s.replace('const LOVABLE_API_KEY = Deno.env.get("LOVABLE_API_KEY") ?? "";\n', '')
          s = s.replace('const LOVABLE_FLASH_MODEL = "google/gemini-2.5-flash";\n', '')
          start = s.index('async function callFlashViaLovable(')
          end = s.index('import { callGeminiWithFallback', start)
          s = s[:start] + s[end:]
          s = s.replace('  let raw = await callFlashViaLovable(prompt);\n  if (!raw) raw = await callFlashViaGemini(prompt);', '  const raw = await callFlashViaGemini(prompt);')
          s = s.replace('[fact-extraction] no LLM response (LOVABLE_API_KEY/GEMINI_API_KEY missing or error)', '[fact-extraction] no LLM response (GEMINI_API_KEY missing or error)')
          start = s.index('export async function embedQuery(text: string): Promise<number[] | null> {')
          replacement = '''export async function embedQuery(text: string): Promise<number[] | null> {
            if (!GEMINI_API_KEY || !text.trim()) return null;
            try {
              const res = await fetch(
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent",
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "x-goog-api-key": GEMINI_API_KEY,
                  },
                  body: JSON.stringify({
                    model: "models/gemini-embedding-001",
                    content: { parts: [{ text: text.slice(0, 8000) }] },
                    taskType: "RETRIEVAL_QUERY",
                    outputDimensionality: 1536,
                  }),
                },
              );
              if (!res.ok) {
                console.error("[fact-extraction] gemini embedding error", res.status);
                return null;
              }
              const data = await res.json();
              const emb = data?.embedding?.values;
              return Array.isArray(emb) ? emb : null;
            } catch (e) {
              console.error("[fact-extraction] gemini embedding exception", e);
              return null;
            }
          }
          '''
          s = s[:start] + replacement
          p.write_text(s)
          PY

      - name: Verify Lovable gateway is absent
        run: |
          if grep -nE 'ai\.gateway\.lovable\.dev|LOVABLE_API_KEY|LOVABLE_FLASH_MODEL|callFlashViaLovable' supabase/functions/analyze-document-legal-position/fact-extraction.ts; then
            echo 'Lovable AI gateway still present in Analyzer research path' >&2
            exit 1
          fi
          grep -n 'generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent' supabase/functions/analyze-document-legal-position/fact-extraction.ts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Source contract tests
        run: bun test supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts supabase/functions/analyze-document-legal-position/dedupe.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Commit change and remove temporary workflow
        run: |
          rm -f .github/workflows/pr32-no-lovable-analyzer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pr32): use direct Gemini for analyzer research"
          git push origin HEAD:feat/official-legal-sources-layer
