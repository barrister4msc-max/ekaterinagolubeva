name: TEMP P0-A10 DEBTAM runtime evidence

on:
  push:
    branches:
      - feat/p0a10-debtam-runtime-evidence
  pull_request:
    branches:
      - feat/p0a9-debtam-storage-parser-rpc
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire DEBTAM factual channel into Analyzer audit persistence
        env:
          BRANCH: feat/p0a10-debtam-runtime-evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/analyze-document-legal-position/index.ts')
          s=p.read_text()
          pair='''            company_factual_evidence: companyFactualRuntime.company_factual_evidence,\n            company_factual_diagnostics: companyFactualRuntime.diagnostics,'''
          pair_new='''            company_factual_evidence: companyFactualRuntime.company_factual_evidence,\n            company_factual_diagnostics: companyFactualRuntime.diagnostics,\n            company_tax_debt_evidence: companyFactualRuntime.company_tax_debt_evidence,\n            company_factual_dataset_diagnostics: companyFactualRuntime.dataset_diagnostics,'''
          if 'company_tax_debt_evidence: companyFactualRuntime.company_tax_debt_evidence' not in s:
              s=s.replace(pair,pair_new,2)
          pair2='''          company_factual_evidence: companyFactualRuntime.company_factual_evidence,\n          company_factual_diagnostics: companyFactualRuntime.diagnostics,'''
          pair2_new='''          company_factual_evidence: companyFactualRuntime.company_factual_evidence,\n          company_factual_diagnostics: companyFactualRuntime.diagnostics,\n          company_tax_debt_evidence: companyFactualRuntime.company_tax_debt_evidence,\n          company_factual_dataset_diagnostics: companyFactualRuntime.dataset_diagnostics,'''
          s=s.replace(pair2,pair2_new)
          final='''    parsed.company_factual_evidence = companyFactualRuntime.company_factual_evidence;\n    parsed.company_factual_diagnostics = companyFactualRuntime.diagnostics;'''
          final_new='''    parsed.company_factual_evidence = companyFactualRuntime.company_factual_evidence;\n    parsed.company_factual_diagnostics = companyFactualRuntime.diagnostics;\n    // P0-A10: DEBTAM remains a separate point-in-time factual channel.\n    // It is not passed into the SNR canonical factual matrix or legal/model paths.\n    parsed.company_tax_debt_evidence = companyFactualRuntime.company_tax_debt_evidence;\n    parsed.company_factual_dataset_diagnostics = companyFactualRuntime.dataset_diagnostics;'''
          if 'parsed.company_tax_debt_evidence = companyFactualRuntime.company_tax_debt_evidence;' not in s:
              if final not in s: raise SystemExit('final factual persistence anchor not found')
              s=s.replace(final,final_new,1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- supabase/functions/analyze-document-legal-position/index.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/functions/analyze-document-legal-position/index.ts
            git commit -m "feat: persist separate DEBTAM factual runtime channel"
            git push origin HEAD:"$BRANCH"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install
        id: install
        continue-on-error: true
        run: bun install --frozen-lockfile

      - name: DEBTAM adapter/runtime tests
        id: runtime_tests
        continue-on-error: true
        run: |
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-tax-debt-evidence.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-factual-runtime.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/fns-debtam-runtime-orchestration.test.ts

      - name: Exact-text RPC contract
        id: rpc_contract
        continue-on-error: true
        run: bun test ./supabase/tests/fns-open-data-debtam-runtime-contract.test.ts

      - name: Disposable PostgreSQL exact-text runtime assertion
        id: postgres
        continue-on-error: true
        run: |
          docker run --name kati-p0a10-pg -e POSTGRES_PASSWORD=postgres -p 55433:5432 -d postgres:15
          for i in $(seq 1 30); do
            if PGPASSWORD=postgres psql -h 127.0.0.1 -p 55433 -U postgres -d postgres -c 'select 1' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          export PGPASSWORD=postgres
          PSQL='psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55433 -U postgres -d postgres'
          $PSQL -c "create role anon; create role authenticated; create role service_role;"
          $PSQL -f supabase/migrations/20260820173000_fns_open_data_snr_company_facts.sql
          $PSQL -f supabase/migrations/20260820214000_fns_open_data_debtam_company_facts.sql
          $PSQL -f supabase/migrations/20260821001000_fns_open_data_debtam_text_rpc.sql
          $PSQL <<'SQL'
          insert into fns_open_data.company_tax_debts
            (inn, organization_name, tax_name, tax_debt_amount, penalty_amount, fine_amount, total_debt_amount,
             document_id, document_date, data_as_of, debt_row_ordinal, dataset_id, source_url, source_sha256)
          values
            ('7701234567','ООО Тест','Налог A',100.10,2.50,0.00,102.60,'doc-1','2026-07-25','2026-07-01',1,
             '7707329152-debtam','https://file.nalog.ru/opendata/7707329152-debtam/data-20260725-structure-20181201.zip',repeat('a',64)),
            ('7701234567','ООО Тест','Налог B',0.00,10.00,5.00,15.00,'doc-1','2026-07-25','2026-07-01',2,
             '7707329152-debtam','https://file.nalog.ru/opendata/7707329152-debtam/data-20260725-structure-20181201.zip',repeat('a',64));
          do $$
          begin
            if (select count(*) from public.fns_open_data_get_tax_debts_text('7701234567', null)) <> 2 then raise exception 'row_count'; end if;
            if (select tax_debt_amount from public.fns_open_data_get_tax_debts_text('7701234567', null) order by debt_row_ordinal limit 1) <> '100.10' then raise exception 'exact_text_amount'; end if;
            if has_function_privilege('anon','public.fns_open_data_get_tax_debts_text(text,date)','EXECUTE') then raise exception 'anon_access'; end if;
            if has_function_privilege('authenticated','public.fns_open_data_get_tax_debts_text(text,date)','EXECUTE') then raise exception 'authenticated_access'; end if;
            if not has_function_privilege('service_role','public.fns_open_data_get_tax_debts_text(text,date)','EXECUTE') then raise exception 'service_role_missing'; end if;
          end $$;
          SQL

      - name: Existing factual regressions
        id: regressions
        continue-on-error: true
        run: |
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-factual-evidence.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-factual-identity.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-factual-evidence-matrix.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-factual-evidence-matrix-orchestration.test.ts
          bun test ./supabase/tests/fns-open-data-debtam-storage-contract.test.ts

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Diff check
        id: diffcheck
        continue-on-error: true
        run: git diff --check origin/feat/p0a9-debtam-storage-parser-rpc...HEAD

      - name: Record outcomes
        if: always()
        env:
          BRANCH: feat/p0a10-debtam-runtime-evidence
          INSTALL: ${{ steps.install.outcome }}
          RUNTIME_TESTS: ${{ steps.runtime_tests.outcome }}
          RPC_CONTRACT: ${{ steps.rpc_contract.outcome }}
          POSTGRES: ${{ steps.postgres.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
        run: |
          cat > .tmp-p0a10-verification-status.txt <<EOF
          install=$INSTALL
          runtime_tests=$RUNTIME_TESTS
          rpc_contract=$RPC_CONTRACT
          postgres=$POSTGRES
          regressions=$REGRESSIONS
          typecheck=$TYPECHECK
          diffcheck=$DIFFCHECK
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-p0a10-verification-status.txt
          git commit -m "chore: record P0-A10 verification outcomes"
          git push origin HEAD:"$BRANCH"

      - name: Enforce GREEN
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          RUNTIME_TESTS: ${{ steps.runtime_tests.outcome }}
          RPC_CONTRACT: ${{ steps.rpc_contract.outcome }}
          POSTGRES: ${{ steps.postgres.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
        run: |
          test "$INSTALL" = success
          test "$RUNTIME_TESTS" = success
          test "$RPC_CONTRACT" = success
          test "$POSTGRES" = success
          test "$REGRESSIONS" = success
          test "$TYPECHECK" = success
          test "$DIFFCHECK" = success
