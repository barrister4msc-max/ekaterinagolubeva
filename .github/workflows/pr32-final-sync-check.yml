name: PR32 Final Sync Check

on:
  push:
    branches:
      - feat/official-legal-sources-layer

permissions:
  contents: write

jobs:
  sync-check-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-legal-sources-layer
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Analyzer tests
        run: bun test supabase/functions/analyze-document-legal-position/*.test.ts
      - name: Assert no Lovable research transport
        run: |
          if grep -R -n "ai.gateway.lovable.dev\|LOVABLE_API_KEY" supabase/functions/analyze-document-legal-position/fact-extraction.ts; then
            echo "Lovable research transport detected"
            exit 1
          fi
      - name: Assert PR32 temporary artifacts removed
        run: |
          test ! -e supabase/functions/pr32-official-sources-probe/index.ts
          ! grep -q "OFFICIAL_LEGAL_SOURCES_ENABLED = \"true\"" supabase/config.toml
          ! grep -q "functions.pr32-official-sources-probe" supabase/config.toml
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Push synced branch
        run: git push origin HEAD:feat/official-legal-sources-layer
