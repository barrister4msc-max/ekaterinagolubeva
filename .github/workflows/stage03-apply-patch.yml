name: Stage 03 Apply Patch

on:
  push:
    branches:
      - fix/stage03-evidence-contradiction-unresolved

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/stage03-evidence-contradiction-unresolved
          fetch-depth: 0

      - name: Apply minimal mixed-relation patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("supabase/functions/analyze-document-legal-position/enrich.ts")
          source = path.read_text(encoding="utf-8")

          storage = "\n".join([
              "  // Canonical producer output: fact_id → (doc_id → set of relations).",
              "  // Preserve conflicting relations; conflict resolution requires an explicit",
              "  // reasoned decision and must not happen through aggregation precedence.",
              "  const canonicalByFact = new Map<string, Map<string, Set<EvidenceRelation>>>();",
              "  const addCanonical = (factId: string | null, docId: unknown, relation: EvidenceRelation) => {",
              "    if (!factId) return;",
              "    const id = typeof docId === \"string\" ? docId.trim() : \"\";",
              "    if (!id || !allowedDocIds.has(id)) return;",
              "    let m = canonicalByFact.get(factId);",
              "    if (!m) {",
              "      m = new Map();",
              "      canonicalByFact.set(factId, m);",
              "    }",
              "    let relationsForDoc = m.get(id);",
              "    if (!relationsForDoc) {",
              "      relationsForDoc = new Set<EvidenceRelation>();",
              "      m.set(id, relationsForDoc);",
              "    }",
              "    relationsForDoc.add(relation);",
              "  };",
          ])
          pattern = r"  // Canonical producer output: fact_id → \(doc_id → strongest relation\)\.[\s\S]*?  };\n\n  const rawCanonical:"
          source, n = re.subn(pattern, storage + "\n\n  const rawCanonical:", source, count=1)
          if n != 1:
              raise SystemExit(f"canonical storage patch count={n}")

          old_projection = "      relations = Array.from(canonicalMap.entries()).map(([document_id, relation]) => ({\n        document_id,\n        relation,\n      }));"
          new_projection = "      relations = Array.from(canonicalMap.entries()).flatMap(([document_id, relationSet]) =>\n        Array.from(relationSet).map((relation) => ({ document_id, relation })),\n      );"
          if source.count(old_projection) != 1:
              raise SystemExit("relation projection target mismatch")
          source = source.replace(old_projection, new_projection, 1)

          old_docs = "    const docs = relations.map((r) => r.document_id);"
          new_docs = "    const docs = Array.from(new Set(relations.map((r) => r.document_id)));"
          if source.count(old_docs) != 1:
              raise SystemExit("documents_used target mismatch")
          source = source.replace(old_docs, new_docs, 1)

          old_flags = "    const allContradict =\n      relations.length > 0 && relations.every((r) => r.relation === \"CONTRADICTS\");"
          new_flags = "    const hasContradiction = relations.some((r) => r.relation === \"CONTRADICTS\");\n    const allContradict =\n      relations.length > 0 && relations.every((r) => r.relation === \"CONTRADICTS\");\n    const mixedContradiction = hasContradiction && !allContradict;"
          if source.count(old_flags) != 1:
              raise SystemExit("contradiction flags target mismatch")
          source = source.replace(old_flags, new_flags, 1)

          old_branch = "    if (allContradict) {\n      status = \"contradicted\";\n      strength = \"low\";\n    } else if (missingForFact.length > 0 && !nonContradictSupport) {"
          new_branch = "    if (allContradict) {\n      status = \"contradicted\";\n      strength = \"low\";\n    } else if (mixedContradiction) {\n      status = \"partial\";\n      strength = \"low\";\n    } else if (missingForFact.length > 0 && !nonContradictSupport) {"
          if source.count(old_branch) != 1:
              raise SystemExit("mixed contradiction branch target mismatch")
          source = source.replace(old_branch, new_branch, 1)

          old_note = "      contradiction_notes: null,"
          new_note = "      contradiction_notes: mixedContradiction\n        ? \"Обнаружены одновременно подтверждающие и противоречащие связи; требуется мотивированное разрешение конфликта\"\n        : null,"
          if source.count(old_note) != 1:
              raise SystemExit("contradiction note target mismatch")
          source = source.replace(old_note, new_note, 1)

          path.write_text(source, encoding="utf-8")

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Stage 02 and Stage 03 tests
        run: |
          bun test supabase/functions/analyze-document-legal-position/evidence-relation-fail-closed.test.ts
          bun test supabase/functions/analyze-document-legal-position/evidence-contradiction-unresolved.test.ts

      - name: Commit final Stage 03 files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage03-apply-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-document-legal-position/enrich.ts \
                  supabase/functions/analyze-document-legal-position/evidence-contradiction-unresolved.test.ts
          git commit -m "Preserve unresolved evidence contradictions"
          git push origin HEAD:fix/stage03-evidence-contradiction-unresolved
