name: Stage 02 Apply Patch

on:
  push:
    branches:
      - fix/stage02-evidence-relation-fail-closed

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/stage02-evidence-relation-fail-closed
          fetch-depth: 0

      - name: Apply minimal fail-closed relation patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("supabase/functions/analyze-document-legal-position/enrich.ts")
          source = path.read_text(encoding="utf-8")

          old = '''    for (const d of docsField) {
              if (d && typeof d === "object") {
                const rel = normalizeRelation(d.relation) ?? "SUPPORTS";
                addCanonical(factId, d.doc_id ?? d.document_id ?? d.id, rel);
              } else if (typeof d === "string") {
                addCanonical(factId, d, "SUPPORTS");
              }
            }
          '''

          new = '''    for (const d of docsField) {
              if (d && typeof d === "object") {
                // Preferred canonical shape is fail-closed: a doc_id without a
                // recognized relation is malformed and must not become SUPPORTS.
                if (Object.prototype.hasOwnProperty.call(d, "doc_id")) {
                  const rel = normalizeRelation(d.relation);
                  if (rel) addCanonical(factId, d.doc_id, rel);
                  continue;
                }

                // Explicitly recognized legacy object shapes carried no relation.
                // Keep their historical SUPPORTS semantics isolated here only.
                addCanonical(factId, d.document_id ?? d.id, "SUPPORTS");
              } else if (typeof d === "string") {
                // Explicit legacy string item: preserve back-compat only.
                addCanonical(factId, d, "SUPPORTS");
              }
            }
          '''

          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one target block, found {source.count(old)}")

          source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Stage 02 regression test
        run: bun test supabase/functions/analyze-document-legal-position/evidence-relation-fail-closed.test.ts

      - name: Commit only final Stage 02 files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage02-apply-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-document-legal-position/enrich.ts \
                  supabase/functions/analyze-document-legal-position/evidence-relation-fail-closed.test.ts
          git commit -m "Enforce fail-closed evidence relation semantics"
          git push origin HEAD:fix/stage02-evidence-relation-fail-closed
