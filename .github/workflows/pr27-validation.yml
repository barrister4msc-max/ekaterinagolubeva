name: PR27 validation

on:
  push:
    branches:
      - feat/pr27-verified-company-profile
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: PR27 tests
        run: bun test supabase/tests/pr27-company-registry.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Deno check company-registry-lookup
        run: deno check supabase/functions/company-registry-lookup/index.ts
