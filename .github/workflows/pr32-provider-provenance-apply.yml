name: PR32 Provider Provenance Apply

on:
  push:
    branches:
      - feat/official-legal-sources-layer

permissions:
  contents: write

jobs:
  apply-check-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-legal-sources-layer
          fetch-depth: 0
      - name: Carry provider provenance through TrustedSource bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/analyze-document-legal-position/source-metadata-bridge.ts')
          s = p.read_text()
          marker = '  "provider_id",\n  "provider",\n'
          repl = '  "provider_id",\n  "provider_type",\n  "provider_integration_mode",\n  "provider_source_class",\n  "provider",\n'
          if repl not in s:
              if marker not in s: raise SystemExit('provider metadata marker not found')
              s = s.replace(marker, repl, 1)
          p.write_text(s)

          p = Path('supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts')
          s = p.read_text()
          marker = '''  test("does not query legal_source_registry again after projection was attempted", async () => {'''
          test_block = '''  test("carries research provider provenance without treating it as legal authority", () => {\n    const providerSource: RawSource = {\n      ...source,\n      metadata: {\n        ...source.metadata,\n        provider_id: "law7",\n        provider_type: "research",\n        provider_integration_mode: "mcp",\n        provider_source_class: "retrieval_intermediary",\n        authority_level: "primary",\n        official_origin_verified: false,\n      },\n    };\n    const trusted: Array<Record<string, any>> = [{\n      source_id: "chunk-1",\n      source_ref: "law:нк рф:54.1",\n      trust_score: 95,\n    }];\n\n    carryCanonicalMetadataToTrusted(trusted, [providerSource]);\n\n    expect(trusted[0].provider_id).toBe("law7");\n    expect(trusted[0].provider_type).toBe("research");\n    expect(trusted[0].provider_integration_mode).toBe("mcp");\n    expect(trusted[0].provider_source_class).toBe("retrieval_intermediary");\n    expect(trusted[0].authority_level).toBe("primary");\n    // Provider provenance does not self-certify official origin.\n    expect(trusted[0].official_origin_verified).toBeUndefined();\n  });\n\n'''
          if 'carries research provider provenance without treating it as legal authority' not in s:
              if marker not in s: raise SystemExit('test insertion marker not found')
              s = s.replace(marker, test_block + marker, 1)
          p.write_text(s)
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Research contract tests
        run: bun test supabase/functions/analyze-document-legal-position/research-provider-contract.test.ts supabase/functions/analyze-document-legal-position/temporal-applicability.test.ts supabase/functions/analyze-document-legal-position/research-routing.test.ts supabase/functions/analyze-document-legal-position/research-coverage.test.ts supabase/functions/analyze-document-legal-position/dedupe-canonical.test.ts supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts
      - name: Assert no Lovable research transport
        run: |
          if grep -n "ai.gateway.lovable.dev\|LOVABLE_API_KEY" supabase/functions/analyze-document-legal-position/fact-extraction.ts; then exit 1; fi
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Commit source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-document-legal-position/source-metadata-bridge.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts
          git commit -m "feat(research): preserve provider provenance through source bridge"
          git push origin HEAD:feat/official-legal-sources-layer
