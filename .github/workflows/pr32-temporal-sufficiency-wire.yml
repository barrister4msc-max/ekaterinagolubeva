name: PR32 Temporal Sufficiency Wire

on:
  push:
    branches:
      - feat/official-legal-sources-layer

permissions:
  contents: write

jobs:
  apply-check-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-legal-sources-layer
          fetch-depth: 0
      - name: Wire temporal applicability into existing Sufficiency
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/analyze-document-legal-position/index.ts')
          s = p.read_text()

          marker = 'import { evaluateOfficialExplanationsCoverage } from "./research-coverage.ts";\n'
          addition = marker + 'import { evaluateTemporalApplicability } from "./temporal-applicability.ts";\n'
          if 'import { evaluateTemporalApplicability }' not in s:
              if marker not in s: raise SystemExit('coverage import marker not found')
              s = s.replace(marker, addition, 1)

          old = '''    let officialExplanationsCoverage = evaluateOfficialExplanationsCoverage({ plan: researchPlan, trusted });\n    let sufficiency = evaluateSufficiency({\n      trusted,\n      conclusions: validatedConclusions,\n      researchCoverageGaps: officialExplanationsCoverage.gaps,\n    });'''
          new = '''    let officialExplanationsCoverage = evaluateOfficialExplanationsCoverage({ plan: researchPlan, trusted });\n    let temporalApplicability = evaluateTemporalApplicability({ plan: researchPlan, trusted });\n    let sufficiency = evaluateSufficiency({\n      trusted,\n      conclusions: validatedConclusions,\n      researchCoverageGaps: [\n        ...officialExplanationsCoverage.gaps,\n        ...temporalApplicability.gaps,\n      ],\n    });'''
          if new not in s:
              if old not in s: raise SystemExit('initial sufficiency block not found')
              s = s.replace(old, new, 1)

          old = '''        officialExplanationsCoverage = evaluateOfficialExplanationsCoverage({ plan: researchPlan, trusted });\n        sufficiency = evaluateSufficiency({\n          trusted,\n          conclusions: validatedConclusions,\n          researchCoverageGaps: officialExplanationsCoverage.gaps,\n        });'''
          new = '''        officialExplanationsCoverage = evaluateOfficialExplanationsCoverage({ plan: researchPlan, trusted });\n        temporalApplicability = evaluateTemporalApplicability({ plan: researchPlan, trusted });\n        sufficiency = evaluateSufficiency({\n          trusted,\n          conclusions: validatedConclusions,\n          researchCoverageGaps: [\n            ...officialExplanationsCoverage.gaps,\n            ...temporalApplicability.gaps,\n          ],\n        });'''
          if new not in s:
              if old not in s: raise SystemExit('retry sufficiency block not found')
              s = s.replace(old, new, 1)

          old = '    parsed.research_coverage = { official_explanations: officialExplanationsCoverage };\n'
          new = '''    parsed.research_coverage = {\n      official_explanations: officialExplanationsCoverage,\n      temporal: temporalApplicability,\n    };\n'''
          if new not in s:
              if old not in s: raise SystemExit('research coverage output marker not found')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Research contract tests
        run: bun test supabase/functions/analyze-document-legal-position/temporal-applicability.test.ts supabase/functions/analyze-document-legal-position/research-routing.test.ts supabase/functions/analyze-document-legal-position/research-coverage.test.ts supabase/functions/analyze-document-legal-position/dedupe-canonical.test.ts supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts
      - name: Assert no Lovable research transport
        run: |
          if grep -n "ai.gateway.lovable.dev\|LOVABLE_API_KEY" supabase/functions/analyze-document-legal-position/fact-extraction.ts; then exit 1; fi
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Commit source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-document-legal-position/index.ts
          git commit -m "feat(research): feed temporal applicability into source sufficiency"
          git push origin HEAD:feat/official-legal-sources-layer
