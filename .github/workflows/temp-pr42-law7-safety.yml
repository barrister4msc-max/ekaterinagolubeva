name: TEMP PR42 Law7 Safety

on:
  push:
    branches:
      - feat/legal-source-pack-7
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  law7-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migration authority/provider-class contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260819223000_register_interim_legal_research_sources.sql')
          s = p.read_text(encoding='utf-8')
          law7 = s.split("'law7'", 1)[1].split("'data_nalog'", 1)[0]
          assert "'secondary'" in law7, 'Law7 authority_level must remain legal authority semantics'
          assert "'provider_source_class', 'retrieval_intermediary'" in law7, 'Law7 provider class missing'
          assert "'substantive_use_allowed', false" in law7, 'Law7 substantive gate missing'
          assert "'official_origin_verified', false" in law7, 'Law7 official-origin safety flag missing'
          print('migration-contract: PASS')
          PY

      - name: Provider Safety Contract tests
        run: |
          bun test \
            supabase/functions/analyze-document-legal-position/provider-safety-contract.test.ts \
            supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts \
            supabase/functions/analyze-document-legal-position/law7-supabase-transport.test.ts

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Publish verifier status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ]; then state=success; description='PR42 Law7 safety gate passed'; else state=failure; description='PR42 Law7 safety gate failed'; fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"pr42-law7-safety\",\"description\":\"${description}\"}"
