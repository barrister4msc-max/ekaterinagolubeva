name: TEMP P0-A3 FNS SNR storage audit

on:
  pull_request:
  push:
    branches:
      - feat/p0a3-fns-snr-factual-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kati_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Targeted FNS tests
        run: |
          bun test supabase/functions/analyze-document-legal-position/fns-company-factual-evidence.test.ts
          bun test supabase/tests/fns-open-data-catalog.test.ts
          bun test supabase/tests/fns-open-data-snr-storage-contract.test.ts

      - name: Execute migration on disposable PostgreSQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin create role anon nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role nologin; exception when duplicate_object then null; end $$;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260820173000_fns_open_data_snr_company_facts.sql

      - name: Runtime storage and privilege assertions
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into fns_open_data.company_tax_regimes (
            inn, organization_name, regimes, document_id, document_date,
            data_as_of, dataset_id, source_url, source_sha256
          ) values (
            '7701234567', 'ООО Ромашка', array['usn'], 'doc-1', '2026-06-25',
            '2026-06-01', '7707329152-snr',
            'https://file.nalog.ru/opendata/7707329152-snr/test.zip',
            repeat('a', 64)
          );

          insert into fns_open_data.sync_state (
            dataset_id, status, source_url, source_sha256, data_as_of, records_count
          ) values (
            '7707329152-snr', 'completed',
            'https://file.nalog.ru/opendata/7707329152-snr/test.zip',
            repeat('a', 64), '2026-06-01', 1
          );

          do $$
          begin
            begin
              insert into fns_open_data.company_tax_regimes (
                inn, organization_name, regimes, data_as_of, dataset_id, source_url, source_sha256
              ) values (
                '7701234568', 'ООО Подмена', array['usn'], '2026-06-01', '7707329152-snr',
                'https://example.com/fake.zip', repeat('b', 64)
              );
              raise exception 'untrusted company source_url unexpectedly accepted';
            exception when check_violation then
              null;
            end;

            begin
              insert into fns_open_data.sync_state (
                dataset_id, status, source_url, source_sha256, records_count
              ) values (
                '7707329152-snr', 'running', 'https://example.com/fake.zip', repeat('b', 64), 0
              ) on conflict (dataset_id) do update set source_url = excluded.source_url;
              raise exception 'untrusted sync source_url unexpectedly accepted';
            exception when check_violation then
              null;
            end;
          end $$;

          do $$
          declare
            available boolean;
            row_count int;
          begin
            select public.fns_open_data_snr_is_available() into available;
            if available is distinct from true then
              raise exception 'availability RPC expected true';
            end if;

            select count(*) into row_count
            from public.fns_open_data_get_tax_regime('7701234567', '2026-06-15');
            if row_count <> 1 then
              raise exception 'lookup RPC expected exactly one row, got %', row_count;
            end if;

            select count(*) into row_count
            from public.fns_open_data_get_tax_regime('7701234567', '2026-05-01');
            if row_count <> 0 then
              raise exception 'as-of lookup must fail closed before snapshot date';
            end if;
          end $$;

          do $$
          begin
            if has_schema_privilege('anon', 'fns_open_data', 'USAGE') then
              raise exception 'anon unexpectedly has schema usage';
            end if;
            if has_schema_privilege('authenticated', 'fns_open_data', 'USAGE') then
              raise exception 'authenticated unexpectedly has schema usage';
            end if;
            if has_function_privilege('anon', 'public.fns_open_data_get_tax_regime(text,date)', 'EXECUTE') then
              raise exception 'anon unexpectedly has lookup execute';
            end if;
            if has_function_privilege('authenticated', 'public.fns_open_data_get_tax_regime(text,date)', 'EXECUTE') then
              raise exception 'authenticated unexpectedly has lookup execute';
            end if;
            if not has_function_privilege('service_role', 'public.fns_open_data_get_tax_regime(text,date)', 'EXECUTE') then
              raise exception 'service_role missing lookup execute';
            end if;
          end $$;
          SQL

      - name: Typecheck
        run: bun run typecheck

      - name: Diff check
        run: git diff --check origin/main...HEAD
