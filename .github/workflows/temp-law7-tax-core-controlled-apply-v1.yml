name: temp-law7-tax-core-controlled-apply-v1

on:
  push:
    branches: [audit/law7-tax-core-execution-gate-20260819]
    paths:
      - 'audit/trigger-law7-sql-artifact-upload.txt'

permissions:
  contents: write

env:
  TARGET_REF: uprzchrouemzajvcojag
  PROD_REF: wiylzbdbjokignwvizxt
  SOURCE_COMMIT: 70a1d8fc6b27b67ad7f12f03f017d02b5f68a0c895447159039800965895f8b2
  EXPECTED_EXPORT_SHA256: 6a41ae0bab9095d2c7b2339ec401c877add352d16f69c861757ad42c03b56de9

jobs:
  controlled-apply:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: ${{ secrets.LAW7_POC_MIRROR_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail-closed target guard
        run: |
          python - <<'PY'
          import os
          url = os.environ.get('DATABASE_URL', '').strip()
          target = os.environ['TARGET_REF']
          prod = os.environ['PROD_REF']
          if not url:
              raise SystemExit('BLOCKED: LAW7_POC_MIRROR_DATABASE_URL is empty')
          if target not in url:
              raise SystemExit('BLOCKED: DATABASE_URL does not contain exact Preview ref')
          if prod in url:
              raise SystemExit('BLOCKED: DATABASE_URL contains production ref')
          print('TARGET_GUARD=PASS')
          print('target_ref=' + target)
          PY

      - name: Reconstruct exact verified TAX CORE export
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, pathlib, re
          root = pathlib.Path('.')
          mat = root / 'audit/law7-tax-core-preview-apply'
          manifest = json.loads((mat / 'manifest.json').read_text(encoding='utf-8'))
          expected_export = '6a41ae0bab9095d2c7b2339ec401c877add352d16f69c861757ad42c03b56de9'
          source_commit = '70a1d8fc6b27b67ad7f12f03f017d02b5f68a0c895447159039800965895f8b2'
          assert manifest['status'] == 'READY'
          assert manifest['dataset_key'] == 'law7_codes'
          assert manifest['source_commit'] == source_commit
          assert manifest['export_sha256'] == expected_export
          assert manifest['codes'] == 8
          assert manifest['article_versions'] == 2866
          assert manifest['amendments'] == 0
          assert manifest['unavailable_codes'] == ['KAS_RF']
          files = manifest['version_batch_files']
          assert len(files) == 29
          codes_sql = (mat / manifest['first']).read_text(encoding='utf-8')
          m = re.search(r'\$law7codes\$(\[.*?\])\$law7codes\$', codes_sql, re.S)
          if not m: raise SystemExit('codes payload not found')
          code_rows = json.loads(m.group(1))
          version_rows = []
          for name in files:
              text = (mat / name).read_text(encoding='utf-8')
              m = re.search(r'\$law7v\d+\$(\[.*\])\$law7v\d+\$', text, re.S)
              if not m: raise SystemExit(f'version payload not found: {name}')
              version_rows.extend(json.loads(m.group(1)))
          if len(code_rows) != 8 or len(version_rows) != 2866:
              raise SystemExit('materialized row count mismatch')
          spec = importlib.util.spec_from_file_location('law7_export', root / 'scripts/law7_controlled_export.py')
          mod = importlib.util.module_from_spec(spec); assert spec and spec.loader; spec.loader.exec_module(mod)
          requested = [*mod.TAX_CORE_CODES, *mod.CONDITIONAL_TAX_CORE_CODES]
          dataset = mod.build_dataset(dataset_key=mod.TAX_CORE_DATASET_KEY,source_commit=source_commit,code_rows=code_rows,version_rows=version_rows,amendment_rows=[],required_codes=requested,unavailable_codes=['KAS_RF'])
          candidates = [json.dumps(dataset, ensure_ascii=False, indent=2),json.dumps(dataset, ensure_ascii=False, indent=2) + '\n']
          chosen = next((p for p in candidates if hashlib.sha256(p.encode('utf-8')).hexdigest() == expected_export), None)
          if chosen is None:
              got = [hashlib.sha256(x.encode('utf-8')).hexdigest() for x in candidates]
              raise SystemExit('exact exporter SHA mismatch: ' + ','.join(got))
          keys=set(); bad_hash=blank=current=repealed=0; per_code={}
          for row in dataset['article_versions']:
              key=(row['code_id'],row['article_number'],row['version_date'])
              if key in keys: raise SystemExit(f'duplicate version key: {key}')
              keys.add(key); text=row['article_text']
              blank += int(not text.strip())
              bad_hash += int(hashlib.sha256(text.encode('utf-8')).hexdigest() != row['text_hash'])
              current += int(row['is_current'] is True); repealed += int(row['is_repealed'] is True)
              per_code[row['code_id']] = per_code.get(row['code_id'],0)+1
          expected_counts={'NK_RF':250,'NK_RF_2':522,'APK_RF':402,'KoAP_RF':224,'BK_RF':110,'GK_RF':554,'GK_RF_2':667,'KONST_RF':137}
          assert per_code == expected_counts
          assert bad_hash == 0 and blank == 0 and current == 2866 and repealed == 0 and len(keys) == 2866 and dataset['amendments'] == []
          pathlib.Path('/tmp/law7_tax_core_apply.json').write_text(chosen,encoding='utf-8')
          print('RECONSTRUCTION=PASS'); print('export_sha256='+expected_export); print('codes=8 article_versions=2866 amendments=0'); print('hash_mismatches=0 blank_text=0 duplicates=0 current=2866 repealed=0')
          PY

      - name: Install apply dependency
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'

      - name: Execute exact current-main importer apply
        run: python scripts/law7_mirror_import.py --input /tmp/law7_tax_core_apply.json --apply | tee /tmp/importer-apply-summary.json

      - name: Read-only post-import reconciliation
        run: |
          python - <<'PY'
          import hashlib,json,os,psycopg
          from psycopg.rows import dict_row
          expected_source=os.environ['SOURCE_COMMIT']
          expected_counts={'NK_RF':250,'NK_RF_2':522,'APK_RF':402,'KoAP_RF':224,'BK_RF':110,'GK_RF':554,'GK_RF_2':667,'KONST_RF':137}
          report={}
          with psycopg.connect(os.environ['DATABASE_URL'],row_factory=dict_row) as conn:
              conn.execute('set transaction read only')
              with conn.cursor() as cur:
                  cur.execute('select code from law7_mirror.codes order by code'); codes=[r['code'] for r in cur.fetchall()]
                  report['codes']=len(codes)
                  if set(codes)!=set(expected_counts): raise SystemExit(f'code set mismatch: {codes}')
                  cur.execute('select code_id,count(*)::int as n from law7_mirror.article_versions group by code_id order by code_id'); per_code={r['code_id']:r['n'] for r in cur.fetchall()}; report['per_code']=per_code
                  if per_code!=expected_counts: raise SystemExit(f'per-code mismatch: {per_code}')
                  cur.execute('select count(*)::int as n from law7_mirror.article_versions'); report['article_versions']=cur.fetchone()['n']
                  cur.execute('select count(*)::int as n from law7_mirror.amendments'); report['amendments']=cur.fetchone()['n']
                  cur.execute("select count(*)::int as n from law7_mirror.article_versions where btrim(article_text) = ''"); report['blank_text']=cur.fetchone()['n']
                  cur.execute('select count(*)::int as n from (select code_id,article_number,version_date,count(*) from law7_mirror.article_versions group by code_id,article_number,version_date having count(*)>1) d'); report['duplicate_keys']=cur.fetchone()['n']
                  cur.execute('select count(*)::int as n from law7_mirror.article_versions where source_commit <> %s',(expected_source,)); report['provenance_mismatch']=cur.fetchone()['n']
                  cur.execute('select count(*)::int as n from law7_mirror.article_versions where is_current is true'); report['current']=cur.fetchone()['n']
                  cur.execute('select count(*)::int as n from law7_mirror.article_versions where is_repealed is true'); report['repealed']=cur.fetchone()['n']
                  bad_hash=0; cur.execute('select article_text,text_hash from law7_mirror.article_versions')
                  for row in cur: bad_hash += int(hashlib.sha256(row['article_text'].encode('utf-8')).hexdigest()!=row['text_hash'])
                  report['hash_mismatches']=bad_hash
                  cur.execute("select dataset_key,status,source_repository,source_commit,codes_count,article_versions_count,amendments_count,completed_at is not null as has_completed_at from law7_mirror.sync_state where dataset_key='law7_codes'"); report['sync_state']=dict(cur.fetchone())
              conn.rollback()
          expected_sync={'dataset_key':'law7_codes','status':'completed','source_repository':'mikhashev/law7','source_commit':expected_source,'codes_count':8,'article_versions_count':2866,'amendments_count':0,'has_completed_at':True}
          assert report['codes']==8 and report['article_versions']==2866 and report['amendments']==0 and report['blank_text']==0 and report['duplicate_keys']==0 and report['provenance_mismatch']==0 and report['current']==2866 and report['repealed']==0 and report['hash_mismatches']==0 and report['sync_state']==expected_sync
          print(json.dumps(report,ensure_ascii=False,indent=2,default=str)); print('POST_IMPORT_AUDIT=PASS')
          PY

      - name: Record safe result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import base64,json,os,subprocess
          status='PASS' if os.environ['JOB_STATUS']=='success' else 'FAIL'
          body={'status':status,'run_id':int(os.environ['GITHUB_RUN_ID']),'head':os.environ['GITHUB_SHA'],'target_ref':os.environ['TARGET_REF'],'production_write':False,'lovable_write':False}
          content=base64.b64encode((json.dumps(body)+'\n').encode()).decode(); path=f"audit/law7-controlled-preview-apply-result/run-{os.environ['GITHUB_RUN_ID']}.json"; url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}"; payload=json.dumps({'message':f'audit: record controlled Preview apply {status}','content':content,'branch':os.environ['GITHUB_REF_NAME']})
          subprocess.run(['curl','--fail','--silent','--show-error','-X','PUT',url,'-H','Accept: application/vnd.github+json','-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",'-H','X-GitHub-Api-Version: 2022-11-28','-d',payload],check=True)
          PY
