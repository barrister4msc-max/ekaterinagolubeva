name: PR39 Source Freshness Check

on:
  push:
    branches: [feat/source-freshness-change-signal-contract]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freshness_verify
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d freshness_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: PR39 freshness unit tests
        run: bun test supabase/functions/analyze-document-legal-position/source-freshness.test.ts
      - name: PR39 persistence contract test
        run: bun test supabase/tests/source-freshness-change-signal-contract.test.ts
      - name: Execute PR39 migration and runtime assertions
        run: |
          psql -h 127.0.0.1 -U postgres -d freshness_verify -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create table public.legal_source_registry (
            id uuid primary key default gen_random_uuid(),
            official_url text,
            is_active boolean not null default true
          );
          create table public.legal_regulatory_monitored_sources (
            id uuid primary key default gen_random_uuid(),
            source_url text,
            source_type text not null default 'law',
            source_name text not null default 'test',
            title text not null default 'test',
            practice_area text not null default 'tax'
          );
          create table public.legal_regulatory_update_logs (
            id uuid primary key default gen_random_uuid(),
            monitored_source_id uuid,
            created_at timestamptz default now()
          );
          create table public.legal_regulatory_update_alerts (
            id uuid primary key default gen_random_uuid(),
            monitored_source_id uuid,
            created_at timestamptz default now(),
            title text not null default 'test',
            practice_area text not null default 'tax'
          );
          create table public.legal_source_verification_logs (
            id uuid primary key default gen_random_uuid(),
            source_kind text not null,
            status text not null default 'pending'
          );
          SQL
          psql -h 127.0.0.1 -U postgres -d freshness_verify -v ON_ERROR_STOP=1 -f supabase/migrations/20260818203000_source_freshness_change_signal_contract.sql
          psql -h 127.0.0.1 -U postgres -d freshness_verify -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.legal_source_registry(id, official_url, is_active)
          values
            ('00000000-0000-0000-0000-000000000001', 'https://publication.pravo.gov.ru/a', true),
            ('00000000-0000-0000-0000-000000000002', 'https://publication.pravo.gov.ru/b', true);
          insert into public.legal_regulatory_monitored_sources(id, source_url)
          values
            ('10000000-0000-0000-0000-000000000001', 'https://publication.pravo.gov.ru/a'),
            ('10000000-0000-0000-0000-000000000002', 'https://unknown.example/source');

          \i supabase/migrations/20260818203000_source_freshness_change_signal_contract.sql

          do $$ begin
            if (select source_registry_id from public.legal_regulatory_monitored_sources where id='10000000-0000-0000-0000-000000000001')
               <> '00000000-0000-0000-0000-000000000001'::uuid then
              raise exception 'unambiguous official URL must bridge to canonical registry';
            end if;
            if (select source_registry_id from public.legal_regulatory_monitored_sources where id='10000000-0000-0000-0000-000000000002') is not null then
              raise exception 'unknown URL must remain unbridged';
            end if;
          end $$;

          insert into public.legal_source_verification_logs(source_kind, recheck_outcome)
          values
            ('law', 'SOURCE_CHANGED'),
            ('law', 'UNRESOLVED');

          insert into public.legal_regulatory_update_alerts(
            monitored_source_id, source_registry_id, signal_type, research_issue_id, research_issue_text
          ) values (
            '10000000-0000-0000-0000-000000000001',
            '00000000-0000-0000-0000-000000000001',
            'POSITION_UPDATE_AVAILABLE', 'issue-tax-1', 'налоговая реконструкция'
          );

          do $$ begin
            begin
              insert into public.legal_source_verification_logs(source_kind, recheck_outcome)
              values ('law', 'CHANGED');
              raise exception 'invalid recheck outcome unexpectedly accepted';
            exception when check_violation then null;
            end;
            begin
              insert into public.legal_regulatory_update_alerts(signal_type)
              values ('CHANGED');
              raise exception 'invalid signal type unexpectedly accepted';
            exception when check_violation then null;
            end;
          end $$;
          SQL
      - name: Existing Source Metadata regressions
        run: bun test supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts
      - name: Complete Analyzer regressions
        run: bun test supabase/functions/analyze-document-legal-position/*.test.ts supabase/functions/analyze-document-legal-position/tests/*.test.ts
      - name: Diff check
        run: git fetch origin main && git diff --check origin/main...HEAD
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Deno check freshness contract
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/analyze-document-legal-position/source-freshness.ts
