name: temp-audit-existing-supabase-secrets
on:
  push:
    branches:
      - audit/law7-tax-core-execution-gate-20260819
    paths-ignore:
      - 'audit/existing-supabase-secrets/**'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record presence only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LAW7_POC_MIRROR_DATABASE_URL: ${{ secrets.LAW7_POC_MIRROR_DATABASE_URL }}
          LAW7_SOURCE_DATABASE_URL: ${{ secrets.LAW7_SOURCE_DATABASE_URL }}
        run: |
          mkdir -p audit/existing-supabase-secrets
          python - <<'PY'
          import json, os
          names = [
            'SUPABASE_ACCESS_TOKEN','SUPABASE_DB_PASSWORD','DATABASE_URL',
            'SUPABASE_DB_URL','SUPABASE_SERVICE_ROLE_KEY',
            'LAW7_POC_MIRROR_DATABASE_URL','LAW7_SOURCE_DATABASE_URL'
          ]
          out = {name: bool(os.environ.get(name)) for name in names}
          with open('audit/existing-supabase-secrets/presence.json','w') as f:
              json.dump(out,f,indent=2,sort_keys=True)
          PY
      - name: Commit presence report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/existing-supabase-secrets/presence.json
          git commit -m 'audit: record existing Supabase secret presence' || exit 0
          git push
