name: TEMP P0-A source family verification

on:
  push:
    branches:
      - feat/p0a-source-family-orchestration

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Source family and coverage tests
        run: bun test supabase/functions/analyze-document-legal-position/source-family-contract.test.ts supabase/functions/analyze-document-legal-position/research-coverage.test.ts
      - name: Routing and provider regression tests
        run: bun test supabase/functions/analyze-document-legal-position/research-provider-contract.test.ts supabase/functions/analyze-document-legal-position/research-routing.test.ts supabase/functions/analyze-document-legal-position/law7-repository-wiring.test.ts
      - name: Safety and metadata bridge regression tests
        run: bun test supabase/functions/analyze-document-legal-position/provider-safety-contract.test.ts supabase/functions/analyze-document-legal-position/source-metadata-bridge.test.ts supabase/functions/analyze-document-legal-position/source-metadata-merge.test.ts
      - name: Official source regression tests
        run: bun test supabase/functions/analyze-document-legal-position/official-sources.test.ts supabase/functions/analyze-document-legal-position/official-provider-capabilities.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Diff check
        run: git diff --check
      - name: Record verified functional head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: P0-A source family verification passed'
          git push
