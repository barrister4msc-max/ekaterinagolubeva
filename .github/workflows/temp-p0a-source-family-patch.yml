name: TEMP P0-A source family verification

on:
  push:
    branches:
      - feat/p0a-source-family-orchestration

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Source family tests
        run: bun test supabase/functions/analyze-document-legal-position/source-family-contract.test.ts supabase/functions/analyze-document-legal-position/research-coverage.test.ts
      - name: Existing provider/repository tests
        run: bun test supabase/functions/analyze-document-legal-position/research-provider-contract.test.ts supabase/functions/analyze-document-legal-position/repositories.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Diff check
        run: git diff --check
