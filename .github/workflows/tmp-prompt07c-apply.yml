name: TMP Prompt 07C Apply

on:
  push:
    branches:
      - fix/prompt07c-paragraph-provenance-readiness

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/prompt07c-paragraph-provenance-readiness
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply minimal Prompt 07C patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('supabase/functions/review-generated-legal-document/review-outcome.ts')
          text = helper.read_text()
          old = '''export type ReviewOutcome = Record<string, unknown> & {
            review_status?: unknown;
            ready_for_client?: unknown;
            can_be_sent_as_final?: unknown;
            problems?: unknown;
          };

          /**
           * Deterministic fail-closed reconciliation for the existing Reviewer contract.
           * A critical finding cannot coexist with a successful/final review projection.
           * The draft and all findings remain intact; only readiness/status fields are normalized.
           */
          export function normalizeReviewOutcome(input: unknown): ReviewOutcome {
            const review: ReviewOutcome =
              input && typeof input === "object" && !Array.isArray(input)
                ? { ...(input as Record<string, unknown>) }
                : {};

            const problems = Array.isArray(review.problems) ? review.problems : [];
            const hasCriticalFinding = problems.some((problem) => {
              if (!problem || typeof problem !== "object" || Array.isArray(problem)) return false;
              return (problem as Record<string, unknown>).severity === "critical";
            });

            if (!hasCriticalFinding) return review;

            return {
              ...review,
              review_status: "blocked",
              ready_for_client: false,
              can_be_sent_as_final: false,
            };
          }
          '''
          new = '''export type ReviewOutcome = Record<string, unknown> & {
            review_status?: unknown;
            ready_for_client?: unknown;
            can_be_sent_as_final?: unknown;
            problems?: unknown;
          };

          export type ReviewReadinessContext = {
            requiresParagraphProvenance?: boolean;
            paragraphProvenance?: unknown;
          };

          const PARAGRAPH_PROVENANCE_GAP = {
            type: "missing_information",
            severity: "high",
            text_fragment: "",
            problem: "Обязательная трассировка paragraph_provenance отсутствует или пуста.",
            recommendation: "Восстановить paragraph provenance до финального согласования документа.",
          } as const;

          /**
           * Deterministic fail-closed reconciliation for the existing Reviewer contract.
           * Critical findings cannot coexist with a successful/final review projection.
           * A substantive generated document without mandatory paragraph provenance may remain
           * a draft, but cannot retain a successful/final readiness projection.
           */
          export function normalizeReviewOutcome(
            input: unknown,
            context: ReviewReadinessContext = {},
          ): ReviewOutcome {
            const review: ReviewOutcome =
              input && typeof input === "object" && !Array.isArray(input)
                ? { ...(input as Record<string, unknown>) }
                : {};

            const problems = Array.isArray(review.problems) ? review.problems : [];
            const hasCriticalFinding = problems.some((problem) => {
              if (!problem || typeof problem !== "object" || Array.isArray(problem)) return false;
              return (problem as Record<string, unknown>).severity === "critical";
            });

            if (hasCriticalFinding) {
              return {
                ...review,
                review_status: "blocked",
                ready_for_client: false,
                can_be_sent_as_final: false,
              };
            }

            const hasParagraphProvenance =
              Array.isArray(context.paragraphProvenance) &&
              context.paragraphProvenance.length > 0;
            const paragraphProvenanceMissing =
              context.requiresParagraphProvenance === true && !hasParagraphProvenance;

            if (!paragraphProvenanceMissing) return review;

            const alreadyReported = problems.some((problem) => {
              if (!problem || typeof problem !== "object" || Array.isArray(problem)) return false;
              return (problem as Record<string, unknown>).problem === PARAGRAPH_PROVENANCE_GAP.problem;
            });

            return {
              ...review,
              review_status:
                review.review_status === "passed" ? "needs_revision" : review.review_status,
              ready_for_client: false,
              can_be_sent_as_final: false,
              problems: alreadyReported ? problems : [...problems, PARAGRAPH_PROVENANCE_GAP],
            };
          }
          '''
          if old not in text:
              raise SystemExit('review-outcome baseline block not found')
          helper.write_text(text.replace(old, new))

          index = Path('supabase/functions/review-generated-legal-document/index.ts')
          text = index.read_text()
          old_call = '    const review = normalizeReviewOutcome(JSON.parse(raw));'
          new_call = '''    const review = normalizeReviewOutcome(JSON.parse(raw), {
              requiresParagraphProvenance:
                typeof doc.content === "string" && doc.content.trim().length > 0,
              paragraphProvenance: doc.metadata?.paragraph_provenance,
            });'''
          if old_call not in text:
              raise SystemExit('Reviewer normalization call not found')
          index.write_text(text.replace(old_call, new_call, 1))

          test = Path('supabase/functions/review-generated-legal-document/paragraph-provenance-readiness.test.ts')
          test.write_text('''import { describe, expect, test } from "bun:test";\nimport { normalizeReviewOutcome } from "./review-outcome.ts";\n\ndescribe("Prompt 07C paragraph provenance readiness", () => {\n  test("keeps passed when substantive document has paragraph provenance", () => {\n    const result = normalizeReviewOutcome(\n      { review_status: "passed", ready_for_client: true, can_be_sent_as_final: true, problems: [] },\n      { requiresParagraphProvenance: true, paragraphProvenance: [{ paragraph_id: "p_1" }] },\n    );\n\n    expect(result.review_status).toBe("passed");\n    expect(result.ready_for_client).toBe(true);\n    expect(result.can_be_sent_as_final).toBe(true);\n  });\n\n  test("downgrades passed when required paragraph provenance is empty", () => {\n    const result = normalizeReviewOutcome(\n      { review_status: "passed", ready_for_client: true, can_be_sent_as_final: true, problems: [] },\n      { requiresParagraphProvenance: true, paragraphProvenance: [] },\n    );\n\n    expect(result.review_status).toBe("needs_revision");\n    expect(result.ready_for_client).toBe(false);\n    expect(result.can_be_sent_as_final).toBe(false);\n    expect(result.problems).toEqual(expect.arrayContaining([expect.objectContaining({\n      type: "missing_information",\n      severity: "high",\n    })]));\n  });\n\n  test("downgrades passed when required paragraph provenance is missing", () => {\n    const result = normalizeReviewOutcome(\n      { review_status: "passed", ready_for_client: true, can_be_sent_as_final: true, problems: [] },\n      { requiresParagraphProvenance: true },\n    );\n\n    expect(result.review_status).toBe("needs_revision");\n    expect(result.ready_for_client).toBe(false);\n    expect(result.can_be_sent_as_final).toBe(false);\n  });\n\n  test("does not replace an existing blocked outcome", () => {\n    const result = normalizeReviewOutcome(\n      { review_status: "blocked", ready_for_client: false, can_be_sent_as_final: false, problems: [] },\n      { requiresParagraphProvenance: true, paragraphProvenance: [] },\n    );\n\n    expect(result.review_status).toBe("blocked");\n    expect(result.ready_for_client).toBe(false);\n    expect(result.can_be_sent_as_final).toBe(false);\n  });\n\n  test("does not require paragraph provenance for non-substantive content", () => {\n    const result = normalizeReviewOutcome(\n      { review_status: "passed", ready_for_client: true, can_be_sent_as_final: true, problems: [] },\n      { requiresParagraphProvenance: false, paragraphProvenance: [] },\n    );\n\n    expect(result.review_status).toBe("passed");\n    expect(result.ready_for_client).toBe(true);\n    expect(result.can_be_sent_as_final).toBe(true);\n  });\n\n  test("preserves Prompt 07B critical fail-closed precedence", () => {\n    const result = normalizeReviewOutcome(\n      {\n        review_status: "passed",\n        ready_for_client: true,\n        can_be_sent_as_final: true,\n        problems: [{ severity: "critical", problem: "critical legal defect" }],\n      },\n      { requiresParagraphProvenance: true, paragraphProvenance: [] },\n    );\n\n    expect(result.review_status).toBe("blocked");\n    expect(result.ready_for_client).toBe(false);\n    expect(result.can_be_sent_as_final).toBe(false);\n  });\n});\n''')
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Prompt 07C regression
        run: bun test supabase/functions/review-generated-legal-document/paragraph-provenance-readiness.test.ts

      - name: Run adjacent Prompt 07B regression
        run: bun test supabase/functions/review-generated-legal-document/review-outcome.test.ts

      - name: Run adjacent Prompt 07A regression
        shell: bash
        run: |
          if [ -f supabase/functions/analyze-document-legal-position/challenge-readiness-fail-closed.test.ts ]; then
            bun test supabase/functions/analyze-document-legal-position/challenge-readiness-fail-closed.test.ts
          fi

      - name: Diff check
        run: git diff --check

      - name: Commit verified product patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-prompt07c-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/review-generated-legal-document/index.ts \
                  supabase/functions/review-generated-legal-document/review-outcome.ts \
                  supabase/functions/review-generated-legal-document/paragraph-provenance-readiness.test.ts \
                  .github/workflows/tmp-prompt07c-apply.yml
          git commit -m "Fail closed on missing paragraph provenance"
          git push origin HEAD:fix/prompt07c-paragraph-provenance-readiness
