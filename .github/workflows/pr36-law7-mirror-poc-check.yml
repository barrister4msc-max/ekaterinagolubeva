name: PR36 Law7 Mirror PoC Check

on:
  push:
    branches:
      - feat/law7-supabase-mirror-poc
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Law7 transport tests
        run: bun test supabase/functions/analyze-document-legal-position/law7-supabase-transport.test.ts supabase/functions/analyze-document-legal-position/law7-provider.test.ts
      - name: Law7 mirror migration contract tests
        run: bun test supabase/tests/law7-mirror-poc-migration.test.ts
      - name: Apply Law7 mirror migration to disposable PostgreSQL
        shell: bash
        run: |
          psql -h 127.0.0.1 -U postgres -d kati_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          SQL
          psql -h 127.0.0.1 -U postgres -d kati_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260818133000_law7_mirror_poc.sql
          psql -h 127.0.0.1 -U postgres -d kati_test -Atc "select public.law7_mirror_is_available();" | grep '^f$'
      - name: KATI importer synthetic dry-run
        run: python scripts/law7_mirror_import.py --input scripts/fixtures/law7_mirror_poc.synthetic.json
      - name: Complete Analyzer regressions
        run: bun test supabase/functions/analyze-document-legal-position/*.test.ts
      - name: Diff check against main
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Deno check Law7 transport
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/analyze-document-legal-position/law7-supabase-transport.ts
