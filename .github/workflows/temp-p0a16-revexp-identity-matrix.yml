name: TEMP P0-A16 REVEXP identity matrix

on:
  push:
    branches:
      - feat/p0a16-revexp-canonical-identity-matrix
  pull_request:
    branches:
      - feat/p0a15-revexp-runtime-factual-evidence
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0a16-revexp-identity-matrix-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Install
        id: install
        continue-on-error: true
        run: bun install --frozen-lockfile
      - name: REVEXP identity tests
        id: identity
        continue-on-error: true
        run: bun test ./supabase/functions/analyze-document-legal-position/company-financial-statement-identity.test.ts
      - name: REVEXP matrix tests
        id: matrix
        continue-on-error: true
        run: bun test ./supabase/functions/analyze-document-legal-position/company-financial-statement-evidence-matrix.test.ts
      - name: Factual regressions
        id: regressions
        continue-on-error: true
        run: |
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-financial-statement-evidence.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-revexp-runtime.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/fns-company-tax-debt-evidence.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-tax-debt-evidence-matrix.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-factual-identity.test.ts
          bun test ./supabase/functions/analyze-document-legal-position/company-factual-evidence-matrix.test.ts
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: Diff check
        id: diffcheck
        continue-on-error: true
        run: git diff --check origin/feat/p0a15-revexp-runtime-factual-evidence...HEAD
      - name: Record outcomes
        if: always() && github.event_name == 'push'
        env:
          INSTALL: ${{ steps.install.outcome }}
          IDENTITY: ${{ steps.identity.outcome }}
          MATRIX: ${{ steps.matrix.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
        run: |
          cat > .tmp-p0a16-verification-status.txt <<EOF
          install=$INSTALL
          identity=$IDENTITY
          matrix=$MATRIX
          regressions=$REGRESSIONS
          typecheck=$TYPECHECK
          diffcheck=$DIFFCHECK
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-p0a16-verification-status.txt
          git commit -m "chore: record P0-A16 verification outcomes"
          git push origin HEAD:feat/p0a16-revexp-canonical-identity-matrix
      - name: Enforce GREEN
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          IDENTITY: ${{ steps.identity.outcome }}
          MATRIX: ${{ steps.matrix.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
        run: |
          test "$INSTALL" = success
          test "$IDENTITY" = success
          test "$MATRIX" = success
          test "$REGRESSIONS" = success
          test "$TYPECHECK" = success
          test "$DIFFCHECK" = success
