name: PR28 focused builder

on:
  push:
    branches: [feat/focused-document-builder]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[pr28-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/focused-document-builder
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply focused builder changes
        run: python3 scripts/pr28-focused-builder.py
      - name: Focused builder tests
        run: bun test supabase/tests/pr28-focused-builder.test.ts
      - name: Upload regressions
        run: bun test supabase/tests/pr25-upload-lifecycle.test.ts supabase/tests/pr23-document-package-files.test.ts supabase/tests/reliable-intake-excel.test.ts
      - name: Redaction regressions
        run: bun test supabase/tests/pr24-residual-redaction.test.ts supabase/tests/pr22-redaction-ai-fill-safety.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Commit clean PR branch
        run: |
          git config user.name "barrister4msc-max"
          git config user.email "barrister.4.msc@gmail.com"
          git rm .github/workflows/pr28-focused-builder.yml scripts/pr28-focused-builder.py
          git add src/routes/workspace.tsx src/routes/workspace.document-builder.tsx src/components/document-builder/intake-form.tsx supabase/tests/pr28-focused-builder.test.ts
          git commit -m "feat(document-builder): focused three-step workspace [pr28-done]"
          git push origin HEAD:feat/focused-document-builder
