name: PR22 validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/pr22-redaction-ai-fill-safety'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Run PR22 redaction tests
        run: bun test supabase/tests/pr22-redaction-ai-fill-safety.test.ts supabase/tests/pr22-ai-fill-wiring.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Diff check
        run: git diff --check origin/main...HEAD
