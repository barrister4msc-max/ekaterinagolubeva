name: Direct reliable intake v3

on:
  push:
    branches: [fix/reliable-intake-excel]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[direct-intake-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reliable-intake-excel
          fetch-depth: 0

      - name: Reuse validated v2 source patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/direct-reliable-intake-v2.yml').read_text(encoding='utf-8')
          match = re.search(r"python <<'PY'\n(.*?)\n\s*PY\n", workflow, re.S)
          if not match:
              raise SystemExit('Cannot extract v2 Python patch')
          code = match.group(1)
          # YAML run block indents the embedded Python by ten spaces.
          lines = code.splitlines()
          nonempty = [len(line) - len(line.lstrip()) for line in lines if line.strip()]
          indent = min(nonempty) if nonempty else 0
          code = '\n'.join(line[indent:] if len(line) >= indent else line for line in lines)
          exec(compile(code, '<v2-patch>', 'exec'), {})
          PY

      - name: Apply Deno strict-typing compatibility
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/extract-document-text/index.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'import JSZip from "https://esm.sh/jszip@3.10.1";',
              '// @ts-ignore esm.sh JSZip runtime exposes default; declaration omits it\nimport JSZip from "https://esm.sh/jszip@3.10.1";',
              1,
          )
          s = s.replace('zip.forEach((path) => {', 'zip.forEach((path: string) => {', 1)
          s = s.replace('.replace(/<w:p[ >][^]*?<\\/w:p>/g, (p) => p + "\\n")', '.replace(/<w:p[ >][^]*?<\\/w:p>/g, (p: string) => p + "\\n")', 1)
          s = s.replace('supabase: ReturnType<typeof createClient>,', 'supabase: any,')
          p.write_text(s, encoding='utf-8')
          PY

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun test supabase/tests/reliable-intake-excel.test.ts supabase/tests/pr23-upload-orchestration.test.ts supabase/tests/pr23-document-package-files.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Deno check
        run: deno check supabase/functions/extract-document-text/index.ts

      - name: Commit validated implementation
        shell: bash
        run: |
          git rm .github/workflows/direct-reliable-intake-v2.yml .github/workflows/direct-reliable-intake-v3.yml
          git config user.name "barrister4msc-max"
          git config user.email "barrister.4.msc@gmail.com"
          git add src/lib/document-package-files.ts src/lib/upload-lifecycle.ts src/components/document-builder/intake-form.tsx supabase/functions/extract-document-text/index.ts supabase/functions/_shared/xlsx-text.ts supabase/tests/reliable-intake-excel.test.ts supabase/tests/pr23-document-package-files.test.ts
          git commit -m "fix(document-intake): guarantee selected files and extract XLSX [direct-intake-done]"
          git push origin HEAD:fix/reliable-intake-excel
