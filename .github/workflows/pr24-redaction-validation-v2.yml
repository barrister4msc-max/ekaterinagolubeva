name: PR24 redaction validation v2

on:
  push:
    branches: [fix/pr24-residual-redaction-safety]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Redaction tests
        run: bun test supabase/tests/pr24-residual-redaction.test.ts supabase/tests/pr22-redaction-ai-fill-safety.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
