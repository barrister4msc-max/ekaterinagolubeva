name: PR Quality Gate

on:
  pull_request:
    branches:
      - main
      - feat/p0a-taxoffence-runtime
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-validation:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          actionlint_dir="$RUNNER_TEMP/actionlint-1.7.12"
          mkdir -p "$actionlint_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$actionlint_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $actionlint_dir/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
          echo "$actionlint_dir" >> "$GITHUB_PATH"

      - name: Validate all workflow YAML and expression contexts
        # Scope this gate to Actions syntax, types and expressions. Embedded
        # shell/Python lint is separate; no workflow error rules are ignored.
        run: actionlint -shellcheck= -pyflakes=

  quality:
    name: Linux quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      # Linux is intentional: the local Windows Bun 1.3.14 full-suite crash
      # must not be confused with a project test failure.
      - name: Run full JavaScript test suite
        run: bun test

      - name: Run TypeScript typecheck
        run: bun run typecheck

      - name: Run production build
        run: bun run build

      - name: Run FNS contract tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/test_fns_open_data_taxoffence_storage.py ]]; then
            python scripts/test_fns_open_data_taxoffence_storage.py
          fi
          if [[ -f scripts/test_fns_open_data_taxoffence_import_manifest.py ]]; then
            python scripts/test_fns_open_data_taxoffence_import_manifest.py
          fi
          if [[ -f scripts/test_fns_open_data_taxoffence_dry_run.py ]]; then
            python scripts/test_fns_open_data_taxoffence_dry_run.py --help
          fi

      - name: Verify repository has no accidental generated changes
        run: git diff --exit-code
