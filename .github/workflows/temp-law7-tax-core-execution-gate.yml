name: TEMP Law7 TAX CORE Execution Gate

on:
  push:
    branches:
      - audit/law7-tax-core-execution-gate-20260819

permissions:
  contents: read

env:
  EXPECTED_BACKUP_SHA256: 70a1d8fc6b27b67ad7f12f03f017d02b5f68a0c895447159039800965895f8b2
  BACKUP_PATH: /tmp/law7_backup_20260211_014519.tar.gz
  DUMP_PATH: /tmp/law7_backup_20260211_014519/postgresql/law7.dump
  EXPORT_PATH: /tmp/law7_tax_core.json
  REPORT_PATH: /tmp/law7_tax_core_report.json
  LAW7_SOURCE_DATABASE_URL: postgresql://law7:postgres@127.0.0.1:5432/law7
  PGPASSWORD: postgres

jobs:
  execution-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: law7
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: law7
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U law7 -d law7"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact audit branch based on main
        uses: actions/checkout@v4

      - name: Assert audit branch parent is PR41 main
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "6609067b33453e1afb154f297495f1f57a41fdef"
          git show -s --format='%H %s' "$BASE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install disposable tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4" gdown
          pg_restore --version
          psql --version

      - name: Download exact published Law7 backup and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          gdown --fuzzy "https://drive.google.com/file/d/1DPLpFpuwUZbLZEGo2TxnCAcLRdb2V1aD/view?usp=sharing" -O "$BACKUP_PATH"
          ACTUAL="$(sha256sum "$BACKUP_PATH" | awk '{print $1}')"
          echo "actual_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_BACKUP_SHA256"
          tar -tzf "$BACKUP_PATH" >/tmp/tar_inventory.txt
          grep -Fx 'law7_backup_20260211_014519/postgresql/law7.dump' /tmp/tar_inventory.txt
          tar -xzf "$BACKUP_PATH" -C /tmp 'law7_backup_20260211_014519/postgresql/law7.dump'
          test -s "$DUMP_PATH"

      - name: Audit dump dependencies before restore
        shell: bash
        run: |
          set -euo pipefail
          pg_restore --list "$DUMP_PATH" >/tmp/law7_restore.list
          echo 'Extensions declared in dump:'
          grep ' EXTENSION ' /tmp/law7_restore.list || true
          grep -q 'EXTENSION.*uuid-ossp' /tmp/law7_restore.list
          grep -q 'EXTENSION.*pg_trgm' /tmp/law7_restore.list

      - name: Restore PostgreSQL backup into disposable PostgreSQL 15
        shell: bash
        run: |
          set -euo pipefail
          pg_restore \
            --host=127.0.0.1 \
            --username=law7 \
            --dbname=law7 \
            --no-owner \
            --no-acl \
            --exit-on-error \
            "$DUMP_PATH"
          psql "$LAW7_SOURCE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'select version();'

      - name: Read-only TAX CORE SQL inventory
        shell: bash
        run: |
          set -euo pipefail
          psql "$LAW7_SOURCE_DATABASE_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' | tee /tmp/sql_inventory.txt
          begin read only;
          select code, count(*) as articles
          from code_article_versions
          where code_id in ('NK_RF','NK_RF_2','APK_RF','KoAP_RF','BK_RF','GK_RF','GK_RF_2','KONST_RF','KAS_RF')
          group by code
          order by code;

          select code_id,
                 count(distinct article_number) as articles,
                 count(*) as versions,
                 count(*) filter (where is_current) as current_versions,
                 count(*) filter (where is_repealed) as repealed_versions,
                 min(version_date) as min_date,
                 max(version_date) as max_date,
                 count(*) filter (where nullif(btrim(article_text),'') is null) as blank_text,
                 count(*) filter (where version_date is null) as missing_dates,
                 count(*) filter (where nullif(btrim(text_hash),'') is null) as missing_hashes
          from code_article_versions
          where code_id in ('NK_RF','NK_RF_2','APK_RF','KoAP_RF','BK_RF','GK_RF','GK_RF_2','KONST_RF','KAS_RF')
          group by code_id
          order by code_id;

          select code_id, article_number, version_date, count(*)
          from code_article_versions
          where code_id in ('NK_RF','NK_RF_2','APK_RF','KoAP_RF','BK_RF','GK_RF','GK_RF_2','KONST_RF','KAS_RF')
          group by code_id, article_number, version_date
          having count(*) > 1;

          with c as (
            select code_id, article_number,
                   count(*) filter (where is_current) as current_count
            from code_article_versions
            where code_id in ('NK_RF','NK_RF_2','APK_RF','KoAP_RF','BK_RF','GK_RF','GK_RF_2','KONST_RF','KAS_RF')
            group by code_id, article_number
          )
          select
            count(*) filter (where current_count=0) as zero_current,
            count(*) filter (where current_count>1) as multiple_current
          from c;

          select code_id, count(*) as applied_amendments,
                 min(amendment_date) as min_date,
                 max(amendment_date) as max_date
          from amendment_applications
          where code_id in ('NK_RF','NK_RF_2','APK_RF','KoAP_RF','BK_RF','GK_RF','GK_RF_2','KONST_RF','KAS_RF')
            and status='applied'
          group by code_id
          order by code_id;
          rollback;
          SQL

      - name: Run actual merged PR41 controlled exporter read-only
        shell: bash
        env:
          LAW7_SOURCE_COMMIT: 70a1d8fc6b27b67ad7f12f03f017d02b5f68a0c895447159039800965895f8b2
        run: |
          set -euo pipefail
          python scripts/law7_controlled_export.py \
            --source-database-url "$LAW7_SOURCE_DATABASE_URL" \
            --source-commit "$LAW7_SOURCE_COMMIT" \
            --codes NK_RF NK_RF_2 APK_RF KoAP_RF BK_RF GK_RF GK_RF_2 KONST_RF KAS_RF \
            --output "$EXPORT_PATH" | tee /tmp/export_summary.json

      - name: Run actual merged importer dry-run only
        shell: bash
        run: |
          set -euo pipefail
          env -u DATABASE_URL python scripts/law7_mirror_import.py --input "$EXPORT_PATH" | tee /tmp/importer_dry_run.json

      - name: Full normalized JSON integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python - "$EXPORT_PATH" "$REPORT_PATH" <<'PY'
          import hashlib, json, re, sys
          from collections import Counter, defaultdict
          from datetime import date

          src, report_path = sys.argv[1:]
          data = json.load(open(src, encoding='utf-8'))
          expected_counts = {
              'NK_RF': 250,
              'NK_RF_2': 522,
              'APK_RF': 402,
              'KoAP_RF': 224,
              'BK_RF': 110,
              'GK_RF': 554,
              'GK_RF_2': 667,
              'KONST_RF': 137,
          }
          assert data['dataset_key'] == 'law7_codes'
          assert data['source_repository'] == 'mikhashev/law7'
          assert data['source_commit'] == '70a1d8fc6b27b67ad7f12f03f017d02b5f68a0c895447159039800965895f8b2'
          assert [x['code'] for x in data['codes']] == list(expected_counts)
          assert data.get('unavailable_codes') == ['KAS_RF'], data.get('unavailable_codes')
          versions = data['article_versions']
          amendments = data['amendments']
          assert len(versions) == 2866, len(versions)
          assert len(amendments) == 0, len(amendments)
          per_code = Counter(x['code_id'] for x in versions)
          assert dict(per_code) == expected_counts, per_code

          keys = [(x['code_id'], str(x['article_number']), x['version_date']) for x in versions]
          assert len(keys) == len(set(keys)), 'duplicate version keys'
          assert all(str(x['article_text']).strip() for x in versions), 'blank article text'
          assert all(x['version_date'] for x in versions), 'missing version date'
          for x in versions:
              date.fromisoformat(x['version_date'])
          assert all(re.fullmatch(r'[0-9a-f]{64}', x['text_hash']) for x in versions), 'bad hash format'
          mismatches = [
              (x['code_id'], x['article_number']) for x in versions
              if hashlib.sha256(x['article_text'].encode('utf-8')).hexdigest() != x['text_hash']
          ]
          assert not mismatches, f'hash mismatches: {mismatches[:10]}'
          assert all(x['is_current'] is True for x in versions)
          assert all(x['is_repealed'] is False for x in versions)

          report = {
              'status': 'PASS',
              'backup_sha256': data['source_commit'],
              'codes': len(data['codes']),
              'article_versions': len(versions),
              'amendments': len(amendments),
              'unavailable_codes': data.get('unavailable_codes'),
              'per_code': expected_counts,
              'duplicate_version_keys': 0,
              'blank_article_text': 0,
              'invalid_dates': 0,
              'bad_or_mismatched_hashes': 0,
              'all_current': True,
              'all_not_repealed': True,
              'importer_limits': {'codes': '8/32', 'article_versions': '2866/25000', 'amendments': '0/25000'},
          }
          json.dump(report, open(report_path, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          sha256sum "$EXPORT_PATH" | tee /tmp/export_json.sha256

      - name: Upload execution-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: law7-tax-core-execution-gate
          path: |
            /tmp/export_summary.json
            /tmp/importer_dry_run.json
            /tmp/sql_inventory.txt
            /tmp/law7_tax_core_report.json
            /tmp/export_json.sha256
          retention-days: 1
