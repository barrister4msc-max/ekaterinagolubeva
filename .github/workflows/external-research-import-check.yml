name: External Research Import Check

on:
  pull_request:
    branches:
      - feat/official-legal-sources-layer
  push:
    branches:
      - feat/external-legal-research-import

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: External research import tests
        run: bun test supabase/functions/analyze-document-legal-position/external-research-import.test.ts
      - name: Analyzer tests
        run: bun test supabase/functions/analyze-document-legal-position/*.test.ts
      - name: Diff check
        run: git diff --check origin/feat/official-legal-sources-layer...HEAD
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
