name: PR31 activity match and builder exit

on:
  push:
    branches: [fix/registry-activity-match-and-builder-exit]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[pr31-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/registry-activity-match-and-builder-exit
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply patch
        run: python3 .github/pr31_activity_menu_fix.py
      - name: PR31 regressions
        run: bun test supabase/tests/pr31-activity-match-and-builder-exit.test.ts
      - name: Registry regressions
        run: bun test supabase/tests/pr27-company-registry.test.ts supabase/tests/pr29-registry-canonical-and-contrast.test.ts
      - name: Focused builder regressions
        run: bun test supabase/tests/pr28-focused-builder.test.ts
      - name: Upload regressions
        run: bun test supabase/tests/pr23-document-package.test.ts supabase/tests/pr23-upload-orchestration.test.ts supabase/tests/pr27-reliable-intake-excel.test.ts
      - name: Privacy regressions
        run: bun test supabase/tests/pr22-redaction-ai-fill-safety.test.ts supabase/tests/pr22-ai-fill-wiring.test.ts supabase/tests/pr24-residual-redaction.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check registry function
        run: deno check --no-lock supabase/functions/company-registry-lookup/index.ts
      - name: Commit clean PR branch
        shell: bash
        run: |
          rm -f .github/pr31_activity_menu_fix.py .github/workflows/pr31-activity-menu-fix.yml deno.lock
          git config user.name "barrister4msc-max"
          git config user.email "barrister.4.msc@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(registry): require OKVED match for document activity fallback [pr31-done]"
          git push origin HEAD:fix/registry-activity-match-and-builder-exit
