name: PR38 Law7 Historical Verification Check

on:
  push:
    branches: [feat/law7-historical-verification-gate]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: law7_verify
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d law7_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: PR38 contract test
        run: bun test supabase/tests/law7-article-temporal-verification.test.ts
      - name: Existing Law7 regressions
        run: bun test supabase/tests/law7-controlled-real-data-poc.test.ts supabase/functions/analyze-document-legal-position/law7-supabase-transport.test.ts supabase/functions/analyze-document-legal-position/law7-repository-wiring.test.ts supabase/functions/analyze-document-legal-position/law7-provider.test.ts
      - name: Execute Law7 migrations and runtime scope assertions
        run: |
          psql -h 127.0.0.1 -U postgres -d law7_verify -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role;"
          psql -h 127.0.0.1 -U postgres -d law7_verify -v ON_ERROR_STOP=1 -f supabase/migrations/20260818133000_law7_mirror_poc.sql
          psql -h 127.0.0.1 -U postgres -d law7_verify -v ON_ERROR_STOP=1 -f supabase/migrations/20260818152000_law7_mirror_temporal_fail_closed.sql
          psql -h 127.0.0.1 -U postgres -d law7_verify -v ON_ERROR_STOP=1 -f supabase/migrations/20260818173000_law7_article_temporal_verifications.sql
          psql -h 127.0.0.1 -U postgres -d law7_verify -v ON_ERROR_STOP=1 <<'SQL'
          insert into law7_mirror.codes(code,name) values ('NK_RF','НК РФ');
          insert into law7_mirror.article_versions(code_id,article_number,version_date,article_text,is_current,text_hash)
          values
            ('NK_RF','54.1','2000-07-31','article-54.1-text',true,'hash-54.1'),
            ('NK_RF','88','2000-07-31','article-88-text',true,'hash-88');
          insert into law7_mirror.sync_state(dataset_key,status,source_repository,article_versions_count,metadata)
          values ('law7_codes_poc','completed','test',2,'{"historical_coverage":"verified"}'::jsonb);

          do $$ begin
            if (select count(*) from public.law7_mirror_get_article_version('NK_RF','54.1','2021-01-01')) <> 0 then
              raise exception 'global sync_state must not unlock 54.1';
            end if;
            if (select count(*) from public.law7_mirror_get_article_version('NK_RF','88','2021-01-01')) <> 0 then
              raise exception 'global sync_state must not unlock 88';
            end if;
          end $$;

          insert into law7_mirror.temporal_verifications(
            code_id, article_number, version_date, verified_text_hash,
            effective_from, effective_to, status, official_provider,
            official_document_number, official_document_date,
            official_publication_url, verification_method, verified_at
          ) values (
            'NK_RF','54.1','2000-07-31','WRONG-HASH',
            '2017-08-19',null,'verified','pravo',
            '163-ФЗ','2017-07-18',
            'https://publication.pravo.gov.ru/Document/View/test',
            'official_document',now()
          );

          do $$ begin
            if (select count(*) from public.law7_mirror_get_article_version('NK_RF','54.1','2021-01-01')) <> 0 then
              raise exception 'wrong text hash must fail closed';
            end if;
          end $$;

          insert into law7_mirror.temporal_verifications(
            code_id, article_number, version_date, verified_text_hash,
            effective_from, effective_to, status, official_provider,
            official_document_number, official_document_date,
            official_publication_url, verification_method, verified_at
          ) values (
            'NK_RF','54.1','2000-07-31','hash-54.1',
            '2017-08-19',null,'verified','pravo',
            '163-ФЗ','2017-07-18',
            'https://publication.pravo.gov.ru/Document/View/test',
            'official_document',now()
          );

          do $$ begin
            if (select count(*) from public.law7_mirror_get_article_version('NK_RF','54.1','2016-01-01')) <> 0 then
              raise exception 'date before verified effective_from must fail closed';
            end if;
            if (select count(*) from public.law7_mirror_get_article_version('NK_RF','54.1','2021-01-01')) <> 1 then
              raise exception 'verified 54.1 interval should unlock exact candidate';
            end if;
            if (select count(*) from public.law7_mirror_get_article_version('NK_RF','88','2021-01-01')) <> 0 then
              raise exception 'verification for 54.1 must not unlock 88';
            end if;
            if (select count(*) from public.law7_mirror_trace_amendment_history('NK_RF','54.1',20)) <> 1 then
              raise exception 'verified 54.1 version should appear in history';
            end if;
            if (select count(*) from public.law7_mirror_trace_amendment_history('NK_RF','88',20)) <> 0 then
              raise exception 'unverified 88 history must stay closed';
            end if;
          end $$;
          SQL
      - name: Complete Analyzer regressions
        run: bun test supabase/functions/analyze-document-legal-position/*.test.ts
      - name: Diff check
        run: git fetch origin main && git diff --check origin/main...HEAD
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Deno check Law7 runtime
        run: |
          deno check --no-lock --node-modules-dir=auto supabase/functions/analyze-document-legal-position/law7-supabase-transport.ts
          deno check --no-lock --node-modules-dir=auto supabase/functions/analyze-document-legal-position/repositories.ts
